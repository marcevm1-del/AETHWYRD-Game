["Hippo Clan","The River-Lords","zaruma","Hippo-folk in naval coats and generals' uniforms, enormously dignified.","They control the river fords on the gold road and charge tolls in gold, which makes them Mansacor's next target.","The River-Lords will close the fords to everyone until the manticore is dead."],
["Human clan","The Folk of Aldmere","aldmere","Ordinary humans: scholars, knights, archers, climbers.","The baseline people of the heartland, varied and stubborn, alongside the Veilborn who were summoned among them.","A family claims a Veilborn ancestor and has proof no one wants to see."],
["Hyena Clan","The Laughing Packs","fanghold","Spotted hyena-folk raiders and scouts, some in Kade's pay.","Scavenger clans who follow the herds and the armies; half serve Kade, half despise him.","A Laughing Pack chief will betray Kade if someone can promise her people the well."],
["Infected Clan","The Spore-Touched","sylvaran","People and beasts warped by fungus: swollen limbs, bark skin, glowing growths.","Those Mycelia's spores have claimed. They still remember, faintly, who they were.","A Spore-Touched elf wrote a letter home in fungus, and the court has asked someone to read it."],
["Insecta Clan","The Carapace","mossdeep","Mantis-, wasp- and beetle-folk in chitin armour with gauze wings.","Insect-folk who live in Mossdeep's ferns and are uneasy allies of the Thimblefolk; Mother Webcrawler hunts them too.","The Carapace will help fight Mother Webcrawler if the Thimblefolk stop keeping aphids."],
["Jackal Clan","The Sable Guides","sunscar","Black jackal-headed figures in suits or linen, with staffs and gold.","Guides of the dead and of caravans, who know every safe path through the dunes.","A Sable Guide has been asked to guide a caravan to a city that no longer exists."],
["Leopard/Cheetah Clan","The Jaguar Lodge","xochitl_mire","Spotted cat-warriors in jade and feathers, fast and fierce.","The Jaguar lodge of the river-cities' warrior orders, night-hunters on the canoe-roads.","The Jaguar lodge has lost a warrior to Xibalbar and wants the head that took him."],
["Lion Clan","The Pridelands","zaruma","Lion-folk kings and bards with great manes, from warriors to guitar-playing poets.","The royal lineage of Zaruma, who rule by generosity and are shamed by the gold road's closing.","A Pride prince wants to hunt Mansacor alone to prove himself."],
["Lizard Clan","The Scaled Lodges","xochitl_mire","Lizard-folk hunters and archers in jungle camouflage.","Jungle scouts and trappers who know the swamp's paths better than anyone.","A Scaled Lodge trapper has found Xibalbar's nest."],
["Manta clan","The Raywings","true_name_isles","Manta-ray folk gliding through water, sleek and graceful.","Sea-people who carry the Naming Voyagers through the currents to the Naming Rocks.","The Raywings refuse to carry any more children until the Nameless Tide is gone."],
["Medusae Clan","The Drifting","hollow_sea","Jellyfish-folk with luminous trailing bodies and crowns of light.","They light the Hollow Sea and guide the boat-towns. The Lumen-Eater imitates them.","A Drifting elder suspects one of her people is the Lumen-Eater's lure."],
["Merfolk Clan","The Lagoon Folk","lirian","Merfolk with fins, tridents and coral crowns; some with octopus hair.","The sea-elves and merfolk of Lirian's outer lagoon, trading through water-gates.","The Lagoon Folk know where the Drowned Choir sleeps by day."],
["Moth Clan","The Lanternwings","lustrine_shores","Moth-folk with pale wings and huge dark eyes, drawn to light.","They gather the moon-glass by night and are the first to lose their light to Ilyanthe.","A Lanternwing has flown toward the red moon and not come back."],
["Monk Clan","The Hundred-Stair Monks","shen_lu","Monks in robes and bandages, martial artists of fire and staff.","The martial monks of Shen-Lu's sects, split into orders devoted to fire, stillness and the staff, who settle doctrine by duel.","A monk has broken her vow of stillness to fight the Colossus."],
["Mouse/Rat Clan","The Undercity Whiskers","cinderhole","Rat-folk in scavenged armour, alchemists with green fire, swashbucklers.","Rat-folk of Cinderhole's lowest tunnels, smugglers and mask-makers.","A rat-folk mask-maker can make a mask that filters Vasque's smoke."],
["Mushroom clan","The Capfolk","mossdeep","Walking mushrooms of every size, from tiny sprouts to towering bruisers.","Mushroom-folk who live alongside the Thimblefolk and the beetles; Mycelia is their nightmare cousin.","A Capfolk elder says the Spore Lord was once one of them."],
["Octopoda Clan","The Inkwardens","hollow_sea","Octopus-folk with tentacled lower bodies, tridents and ink.","Deep sea-folk of the Hollow Sea, keepers of the deepest charts.","An Inkwarden has charted the Lumen-Eater's hunting grounds."],
["Orc Clan","The Hill-Orcs","moraveil","Orcs of every temperament: shamans, warriors, a red-bearded elder.","Wild orc clans of Moraveil's northern hills; some follow Grakkus, some fear him.","An orc shaman wants to warn the truce council, and needs an escort to reach it alive."],
["Orcinus Clan","The Orca Lords","whitewater_reach","Orca-folk, black and white, huge and powerful.","Sea-hunters who share the fishing grounds with the villages and fear the Ice-Jaw.","The Orca Lords will hunt Ysgrath if the villages lend them their best harpoons."],
["Otter Clan","The Canal Otters","lirian","Otter-folk gondoliers, archers and gentlemen.","Lirian's gondoliers and divers, cheerful and nosy.","A canal otter has heard the Drowned Choir and wants to follow it, with someone holding the rope."],
["Oxen Clan","The Stillhorns","quaking_lands","Minotaur and ox-folk, heavy-horned and patient.","Herders and tremor-readers of the Quaking Lands, who feel quakes through their hooves.","A Stillhorn elder has felt something in the ground that is not Quakeback."],
["Owl Clan","The Scholar Owls","haneul","Owl-folk scholars and sentinels with feathered robes.","The examination-masters of Haneul, who see in the dark and remember everything.","A Scholar Owl has failed a candidate who might have saved the wall."],
["Panda Clan","The Brew-Bears","shen_lu","Panda-folk brewers, monks and martial artists.","Shen-Lu's brewers and wandering fighters, beloved at every crossroads.","A Brew-Bear's spirit wine might restore drained qi, if someone can fetch the herbs."],
["Pangolin Clan","The Plateback","dunewhale_drift","Pangolin-folk with overlapping scales, curling into balls for defence.","Riders of Thalassa who patch her hide and polish her barnacles.","A Plateback has found a wound on Thalassa's back that goes very deep."],
["Panthar Clan","The Velvet Knives","cinderhole","Panther-folk assassins and thieves in black.","Cinderhole's quietest guild, who sell secrets to Vasque and his enemies alike.","A Velvet Knife has been hired to kill the alchemist who could put out the fires."],
["Penguin Clan","The Floe-Knights","whitewater_reach","Penguin-folk knights with round shields and ice spears.","Defenders of the ice villages, formal and fearless.","The Floe-Knights have challenged Ysgrath to single combat."],
["Pirate Clan","The Free Captains","goldmere_coast","Pirates of every kind: swashbucklers, quartermasters, gunners.","Goldmere's elected captains and their crews.","A Free Captain wants a truce with the port to fight the Krakenmother."],
["Polar Bear Clan","The Iceclaws","whitewater_reach","Polar-bear-folk shamans and warriors with lightning in their fists.","Shamans and hunters of the ice, who call storms against the leviathan.","An Iceclaw shaman is losing her storms."],
["Raven/Crow Clan","The Plague-Beaks","strife_marches","Crow-folk in plague-doctor masks and long coats.","Battlefield healers and grave-keepers who follow every army.","A Plague-Beak has noticed that the Choir's dead do not rot."],
["Red Panda Clan","The Ember-tails","hoshizora","Red-panda-folk adventurers, archers and street kids.","Cheerful wanderers of the bamboo villages.","An Ember-tail kid has stolen one of Kurogane's masks."],
["Rhino Clan","The Hornwall","bastion","Rhino-folk masons and brawlers, heavily armoured.","Bastion's master masons, who build the new rings.","A Hornwall mason has found sabotage in the foundations."],
["Romanian Clan","The Legions","vharlen","Roman-style legionaries in segmented armour with red cloaks.","Vharlen's legions, drilled from childhood, who carry their founders' pledge into every battle and bury their standards with their dead.","A legion has lost its standard to Morvane."],
["Satyr/Faun Clan","The Pipers","everdusk","Satyrs and fauns with goat legs, pipes and spears.","Musicians and messengers of both courts, who are allowed to cross between them.","A Piper has been forbidden from playing, and the forest is going quiet."],
["Scorpiones Clan","The Sand-Stingers","sunscar","Scorpion-bodied folk with human torsos.","Nomads of the deep desert who guard the Colossus's path.","The Sand-Stingers want the Colossus stopped without being destroyed."],
["Seal CLAN","The Selkies","frostveil","Seal-folk who can shed their skins.","Fjord-folk who trade with the longhouses and marry into them.","A selkie's skin has been stolen by a jarl's son."],
["Shade Clan","The Hollow Ones","umbravel","Living shadows and silhouettes with long limbs.","Shadow-folk of the deepest webs, who never come into the light.","A Hollow One has started casting a shadow of its own."],
["Shark Clan","The Reef-Sharks","goldmere_coast","Shark-folk, from naval officers to gaping monsters.","Hunters and enforcers of the reefs, hired by both port and pirates.","The Reef-Sharks have stopped hunting near the wreck-tide; they are afraid."],
["Snake Clan","The Coilborn","zarvan","Naga-like serpent-folk with swords and spears.","Guardians of the garden springs, old allies of the divs.","A Coilborn guardian knows where the original treaty is carved."],
["Snail Clan","The Shellmoot","greymoor","Snail-folk, slow and wise, in moss-grown shells.","Greymoor's oldest folk, who remember the abbey on dry ground.","A Shellmoot elder remembers what the abbey was built to hold down."],
["Sloth Clan","The Slow Sages","lumbaya","Sloth-folk of great patience, in robes and halos.","Lumbaya's canopy-dwelling sages, who keep the old star-records.","A Slow Sage has been watching the sky for twenty years and finally has something to say."],
["Stork/ibis Clan","The Ibis Scribes","zarvan","Ibis- and stork-folk scribes in robes, with staffs and scrolls.","Zarvan's poets and archivists, keepers of the universities.","An Ibis Scribe has found a poem that could end the div war."],
["Tiger Clan","The Tigerguard","haneul","Tiger-folk warriors and monks, striped and powerful.","Haneul's elite wall-guard.","A Tigerguard captain has been accused of treason by the Scholar Owls."],
["Troll Clan","The Moss-Trolls","frostveil","Huge mossy trolls, some carrying boulders.","Trolls of the fjord forests, wary of humans and terrified of Ymgrir.","A Moss-Troll has come to the longhouses asking for shelter."],
["Turtle Clan","The Shell-Sages","kitsune_isles","Turtle-folk in samurai armour and robes, slow and wise.","Keepers of the islands' oldest contracts.","A Shell-Sage remembers the broken promise that sank an island."],
["Undead Egyptian Clan","The Unburied Court","sunscar","Mummified kings and soldiers in gold and linen.","The vanished empire's dead, waiting in the Sunken Towers.","The Unburied Court wants the Colossus to finish its route."],
["Undead Skeleton Clan","The Barrow-Host","aldmere","Skeletal knights and kings in rusted crowns.","Ashgrave's host from the Greyhollow barrows.","A skeleton knight in Ashgrave's host still wears the colours of a living family."],
["Undead skeleton pirate Clan","The Drowned Crews","goldmere_coast","Skeleton pirates on ghost ships.","Crews the wreck-tide brought home dead.","A Drowned Crew wants to finish its last voyage."],
["Vampire Clan","The Red Barons","strife_marches","Vampire nobles and beasts, red-eyed and elegant.","Old blood-lords of the ruined castles who profit from every war.","A Red Baron has offered to fight the Choir of Chains, for a price."],
["Whale Clan","The Whale-Singers","dunewhale_drift","Whale-folk, huge and gentle.","The singers who speak to Thalassa.","A Whale-Singer has heard another sand-whale singing."],
["Wolf Clan","The Wolfkin","fanghold","Wolf-folk in armour and cloaks, from wanderers to kings.","The wolfkin clans of the steppe, who trace descent through their grandmothers and follow the herds from pasture to pasture.","A wolfkin grandmother wants her grandchildren back from Kade."],
["Yeti Clan","The Snowmanes","heavenreach","White-furred yetis, huge and shaggy.","Snowline dwellers who carry goods up the Long Stair for the Heavenfolk.","A Snowmane porter has seen Aquilon take a child."],

0:{origin:"Built as automaton porters by Gearholm's founders, the first Clockborn woke during a hard winter when the Great Engines ran hot for forty days. They asked for names, and the council has never decided whether to give them.",
society:"A guild of equals ranked by years of service, not by make. Each Clockborn chooses a name and a number; the number counts how many times it has been rebuilt.",
beliefs:"They believe a mind is whatever keeps choosing, and they record every choice they make in brass ledgers.",
relations:"Uneasy with the guild-masters who own their papers; close to the Undercity boiler-tenders; terrified of Cogmaw, who sees them as spare parts.",
war:"They fight only in defence, with bladed forearms and shock-staves, and never leave a fallen Clockborn behind.",
trade:"Repairs, archiving, precise measurement and labour that never tires.",
npcs:[["Seven-of-Brass","Archivist and leader","Has rebuilt itself seven times and remembers each version."],["Lattice-Nine","Warden captain","Patrols the middle tiers; distrusts every human by default and helps them anyway."],["Tock","Unwound runaway","Removed its own governor and now sells its services in the Undercity."]],
strengths:"Tireless, precise, immune to poison and fear.",weaknesses:"Rust, lightning, and laws that call them property.",
quests:["Win the Clockborn a seat on the council by proving one of them saved a guild-master's life.","Recover the founders' blueprint that names who really built the first automaton."],
gameplay:"Companion-class allies for engineering and archive puzzles; Cogmaw's corrupted Clockborn appear as enemy variants."},
1:{origin:"The first Cog-Touched were boiler-tenders who slept beside a Great Engine the night Cogmaw woke. Since then, anyone touched by its gremlins long enough begins to change.",
society:"Not a people by choice. The Undercity hides early cases in a quarter called the Rattle, where they look after each other before the Engine King takes them.",
beliefs:"Early stages cling to their names; late stages hear one voice and call it the King.",
relations:"Pitied by the Undercity, feared by the upper city, hunted by the council's cleaners.",
war:"Early stages fight to stay free; late stages fight for Cogmaw with lamp-eyes and steam-claws.",
trade:"None of their own; the Rattle survives on charity and smuggled medicine.",
npcs:[["Maren Vey","The Half-Wound","A boiler-tender with one mechanical hand who can hear Cogmaw think."],["Old Hiss","Pipe-Choir","Hums the Engine King's tune and writes down the words when he can."],["Sister Brask","Healer of the Rattle","A gnome surgeon who slows the change with cold water and stubbornness."]],
strengths:"Strong, heat-proof, connected to Cogmaw's thoughts.",weaknesses:"The change is slow but certain; magnets and silence disrupt them.",
quests:["Find a cure in the founders' instructions before Maren loses her other hand.","Use a Pipe-Choir to eavesdrop on Cogmaw's plans."],
gameplay:"Infection stages map to enemy tiers; curing named Cog-Touched unlocks an Undercity reputation track."},
2:{origin:"The Vanari say their founder stole a peach of immortality from the mountain gods and was sealed beneath a peak for five hundred years. When he was freed, he founded a sect so no one would have to steal again.",
society:"A martial sect organised by staff-rank; every member owes the sect three years of service and then may leave.",
beliefs:"Mischief is a teacher; pride is the only true sin.",
relations:"Rivals of every other sect in Shen-Lu, friends with the Brew-Bears, guardians of the sealed peak's orchard.",
war:"Acrobatic staff fighters who strike from rooftops, ropes and cliff-edges.",
trade:"Peaches, staff training and the occasional stolen manual returned for a fee.",
npcs:[["Grandmaster Hou Shan","The Peach Thief's Heir","Old, laughing and dangerous; never answers a question directly."],["Lin Redtail","Cloud-Leaper","The sect's best acrobat and worst student."],["Warden Bai","Peach Warden","Has never left the sealed peak and wants to see the sea."]],
strengths:"Speed, climbing, unpredictable tactics.",weaknesses:"Easily provoked; pranks have started wars before.",
quests:["Carry a peach to the sealed peak and find out who eats it.","Survive a week of Vanari hazing to learn the iron staff."],
gameplay:"Staff and acrobat training mentors; their pranks become a recurring comic-relief questline with a serious ending."},
3:{origin:"The Heavenfolk say the Titans taught their ancestors to fly. They served every kingdom as messengers until a king executed one of them for the contents of a letter.",
society:"Ruled by a council of eldest flyers; status rests on flight, oath-keeping and lineage of messages delivered.",
beliefs:"A message once taken must be delivered; the dead fly one last time from the Ledges.",
relations:"Distant from the ground kingdoms, allied with the Snowmanes, hostile to Aquilon's rocs.",
war:"Wingguard fight in tight aerial formations with spears and bows.",
trade:"Feathers, falcons, high-altitude herbs and, rarely, scouting.",
npcs:[["Elder Aeryth Highwind","Council elder","Refuses to fly messages for any crown again."],["Ilsa Brightquill","Young lantern-bearer","Wants to fly messages again and is looking for a partner."],["Captain Halvor Galeward","Wingguard captain","Lost his wing to a roc; commands from the ground."]],

quests:["Carry the first Heavenfolk message in a generation.","Retrieve a child taken as tribute by Aquilon."],
gameplay:"Courier and scouting quests; they provide flight-based abilities, never flying mounts."},
4:{origin:"Frogfolk lived in the clear lake that became Greymoor. When the abbey sank, they moved to the deeper meres and kept singing.",
society:"Families of a few dozen around a single choir-mother, whose song holds the family together.",
beliefs:"Song is life; silence is death. Every child gets a note of its own at birth.",
relations:"Night-traders with the stilt-villages, friends with the Shellmoot, terrified of the Hollow Abbot.",
war:"Reed duelists strike from the water; choirs stun enemies with harmonies.",
trade:"Medicine, frog-silk and reed-craft.",
npcs:[["Choir-Mother Gullagrum","Leader","Ancient and enormous; her voice is fading."],["Pell Swiftreed","Reed Duelist","Young and reckless; wants to fight the Abbot alone."],["Mossy Gip","Toad Herbalist","Brews the fen's best medicine and worst tea."]],
strengths:"Water, song, poison immunity.",weaknesses:"Dry heat and silence.",
quests:["Stand with Gullagrum as she sings against the Choir of Silence.","Recover a choir-mother's note stolen by the silence."],

});

10:{origin:"The Mangrove Jaws have guarded Lumbaya's river-mouths since the temple-builders' time. Their oldest mothers say they were asked to watch the rivers while the builders watched the sky, and that the builders never came back to relieve them.",

beliefs:"Patience is the highest virtue; the river always brings what you wait for.",
relations:"Old friends of the temple villages, though the villagers find them unnerving. Feared by the Nightmother, whose children cannot hide their scent from them. Distant cousins of the Scaled Lodges.",

quests:["Accept Cervaine's antler and win the duel.","Carry a Summer Court message to the Thorn Throne."],

relations:"Bitter enemies of the Briar King, comrades of the Antlered Court and the Pipers, and wary of mortals, who tend to make bargains they don't understand.",

trade:"Nectar, fey silk and small enchantments, always for a price that seems fair at the time.",

26:{origin:"The Sun-Hawks were the div-kings' first allies, falcon-headed watchers who guarded the springs from the air in return for nests in the high cliffs. When the shahs rose, the Sun-Hawks swore to them as well, and they have never decided which oath comes first.",

relations:"Old friends of Zahhar, sworn to the shah, close allies of the Coilborn and the Ibis Scribes.",

trade:"Aqueduct patrols, trained hunting falcons and sun-charms.",

quests:["Carry Horeshet's feather to Zahhar and speak for the shah.","Find the breach in the Great Aqueduct before a city runs dry."],

27:{origin:"The Rootwalkers are trees of Sylvaran that woke when the elves first planted the twin groves, to guard the children's trees. Some are older than the court itself.",

relations:"Guardians of the elves' twin trees; the court treats them as furniture, the wood elves as elders; Mycelia is their plague.",
war:"Crushing branches, bark armour and roots that grip from below; slow to start, impossible to stop.",
trade:"None; they ask only for water and to be left to grow.",
npcs:[["Eldest Barkhallow","Leader","Ancient, slow and asleep for most of the year."],["Twig","Sapling","Newly woken and curious about everything, especially feet."],["Ashbark","Blighted","Infected by Mycelia and asking to be cut down before it spreads."]],

quests:["Grant Ashbark's request, or find a cure before it is too late.","Wake Eldest Barkhallow to march on the Grey Hollow."],

28:{origin:"The Longears have farmed Moraveil's hills longer than the humans or the goblins, and they say the truce was their idea in the first place. Nobody believes them; they keep saying it.",

trade:"Vegetables, messages and weather-readings.",
npcs:[["Scout-Captain Tansy Quickfoot","Leader","Has seen Grakkus's army and is the only one who knows its route."],["Old Clover","Burrow Farmer","Stubborn, kind and refuses to leave her field."],["Shade","Black Hare","A silent duelist who owes the goblins a life-debt."]],

quests:["Get Tansy's report to the council before Grakkus reaches the bridge.","Convince Old Clover to evacuate before the army arrives."],

function lore(r){
  const terr=r.biomes.filter(x=>x!=="underworld");
  const list=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];
  let s;
  if(r.layer==="moon") s=`<b>${r.name}</b> is the red moon hanging over Aetheria, a ${RING_WORD[9]} realm of ${list(terr)} for heroes ranked ${r.rmin} to ${r.rmax}.`;
  else if(r.layer==="underworld") s=`<b>${r.name}</b> lies beneath the surface, a ${RING_WORD[r.ring]} descent of ${list(terr)} for ranks ${r.rmin} to ${r.rmax}.`;
  else if(r.layer==="sky") s=`<b>${r.name}</b> drifts above the clouds: ${list(terr)} for ranks ${r.rmin} to ${r.rmax}.`;
  else s=`<b>${r.name}</b> is a ${RING_WORD[r.ring]} land of ${list(terr)} for adventurers ranked ${r.rmin} to ${r.rmax}.`;
  if(r.state==="besieged"&&r.faction){s+=` Its ${r.faction.replace(/_/g," ")} host${r.tyrant?`, led by <b>${pretty(r.tyrant)}</b>,`:""} threatens ${r.towns.length?list(r.towns):"the region"}.`;
    s+=" Slaying the Tyrant liberates the land and turns the region over to regular monster hunting.";}
  else s+=" No Tyrant holds it under siege.";
  return s;
}
function card(r){
  const where={surface:"Surface",underworld:"Underworld"+(r.depth?" · depth "+r.depth:""),sky:"Sky",moon:"Above the world"}[r.layer];
  document.getElementById("facts").innerHTML=`<div class="where">Ring ${r.ring} · ${where}</div><h2>${r.name}</h2>
   <span class="pill ${r.state}">${r.state==="besieged"?"Under siege":"No siege"}</span>
   <dl><dt>Rank band</dt><dd class="mono">${r.rmin} – ${r.rmax}</dd>
   <dt>Terrain</dt><dd><div class="chips">${r.biomes.map(b=>`<span>${b}</span>`).join("")}</div></dd>
   ${r.towns.length?`<dt>${r.layer==="surface"?"Defend":"Towns"}</dt><dd>${r.towns.join(", ")}</dd>`:""}
   ${clansOf(r.id.replace(/^reg_/,"")).length?`<dt>Clans</dt><dd>${clansOf(r.id.replace(/^reg_/,"")).map(c=>c[1]).join(", ")}</dd>`:""}</dl>`;
  const k=r.id.replace(/^reg_/,""), L=GZL[k], gz=GAZ[k];
  document.getElementById("loreBox").innerHTML=gz?`<p class="lore">${gz[0]}</p><p class="cap" style="margin:12px 0 4px">Echoes of the past</p><p class="lore" style="font-size:16px;color:#cfc6b0">${gz[1]}</p><p class="lore-note">Full gazetteer entry below · draft, spoiler-free</p>`:`<p class="lore">${lore(r)}</p>`;
  const E=document.getElementById("entry");
  if(!L){E.hidden=true}else{E.hidden=false;
    const sec=(t,b)=>`<section><h4>${t}</h4>${b}</section>`, p=t=>`<p>${t}</p>`, li=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    E.innerHTML=`<p class="ep">${L.ep}</p><h3>${r.name} — Gazetteer</h3><div class="cols">`+
      sec("Overview",p(L.ov))+sec("Geography",p(L.geo))+sec("Ecology",p(L.eco))+sec("Peoples",p(L.ppl))+sec("Power & trade",p(L.pow))+sec("Faith & customs",p(L.faith))+
      sec("History",`<dl class="hist">${["Now","A generation ago","In the grandparents' time","Before memory"].map((t,i)=>`<dt>${t}</dt><dd>${L.hist[i]}</dd>`).join("")}</dl>`)+
      sec(r.state==="besieged"?"The Tyrant & the siege":"Threats",p(L.ty))+
      (L.set.length?sec("Settlements",li(L.set.map(([n,t])=>`<b>${n}</b> — ${t}`))):"")+
      sec("Landmarks",li(L.lm.map(([n,t])=>`<b>${n}</b> — ${t}`)))+
      sec("Adventure hooks",li(L.hk))+
      sec("Senses",`<p class="sen">${L.sen}</p>`)+
      (clansOf(k).length?sec("Clans of this land",li(clansOf(k).map(c=>`<b>${c[1]}</b> <span style="color:var(--muted);font-size:14px">(${c[0]})</span> — <i>Led by ${c[6]}.</i> ${c[3]} ${c[4]} <i>Hook:</i> ${c[5]}<br><span style="font-size:15px"><b style="color:var(--muted)">Kinds:</b> ${c[7].map(x=>`<b>${x[0]}</b> (${x[1]}) ${x[2]}`).join(" · ")}</span>${EXT[CLANS.indexOf(c)]?(()=>{const X=EXT[CLANS.indexOf(c)];return `<details class="cx"><summary>Full clan profile</summary><p><b>Origin.</b> ${X.origin}</p><p><b>Society.</b> ${X.society}</p><p><b>Beliefs.</b> ${X.beliefs}</p><p><b>Relations.</b> ${X.relations}</p><p><b>At war.</b> ${X.war}</p><p><b>Trade.</b> ${X.trade}</p><p><b>Notable people.</b></p><ul>${X.npcs.map(n=>`<li><b>${n[0]}</b> (${n[1]}) — ${n[2]}</li>`).join("")}</ul><p><b>Strengths.</b> ${X.strengths} <b>Weaknesses.</b> ${X.weaknesses}</p><p><b>Quests.</b></p><ul>${X.quests.map(q=>`<li>${q}</li>`).join("")}</ul><p><b>In play.</b> ${X.gameplay}</p></details>`})():""}`))):"")+
      (GUARDIANS.filter(g=>g[1]===k).length?sec("Guardian (proposal)",li(GUARDIANS.filter(g=>g[1]===k).map(g=>`<b>${g[3]}</b> <span style="color:var(--muted);font-size:14px">(${g[0]})</span> — ${g[2]}${HERALDS[g[0]]?` <i>Heralds:</i> ${HERALDS[g[0]].map(h=>`<b>${h[0]}</b>, ${h[1]}`).join(" ")}`:""}`))):"")+
      (FAUNA.filter(f=>f[2]===k).length?sec("Notable fauna",li(FAUNA.filter(f=>f[2]===k).map(f=>`<b>${f[1]}</b> <span style="color:var(--muted);font-size:14px">(${f[0]})</span> — ${f[3]}${FAUNA_SUB[f[1]]?` <i>Breeds:</i> ${FAUNA_SUB[f[1]].join(", ")}.`:""}`))):"")+`</div>`}
  vignette(r);
}
CLANS.forEach((c,i)=>{c[1]=CLAN_NAMES[i][0];c[6]=CLAN_NAMES[i][1];c[7]=SUB[i]||[]});GUARDIANS.forEach(g=>{g[3]=GUARDIAN_NAMES[g[0]]||''});
const clansOf=k=>CLANS.filter(c=>c[2]===k);
function select(r){selected=r;drawOverlay();card(r)}

// ---------------------------------------------------------------- interaction
function regionFromEvent(ev){const rect=ovl.getBoundingClientRect(),x=(ev.clientX-rect.left)/rect.width,y=(ev.clientY-rect.top)/rect.height;
  const ux=x*150,uy=y*100;
  if(Math.hypot(ux-8,uy-90)<5)return REGIONS.find(r=>r.id==="reg_vesper");
  const sky=REGIONS.find(r=>r.id==="reg_sky_archipelago"); if(Math.abs(ux-sky.ax)<11&&Math.abs(uy-sky.ay-1)<6)return sky;
  if(show.deep)for(const r of REGIONS.filter(r=>r.layer==="underworld"))if(Math.hypot(ux-r.ax,uy-r.ay)<1.8)return r;
  const ri=regionAt[Math.floor(y*H)*W+Math.floor(x*W)];return ri>=0?LAND[ri]:null}
ovl.addEventListener("pointermove",ev=>{if(ev.pointerType!=="mouse")return;const r=regionFromEvent(ev);if(r!==hover){hover=r;drawOverlay()}});
ovl.addEventListener("pointerleave",()=>{hover=null;drawOverlay()});
ovl.addEventListener("click",ev=>{const r=regionFromEvent(ev);if(r)select(r)});

const find=document.getElementById("find"), results=document.getElementById("results");
find.addEventListener("input",()=>{const q=find.value.trim().toLowerCase();
  if(!q){results.hidden=true;return}
  const hits=REGIONS.filter(r=>[r.name,r.faction,pretty(r.tyrant),...r.biomes,...r.towns,...clansOf(r.id.replace(/^reg_/,"")).map(c=>c[0]+" "+c[1]+" "+c[6]+" "+c[7].map(x=>x[0]).join(" ")),...GUARDIANS.filter(g=>g[1]===r.id.replace(/^reg_/,"")).map(g=>g[0]+" "+g[3])].join(" ").toLowerCase().includes(q)).slice(0,14);
  results.innerHTML=hits.length?hits.map(r=>`<button data-id="${r.id}"><span>${r.name}</span><small>Ring ${r.ring} · ${r.rmin}–${r.rmax}</small></button>`).join(""):`<p style="padding:8px 10px;margin:0;color:var(--muted)">Nothing matches “${find.value}”.</p>`;
  results.hidden=false;
  results.querySelectorAll("button").forEach(b=>b.onclick=()=>{select(REGIONS.find(r=>r.id===b.dataset.id));results.hidden=true})});
find.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=results.querySelector("button");if(b)b.click()}if(e.key==="Escape")results.hidden=true});
document.addEventListener("click",e=>{if(!e.target.closest(".finder"))results.hidden=true});

function legend(){const L=document.getElementById("legend"), cap=document.getElementById("legendCap");
  let items;
  if(view==="ring"){cap.textContent="Danger rings";items=RING_COL.slice(1).map((c,i)=>[c,"Ring "+(i+1)])}
  else if(view==="siege"){cap.textContent="Siege state";items=[["#b8332e","Under siege"],["#e0b552","Liberated / none"]]}
  else{cap.textContent="Terrain colours";items=["plains","forest","swamp","steppe","jungle","desert","tundra","mountain","volcanic","spirit","demon"].map(b=>["rgb("+BIOME[b]+")",b])}
  L.innerHTML=items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")+
    `<span><i style="background:#fbf6e8;border-radius:50%;box-shadow:inset 0 0 0 3px #1b1712"></i>settlement</span><span><i style="background:#28103c;box-shadow:inset 0 0 0 2px #c79bff"></i>underworld gate</span>`}
function setView(v){view=v;for(const k of ["terrain","ring","siege"])document.getElementById("v-"+k).setAttribute("aria-pressed",k===v);legend();render()}
document.getElementById("v-terrain").onclick=()=>setView("terrain");
document.getElementById("v-ring").onclick=()=>setView("ring");
document.getElementById("v-siege").onclick=()=>setView("siege");
for(const [id,key] of [["t-labels","labels"],["t-towns","towns"],["t-deep","deep"]])document.getElementById(id).onclick=e=>{show[key]=!show[key];e.currentTarget.setAttribute("aria-pressed",show[key]);drawOverlay()};
document.getElementById("reseed").onclick=()=>{seed=(seed*48271+11)%99991;render()};

legend(); render(); sizeOverlay();
select(REGIONS.find(r=>r.id==="reg_whisperwood"));
new ResizeObserver(()=>{sizeOverlay(); if(selected)vignette(selected)}).observe(document.querySelector(".page"));
if(document.fonts)document.fonts.ready.then(()=>drawOverlay());
</script>
