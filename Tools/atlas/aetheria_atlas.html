ov:"Hoshizora is a land of cedar mountains, bamboo seas and red-bridged cities on the north-eastern coast, where spirits are given seats at festivals and the boundary between worlds is thin. Its people live gracefully alongside things most lands fear, and they have rules for every kind of guest. Those rules have broken down. An oni warlord has come down from the volcano with a mask for every village he means to rule.",
geo:"The land climbs from a rocky, pine-covered coast through terraced rice valleys and bamboo forests to steep cedar mountains capped by the Oni Volcano. Rivers rush down in waterfalls, and hot springs bubble up everywhere. Hoshizora City stands at the mouth of the largest river, its castle on a hill and its temples on every slope.",
eco:"Deer, monkeys, cranes and tanuki live in the forests, and the spirit world spills over into the natural one: kodama in the old trees, kappa in the rivers and fox-spirits at the crossroads. Most spirits are harmless if treated with respect. Oni live in the volcano's shadow and come down only when the shrines are neglected.",
ppl:"The people of Hoshizora are farmers, fishers, craftspeople, monks, samurai and merchants, bound by courtesy and a strong sense of duty. They are reserved with strangers and warm with friends. Shrine-keepers and onmyoji, spirit-speakers, hold great respect. A growing number of young people have left for the cities of the south, and the old villages are emptying.",
pow:"Hoshizora is ruled by a shogun in Hoshizora City and lords who hold the valleys in his name. The shrines have their own authority over the spirits and the boundary. Rice, silk, lacquer, steel and spirit-charms are traded abroad, and the city's swordsmiths are second only to the dwarves.",
faith:"The day-gods are honoured alongside countless local spirits, and every village has a shrine. Shrines are rebuilt every twenty years to keep the gods curious. Festivals invite the spirits to join the living for a night of food and dancing, and the spirits must be sent home at dawn.",
hist:["Kurogane has come down from the Oni Volcano and taken three valleys. He gives each village a mask and says that whoever wears it will be spared.","Within living memory the shogun's father closed the coast to foreign ships, and the opening of the ports is still a sore subject.","In their grandparents' time the great rebuilding of the volcano shrine was left unfinished when the money ran out.","Hoshizora's shrines are rebuilt every twenty years so that the gods stay curious. The last rebuilding was left unfinished."],
ty:"Kurogane, the Oni Warlord, is a great red-skinned oni with an iron club and a face like a temple guardian. He came down from the volcano when the shrine above it was left unfinished, because the unfinished shrine broke an old bargain between the oni and the people. He believes the people have forfeited their protection and that the oni are owed rule over the valleys. His masks bind those who wear them to obey him.",
set:[["Hoshizora City","The capital at the river mouth, with its castle, temples and the Ryokan Moon-on-Water."],["Bamboo Sea villages","Villages in the bamboo forests, the first to fall under Kurogane's masks."]],
lm:[["The Oni Volcano","The smoking peak above the land, with its unfinished shrine."],["The Thousand Gates","A mountain path lined with red torii gates, where spirits walk at night."],["The Moon Pond","A pond where the moon's reflection is said to be a doorway."]],
hk:["A village headman has worn Kurogane's mask, and his daughter wants it taken off without killing him.","The shrine carpenters need guards to finish the volcano shrine.","A kappa is demanding the return of a cucumber debt from three generations ago."],
sen:"Cedar incense and hot springs; temple bells; the rustle of bamboo; drums from the volcano."},

kitsune_isles:{ep:"The Isles of Fox and Promise",
ov:"The Kitsune Isles are a chain of green islands off the eastern coast, home to fox shrines, spirit inns and people whose ears do not always match their faces. Spirits run the inns here, and humans are their guests; breaking a house rule means breaking a contract. The isles are beautiful, eerie and courteous. A grieving spirit walks the cliff paths, and her neck stretches as long as her grief.",
geo:"The isles are steep volcanic islands covered in forest, with sheltered coves, sea caves and a ring of reefs. Each island has a single shrine on its peak, reached by a long stair. Mist rolls in from the sea most mornings and burns off by noon.",
eco:"Foxes are everywhere, and some of them are not foxes. Sea birds nest on the cliffs, and the reefs teem with fish. Yokai of every kind live here openly: rokurokubi, tanuki, tsukumogami and kitsune of one to nine tails. The spirits live off offerings, contracts and the strong feelings of humans.",
ppl:"The islanders are fishers, shrine-keepers, innkeepers and contract-makers, mixed families of humans and kitsune who have intermarried for centuries. They are polite, precise and very careful with promises. Some families have served the same fox shrine for generations, and their children are born with fox-ears.",
pow:"Each island is governed by its shrine and the family that serves it. The spirits' contracts are law, and humans who break them suffer. Fish, pearls, spirit-silk and contracts are the islands' trade, and the spirit inns draw visitors from all over the world.",
faith:"The islanders honour the day-gods and the fox spirits, especially the Ninefold, a nine-tailed fox who founded the isles. Every promise is witnessed by a fox, and every contract is sealed with a drop of blood and a grain of rice.",
hist:["The Hollow Bride walks the cliffs, and the spirit inns have closed their doors at dusk. Travellers who answer her call are found in the morning, alive, but unable to remember anyone they love.","Within living memory a great kitsune family fell from favour, and its daughter left the isles. The family's shrine has been tended by strangers ever since.","In their grandparents' time a fisherman broke a promise to a fox-wife, and the island he lived on sank.","Each island was once a promise between a fox and a fisherman. One of those promises was broken."],
ty:"The Hollow Bride, Matriarch of the Long Necks, is a rokurokubi spirit who was promised a wedding that never came. Her neck stretches through the night in search of her betrothed, and she takes the love of anyone she finds, leaving them hollow. She leads a family of long-necked spirits who feed on broken promises, and the isles are full of them.",
set:[["Fox Shrine Isle","The main island, with the great fox shrine and the Ninth Tail Teahouse."],["Spirit inns","Inns run by spirits across the isles, where humans are guests and contracts are law."]],
lm:[["The Ninefold Shrine","The great shrine on Fox Shrine Isle, with nine gates and nine stairs."],["The Sunken Isle","An island that sank beneath the sea, its shrine still visible at low tide."],["The Cliff of Promises","A cliff where lovers make vows, and where the Hollow Bride walks."]],
hk:["A young woman with fox-ears has come home to the isles to reclaim her family's shrine.","A spirit inn's contract has been broken by a careless guest, and the inn has begun to eat him.","The Hollow Bride's betrothed may still be alive, and someone wants to find him."],
sen:"Mist and pine; fox calls at night; incense and salt; paper lanterns swaying in the sea wind."},

frostveil:{ep:"The Long Winter",
ov:"Frostveil is the far north, a land of fjords, glaciers and longhouses where the sun barely clears the peaks in winter and barely sets in summer. Its people are sailors, hunters and skalds, as hard as the land and as warm as the fires they never let die. A frost giant king has claimed every stead his breath can reach, and his breath reaches farther each year.",
geo:"Deep fjords cut into black mountains capped with glaciers, and the coast is a maze of islands and skerries. Pine forests cling to the lower slopes, and tundra stretches inland. The great hold of Skjaldheim stands at the head of the longest fjord, around a hall whose fire has burned for six hundred years. In the far north the sky sometimes seems to crack, and the people call it the Shattered Sky.",
eco:"Reindeer, wolves, bears, seals and walrus live here, and the fjords are rich with fish and whales. Frost trolls, ice wolves and frost giants live in the mountains, and in hard winters they come down to the coast. The people survive by hunting, fishing and storing everything they can for the dark months.",
ppl:"The people of Frostveil are humans, half-giants and a few dwarves, organised into clans led by jarls. They value courage, loyalty, hospitality and a good story above everything else. Skalds are honoured as historians, lawgivers and entertainers, and a good saga can make or break a reputation.",
pow:"The jarls meet at the Thing, an annual assembly at Skjaldheim, where laws are made and disputes settled. A king is elected only in times of war, and only for its duration. Fish, furs, ivory, amber and whale-oil are traded south, and the longships of Frostveil are the best in the world.",
faith:"The people honour the day-gods and the fire, which they believe holds the souls of their ancestors. Letting a hearth fire die is a crime, and the fire at Skjaldheim has burned for six hundred years. The dead are sent to sea in burning ships.",
hist:["Ymgrir has frozen the outer fjords, and the fishing fleets are trapped. The jarls have called the Thing early and are debating whether to elect a war-king.","Within living memory a fleet sailed north to find the source of the Shattered Sky and never came back.","In their grandparents' time Frostveil fought a long war against the frost giants and won, at the cost of half its jarls.","The skalds of Skjaldheim sing of a summer that lasted a hundred years. No one living has seen one."],
ty:"Ymgrir, the Frost Sovereign, is a frost giant king from the high glaciers who has claimed Frostveil as his own. His breath freezes the sea, and wherever his breath reaches the winter never ends. He believes the long winter is the true state of the world, and that the summer the skalds sing of was a mistake. He wants to bring the winter back to everywhere.",
set:[["Skjaldheim","The great hold at the head of the longest fjord, home of the Last Fire inn."],["Longhouse steads","Clan farms of long turf-roofed houses scattered along the fjords."]],
lm:[["The Last Fire","The hearth at Skjaldheim that has burned for six hundred years."],["The Shattered Sky","A place in the far north where the sky seems to crack."],["The Frozen Fleet","The fishing fleet trapped in the ice of the outer fjords."]],
hk:["The keeper of the Last Fire has run out of the sacred wood, and the nearest grove is in Ymgrir's territory.","A survivor of the fleet that sailed north has come back, older than he should be.","A skald needs a new saga before the Thing, and she wants to write it about someone who is still alive."],
sen:"Woodsmoke and salted fish; the crack of ice; skalds singing in the long dark; a cold so sharp it smells of iron."},

shen_lu:{ep:"The Hundred-Stair Mountains",
ov:"Shen-Lu is a land of steep mountains, misty forests and cultivation sects, where martial artists train on stairs that climb into the clouds and seek to master the qi that flows through all things. Tournaments are held at every crossroads, secret manuals change hands for fortunes and a sect's reputation can rise or fall in a single duel. A colossus has come to the mountains, and it is devouring their qi.",
geo:"The mountains are sheer limestone pinnacles wrapped in mist and pine, cut by deep gorges and roaring rivers. Sect monasteries cling to the cliffs, reached by stairways of hundreds or thousands of steps. The Jade Crossroads, a great market town, lies in the valley where the main roads meet.",
eco:"Cranes, monkeys, pandas, tigers and golden pheasants live in the forests, and spirit beasts live higher up: qilin, foxes and dragons. Spirit herbs grow on the high peaks and are prized by cultivators. The mountains' qi feeds everything, and the Hunger Colossus is draining it.",
ppl:"The people of Shen-Lu are farmers, merchants, scholars and martial artists, and the sects are their pride. Each sect has its own style, philosophy and rivals. Sect disciples are respected and feared, and the ordinary people are expected to defer to them. Some sects protect the villages; some exploit them.",
pow:"The sects hold the real power, and the mountain towns answer to whichever sect controls them. An emperor rules from a distant capital in name only. Tea, silk, spirit herbs, medicines and martial manuals are traded across the world, and a good manual can buy a town.",
faith:"The people honour the day-gods and the mountains themselves, which they believe are alive. Cultivators seek to become one with the mountain's qi and ascend. Every sect keeps a shrine to its founder, and the founders of the two greatest sects are buried facing away from each other.",
hist:["Wuxiang, the Hunger Colossus, is walking through the mountains, draining their qi. Peaks have gone grey, and cultivators are falling ill.","Within living memory the great tournament of the Jade Crossroads ended in a massacre, and the sects have not held one since.","In their grandparents' time the sects were united in a single school, until the Hundred-Stair Schism split it.","The sects were one school before the Hundred-Stair Schism. Their founders' graves face away from each other."],
ty:"Wuxiang, the Hunger Colossus, is a giant made of mountain stone and stolen qi, created by a sect that sought to steal the power of the mountains. It escaped its creators and now walks the peaks, devouring their qi to grow larger. It cannot be fought with qi, because it eats it. The sect that made it is keeping that fact very quiet.",
set:[["Sect foothill towns","Towns at the feet of the sect mountains, where disciples buy supplies and villagers sell them, near the Jade Crossroads and the Wandering Dragon Inn."]],
lm:[["The Hundred Stair","A stairway of a thousand steps leading to the old united school."],["The Jade Crossroads","A market town where the roads and the sects meet, home of the Wandering Dragon Inn."],["The Grey Peaks","Mountains drained of qi, bare and silent."]],
hk:["A sect wants an outsider to find out which rival made the Colossus, before anyone finds out it was them.","A cultivator has fallen ill from the drain, and her master wants a spirit herb from a grey peak.","A secret manual has been stolen, and three sects are blaming one another."],
sen:"Pine and mist; tea and incense; the clash of training swords at dawn; a silence on the grey peaks like held breath."},

haneul:{ep:"The Sky Gate",
ov:"Haneul is a mountain kingdom built around a single pass, the only road through the great mountains to the east. Its gate-towns climb the pass in terraces, and its capital stands at the top, behind a wall that has never fallen, though it has come close. The kingdom is famous for its scholars, its courtesy and its endless, demanding examinations. A red gate has opened in the clouds above the pass, and a demon herald has come through it.",
geo:"The kingdom occupies a long, narrow valley climbing to a high pass between snowy peaks. The gate-towns are built on terraces up the valley's sides, and the capital sits in the saddle of the pass. Pine forests and rhododendrons cover the slopes, and the river below runs fast and cold. The red gate hangs in the clouds above the pass, visible from everywhere.",
eco:"Magpies, tigers, deer and wild boar live in the forests, and mountain spirits live higher up. The people farm the terraces and gather mushrooms and herbs from the forest. Demons have begun to come through the red gate, and they hunt the mountain spirits first.",
ppl:"The people of Haneul are farmers, merchants, soldiers and scholars, and scholarship is the path to everything. Every family dreams of a child who passes the great examinations and joins the court. The people are courteous, proud and fiercely loyal to their king, and they take off their shoes at every door.",
pow:"Haneul is ruled by a king advised by a council of scholar-officials chosen by examination. The wall and the gate-towns are garrisoned by a standing army that drills daily. The kingdom grows rich on the tolls of the pass, and on ginseng, paper, porcelain and scholarship.",
faith:"The people honour the day-gods, their ancestors and the mountain spirits, whose shrines stand at every bend of the pass. The ancestral rites are performed on Solenday, and every household keeps the names of its ancestors on tablets.",
hist:["The red gate opened in the sky at midsummer, and Varos came through it with a host of demons. They have taken the upper gate-towns and are pressing on the capital's wall.","Within living memory a scholar-official discovered that the wall was built for the wrong enemy, and was exiled for saying so.","In their grandparents' time the wall held against an army from the north for a whole winter, and the kingdom still celebrates its anniversary.","Haneul built its wall for an enemy from the north. The red gate opened in the sky instead."],
ty:"Varos, Herald of the Red Gate, is a demon officer who came through the gate in the sky to prepare the way for something larger. He is precise, polite and utterly without mercy, and he treats the siege like an examination that the kingdom is failing. He wants the pass, because whoever holds it holds the road between east and west.",
set:[["Haneul gate-towns","Terraced towns climbing the pass, the capital at the top with its Cloud Gate Guesthouse."]],
lm:[["The Red Gate","A gate of red light hanging in the clouds above the pass."],["The Examination Hall","Where every scholar of the kingdom sits the great examinations."],["The Unfallen Wall","The great wall across the pass, scarred but unbroken."]],
hk:["The exiled scholar who said the wall was built for the wrong enemy wants to come home and help.","A mountain spirit is hiding in a farmhouse from the demons, and the farmer wants it gone.","The examinations are being held despite the siege, and a candidate needs an escort to the hall."],
sen:"Pine and ink; the clack of examination brushes; drums on the wall; the red light that never fades from the clouds."},

whitewater_reach:{ep:"The White Coast",
ov:"Whitewater Reach is a frozen coast of white water, white ice and fishing villages built on both. Its people fish through holes in the ice in winter and from boats in the brief summer, and they marry the sea before they marry each other. A leviathan with jaws of ice has begun breaking the floes from below.",
geo:"The coast is a maze of ice floes, frozen fjords and rocky islands, battered by storms. In winter the sea freezes for miles out, and the villages move onto the ice. In summer the ice breaks up and the villages move back to the rocks. Great icebergs drift past, some carrying the bones of ancient creatures.",
eco:"Seals, walrus, whales, polar bears and enormous fish live in these waters, and the people hunt and fish all of them. Ice wyrms and frost serpents hunt in the deep, and the leviathan hunts everything.",
ppl:"The people of the Reach are fishers, hunters and boat-builders, small, tough and stubborn. They are deeply superstitious about the sea and deeply practical about everything else. Every child learns to swim in icy water and to read the ice before they can read words.",
pow:"Each village is governed by its elders and its best fisher. Disputes are settled by contests of skill. Fish, oil, ivory and furs are traded south for grain, iron and wood.",
faith:"The people honour the day-gods and the sea, which they consider a jealous spouse. Every fisher is married to the sea in a ceremony at sixteen, before any human marriage. Offerings of fish and blood are made before every voyage.",
hist:["Ysgrath has broken the winter ice under three villages, and the people are afraid to go out on the floes.","Within living memory a great storm froze a whole fishing fleet in place, and the crews survived by eating their boats.","In their grandparents' time the leviathan was a story to frighten children.","Fishers here marry the sea first and their spouses second. It is in the vows."],
ty:"Ysgrath, the Ice-Jaw Leviathan, is a vast sea serpent with jaws of living ice. It breaks the floes from below and swallows whatever falls in: seals, boats, villages. It is drawn to the vibrations of people walking on the ice, and it has learned that villages mean food.",
set:[["Ice-fishing villages","Villages that move between the rocks and the ice with the seasons."]],
lm:[["The Bone Bergs","Icebergs carrying the frozen bones of ancient creatures."],["The Marriage Rock","A rock where every fisher is married to the sea."],["The Broken Floe","A field of shattered ice where the leviathan surfaced."]],
hk:["A fisher wants to divorce the sea, and the elders say it has never been done.","A Bone Berg is drifting toward a village, and something inside it is moving.","The villages need a way to cross the ice without waking the leviathan."],
sen:"Salt and fish oil; the boom of ice cracking; wind like knives; the smell of seal blubber burning."},

umbravel:{ep:"The Silk City Below",
ov:"Umbravel is a city beneath the surface, hanging in a vast cavern from webs of silk spun over generations. Its streets are bridges, its houses are cocoons and its lanterns glow in the dark like stars. Its people chose the dark long ago and have made it beautiful. The webs hold the city up, and the Web Queen wants to collect the rent.",
geo:"The cavern is miles across and so deep that its floor has never been reached. The city hangs from its ceiling and walls on silk cables thick as tree trunks. Lantern-lit bridges connect the districts, and lifts of woven silk carry people up and down. Waterfalls fall from the ceiling into the darkness below.",
eco:"Giant spiders spin the city's silk, and the people tend them like livestock. Glowing fungi, cave fish, blind bats and luminous moths live in the cavern. The Web Queen's brood lives in the deeper webs below the city, and they have begun climbing up.",
ppl:"The people of Umbravel are humans, dark elves and gnomes descended from refugees who fled the surface. They are pale, sharp-eyed and quiet, skilled weavers and engineers. They distrust surface-folk but welcome traders.",
pow:"Umbravel is ruled by a council of weaver-guilds, and the guild that controls the oldest webs has the most power. The city trades silk, mushrooms and mana crystals with the surface and the Underworld. The silk contract with the spiders is the city's founding law.",
faith:"The people honour the day-gods in the dark, with lanterns in place of the sun. They believe the first spider wove the city as a gift, and they leave silk offerings in the deep webs.",
hist:["Vel'thara the Web Queen has risen from the deep webs and claims the city's silk as hers. Bridges have been cut, and whole districts are cocooned.","Within living memory the weaver-guilds broke the silk contract to sell more silk to the surface.","In their grandparents' time the first lifts were built, opening the city to trade with the Underworld.","Umbravel's founders fled the surface during the Sundering and chose the dark over the sky."],
ty:"Vel'thara, the Web Queen, is the mother of the spiders that spin Umbravel's silk. When the guilds broke the silk contract, she rose from the depths to take back what was hers. She wants the city's silk, its people and its lanterns, and she considers the whole city a web she has merely lent.",
set:[["Umbravel","The silk city hanging in the cavern."]],
lm:[["The Lantern Bridges","Bridges of silk and lantern-light connecting the city's districts."],["The Deep Webs","The webs below the city, where the Web Queen nests."],["The Silk Contract Hall","Where the original contract with the spiders is kept."]],
hk:["A weaver-guild wants the silk contract restored, quietly.","A district has been cocooned, and a family is still alive inside.","A surface trader is stuck in the city with a cargo the Web Queen wants."],
sen:"Cool still air; the hum of silk under tension; mushroom bread; lanterns glowing like a second sky."}
});
Object.assign(GZL,{
sunscar:{ep:"The Glass Desert",
ov:"Sunscar is a desert of red dunes streaked with glass, where an empire once stood and vanished in a single day. The Oasis of Qadira, with its seven wells, is the only green place for weeks in any direction, and every caravan in the desert passes through it. A colossus walks the horizon, and the oasis shrinks after every pass.",
geo:"The dunes are vast and shifting, and the glass streaks are where something burned the sand to crystal long ago. Ruined cities of the vanished empire lie half-buried, their towers sticking out of the sand like ship masts. The oasis lies in a hollow where seven wells draw water from deep below.",
eco:"Camels, sand foxes, scorpions, vultures and giant sandworms live in the desert. Glass-backed lizards bask on the streaks. The oasis supports date palms, birds and fish in its pools. The Colossus drinks from the deep water as it walks, and the wells are drying.",
ppl:"The people of Sunscar are nomads, caravaneers, water-keepers and treasure-hunters. They are hospitable, proud, and fiercely protective of water. The water-keepers of Qadira can recite the oasis's shoreline for every year back to the first well.",
pow:"The oasis is governed by the water-keepers, and every caravan pays a water-tithe. The nomad tribes are independent. Trade in salt, spice, glass and relics of the vanished empire flows through the oasis.",
faith:"The people honour the day-gods and the water, which they consider sacred. Wasting water is the worst of crimes. The vanished empire is remembered as a warning against pride.",
hist:["The Colossus of Sunscar walks the horizon, and two of the seven wells have run dry.","Within living memory a treasure-hunter found a working machine in the ruins, and the water-keepers buried it again.","In their grandparents' time the oasis was twice its size.","Qadira's water-keepers can recite the oasis's shoreline for every year back to the first well."],
ty:"The Colossus of Sunscar, Walker of the Dunes, is a giant construct of the vanished empire, built to carry water to its cities. Its cities are gone, but it still walks its route, drawing water from the deep and carrying it to places that no longer exist. It does not know the empire is gone, and it does not know it is killing the oasis.",
set:[["Oasis of Qadira","The green oasis with seven wells, home of the Oasis Caravanserai."]],
lm:[["The Glass Streaks","Lines of melted sand where something burned the desert."],["The Sunken Towers","Towers of the vanished empire rising from the dunes."],["The Seven Wells","The wells of Qadira, two now dry."]],
hk:["A water-keeper believes the Colossus could be redirected, if someone could reach its control room.","A treasure-hunter wants to dig up the machine the water-keepers buried.","A caravan has been lost in a sandstorm, and its water-tithe was never paid."],
sen:"Hot sand and date palms; the clink of glass underfoot; the call to the wells at dawn; a distant, rhythmic thud."},

goldmere_coast:{ep:"The Salvage Shore",
ov:"Goldmere Coast is a warm, wild shore of reefs, wrecks and pirate stilt-towns. Port Goldmere runs on salvage, and the pirates run on what Goldmere misses. The Krakenmother rules the wreck-tide, which is where all the salvage comes from.",
geo:"The coast is a maze of reefs, sandbars and shipwrecks, and a single safe channel leads into Port Goldmere. The pirate stilt-towns stand on the reefs, joined by rope bridges. The wreck-tide is a current that carries wrecks from across the sea to Goldmere's reefs.",
eco:"The reefs teem with fish, turtles, sharks and octopus. Sea serpents, giant crabs and merrows hunt the wrecks. The Krakenmother's brood lives in the deep water beyond the reefs.",
ppl:"The people of the coast are salvagers, sailors, pirates, smugglers and merchants. They are cheerful, violent and generous. Sea shanties are sung every night, and card games last until dawn.",
pow:"Port Goldmere is governed by a council of salvage captains, and the pirate towns by their own captains. Salvage law is the only law that matters. Trade in salvage, fish, rum and stolen goods keeps the coast rich.",
faith:"The people honour the day-gods and Vex above all. Every salvager makes an offering to the sea before diving.",
hist:["The Krakenmother has begun dragging ships down before they wreck, and the salvagers are losing their living.","Within living memory Goldmere fought a long trade war with Lirian.","In their grandparents' time a great fleet sank in a single night off the reefs.","Half the port is built from the timber of one great fleet that sank in a single night."],
ty:"Krakenmother Ys, Queen of the Wreck-Tide, is a vast kraken who rules the deep water. She has grown tired of sharing the wrecks with the salvagers, and she has begun making her own.",
set:[["Port Goldmere","The salvage port, home of the Drowned Mermaid inn."],["Pirate stilt-towns","Towns on stilts on the reefs, joined by rope bridges."]],
lm:[["The Wreck-Tide","The current that carries wrecks to the coast."],["The Sunken Fleet","The great fleet that sank in a single night."],["The Safe Channel","The only way into Port Goldmere."]],
hk:["A salvager has found a wreck that has not sunk yet.","A pirate captain wants a truce with Goldmere to fight the Krakenmother.","A map to the sunken fleet's flagship is being auctioned."],
sen:"Salt and rum; sea shanties; creaking rope bridges; the smell of rotting timber."},

zarvan:{ep:"The Garden Cities",
ov:"Zarvan is a land of garden cities blooming on terraces cut into desert mountains, fed by aqueducts older than the kingdom. Its people are poets, gardeners and engineers. The div-king Zahhar claims the water and every rose it grows.",
geo:"The desert mountains are dry and barren, but the valleys have been terraced and watered for millennia. Aqueducts carry water from mountain springs to the cities. The cities are full of gardens, fountains and orchards.",
eco:"The gardens support roses, pomegranates, songbirds and peacocks. The desert holds lizards, scorpions and wild goats. Divs, giant demonic spirits, live in the mountains.",

Object.assign(GZL,{
goldmere_coast:{ep:"The Salvage Shore",
ov:"Goldmere Coast is a warm, wild shore of reefs, wrecks and pirate stilt-towns on the southern sea. Port Goldmere runs on salvage, and the pirate towns run on whatever Goldmere misses. Half the buildings in the port are made from ships, and half the people in it are wanted somewhere else. The wreck-tide that brings the coast its wealth is ruled by the Krakenmother, and she has stopped waiting for ships to wreck on their own.",
geo:"The coast is a maze of coral reefs, sandbars and the skeletons of ships, with a single safe channel into Port Goldmere that changes a little with every storm. A great current, the wreck-tide, sweeps across the southern sea and drops whatever it carries onto Goldmere's reefs: timber, cargo, cannon and, now and then, whole ships with their crews still aboard. The pirate stilt-towns stand on the outer reefs, joined by rope bridges that sway in the trade winds. Inland, low jungle hills hide caves full of things that were not declared at customs.",
eco:"The reefs are some of the richest waters in the world, full of parrotfish, turtles, rays, sharks and octopus. The wrecks become reefs in their turn, and divers say you can date a wreck by the coral on it. Giant crabs scavenge the shallows, merrows and sea-hags haunt the wrecks, and sea serpents follow the wreck-tide looking for the drowned. Beyond the reef the water drops away to black, and that is where the Krakenmother's brood lives.",
ppl:"Goldmerers are salvagers, divers, shipwrights, sailors, smugglers and gamblers from every coast in the world, and many of them came to Goldmere because the wreck-tide brought them. They are cheerful, quarrelsome, superstitious and generous with anything they did not have to pay for. The pirate towns are surprisingly democratic: captains are elected by their crews and removed by them, sometimes over the side. Sea shanties are sung every night in every tavern, and card sharks work every table.",
pow:"Port Goldmere is governed by a council of salvage captains, each of whom holds a claim to a stretch of reef. Salvage law is the only law that matters: whoever first lays a hand on a wreck owns it, and whoever takes it from them had better be quick. The pirate towns are independent, and their relationship with the port is part rivalry, part business partnership. Salvage, rum, fish, pearls and stolen goods flow through the port, and its markets sell things you cannot buy anywhere else.",
faith:"Goldmerers honour all the day-gods but pray to Vex most of all, because every dive is a gamble. Divers make an offering of a coin to the sea before every descent and keep the first thing they find on every wreck as a charm. The dead are buried at sea with their boots on, so they can walk home along the bottom.",
hist:["The Krakenmother has begun dragging ships down before they reach the reefs, and taking the salvage with her. The port's income has halved, and the captains are starting to fight among themselves.","Within living memory Goldmere fought a long, bitter trade war with Lirian, and a generation of sailors grew up hating the canal city.","In their grandparents' time a great fleet sank in a single night on the outer reef, and the timber built half the town.","The salvagers say the wreck-tide was a gift from the sea to the first Goldmerers, who saved a drowning sea-queen. The Krakenmother may disagree."],
ty:"Krakenmother Ys, Queen of the Wreck-Tide, is a kraken large enough to wrap a galleon. For centuries she let the wreck-tide carry ships to the reef and fed on what the salvagers left. Now she has grown tired of sharing, and she drags ships under before they wreck, keeping the cargo in a great hoard in the deep. Her brood of lesser krakens and sea-hags raids the stilt-towns. She is clever enough to know which ships carry gold.",
set:[["Port Goldmere","The salvage port, a town of ship-timber houses around a deep harbour, home of the Drowned Mermaid inn."],["Pirate stilt-towns","Towns on stilts on the outer reefs, joined by rope bridges and governed by elected captains."]],
lm:[["The Wreck-Tide","The great current that brings the coast its salvage."],["The Sunken Fleet","The wrecks of the great fleet, now a reef of coral and cannon."],["The Krakenmother's Hoard","A trench in the deep water where she keeps what she has taken."]],
hk:["A salvager has found a ship drifting on the wreck-tide with no crew and a hot meal on the table.","A pirate captain wants a truce with the port to fight the Krakenmother together, and both sides want someone neutral to negotiate.","A map to the sunken fleet's flagship is being auctioned at the Drowned Mermaid, and three bidders are already dead."],
sen:"Salt, tar and rum; shanties over clinking glasses; creaking rope bridges; warm water and the smell of rotting timber."},

zarvan:{ep:"The Garden Cities",
ov:"Zarvan is a land of garden cities blooming on terraces cut into bare desert mountains, kept green by aqueducts older than the kingdom itself. Its people are poets, gardeners, engineers and scholars, and they measure a city's greatness by its roses. It is one of the most beautiful places in the world and one of the most fragile, because everything depends on the water. Zahhar, King of the Divs, has come down from the mountains to claim it.",
geo:"The mountains of Zarvan are high, dry and bare, but snow on their peaks feeds springs deep inside them. The first people of Zarvan cut channels into the mountainsides to carry that water down, and their descendants built the great aqueducts, tunnels and cisterns that feed the cities today. The valleys are terraced from top to bottom, and each terrace holds a garden, orchard or field. The cities are walled gardens of their own, full of fountains, pools and shaded courtyards.",
eco:"In the gardens live songbirds, peacocks, bees, butterflies and the famous Zarvan nightingales. In the wild mountains above them live ibex, snow leopards, vultures and scorpions. The divs, giant spirits of the mountains, live in the high caves and the hidden springs. The gardens depend on bees and the bees depend on the gardens, and the water feeds both.",
ppl:"The people of Zarvan are refined, hospitable and proud. Poets are honoured above generals, and a well-made verse can win a lawsuit. Gardeners are a respected guild, and engineers who maintain the aqueducts are almost priests. The cities are cosmopolitan, full of traders and scholars from everywhere, but the mountain villages are traditional and suspicious of outsiders.",
pow:"Zarvan is ruled by a shah who governs with a council of water-masters. The water-masters decide how the water is divided, which means they decide which cities flourish and which wither. The economy rests on roses, rosewater, carpets, fruit, silk and scholarship, and Zarvan's universities are among the oldest in the world.",
faith:"The people honour the day-gods and the water, and every garden has a small shrine at its spring. Poetry is a form of prayer, and the great poets are buried in gardens that become places of pilgrimage. Wasting water is a sin and a crime.",
hist:["Zahhar has seized the springs above three cities and demands tribute in roses, rosewater and poets. The shah is negotiating, and the water-masters are rationing.","Within living memory a great earthquake broke the main aqueduct, and the cities survived only because the engineers worked for forty days without rest.","In their grandparents' time the div-kings were thought to have died out, and their caves were plundered for treasure.","The div-kings ruled Zarvan before people did. They signed the garden treaties in water, and water forgets."],
ty:"Zahhar, King of the Divs, is a giant div with skin like polished stone and eyes like coals. He signed the garden treaties with the first shah, agreeing to share the mountain water in return for honour and offerings. The offerings stopped generations ago, his caves were plundered and his people were hunted. He believes the treaties are broken and the water is his again, and he is not entirely wrong.",
set:[["Zarvan garden cities","Terraced cities of gardens, fountains and universities, fed by the great aqueducts."]],
lm:[["The Great Aqueduct","An aqueduct older than the kingdom, carrying water down from the mountain springs."],["The Rose Palace","The shah's palace, famous for its hundred gardens."],["The Div Springs","The hidden mountain springs, now held by Zahhar."]],
hk:["A famous poet has been taken as tribute, and her students want her back before she writes a poem in Zahhar's honour.","A water-master believes the original garden treaty is carved in the Div Springs and could end the war.","A garden in the capital has started blooming roses that bleed when cut."],
sen:"Roses and running water; poetry recited in fountain courts; pomegranates and saffron; dry mountain wind."},

zaruma:{ep:"The Gold Road",
ov:"Zaruma is a kingdom of golden grassland and desert edge strung along the gold road, the great trade route that carries gold north from the mines of the south. Its towns are rich, its markets loud and its caravans heavier than their camels. Its griots keep its history in songs, and its kings are remembered for their generosity. Mansacor, the gold-eating manticore, eats the gold first and then the people carrying it.",
geo:"The northern part of Zaruma is savanna: golden grass, flat-topped acacias and great baobab trees. Further south the grass thins into scrub and then desert, and beyond the desert lie the gold mines in the hills. The gold road runs north-south through the whole kingdom, following a line of wells. Towns stand at the wells, and the largest of them grow into cities of mud-brick towers and great temples of the day-gods.",
eco:"The savanna supports herds of antelope, zebra, giraffe and elephant, and the predators that follow them: lions, leopards, hyenas and wild dogs. Vultures circle the caravans. The manticore is not native here; it followed the gold road north, and it has learned that the caravans carry the one thing it craves.",
ppl:"The people of Zaruma are traders, caravaneers, miners, farmers, smiths and griots. Griots are the kingdom's historians, genealogists and musicians, and every noble family has one. The people are proud, hospitable and fond of argument. The miners of the south are a separate people with their own language and customs, and they guard the secrets of the mines jealously.",
pow:"Zaruma is ruled by a king, chosen from the royal family by a council of elders, who controls the gold road and taxes everything on it. The kings are expected to be generous, and a king who hoards is soon replaced. Gold, salt, ivory, cloth, books and kola nuts are traded on the road. Zaruma's scholars have built great libraries in the cities.",
faith:"The people honour the day-gods and their ancestors, whose stories and names are kept by the griots. Generosity is a sacred duty. The kings make pilgrimages to the holy places of the day-gods and give away gold along the way.",
hist:["Mansacor attacks the caravans every week, and merchants are refusing to travel the gold road. The northern cities are running short of gold, and the southern mines of everything else.","Within living memory a king made a pilgrimage with so much gold that he crashed its price across the world, and the griots still sing about it.","In their grandparents' time the golden mile was found by the manticore and eaten, and the manticore has followed the road ever since.","Zaruma's first queen paved a mile of road in gold to shame a rival. The manticore found the mile."],
ty:"Mansacor, the Gold-Eating Manticore, is a monster with a lion's body, a scorpion's tail and a human face twisted into a permanent grin. It has a hunger for gold that it cannot satisfy, and it eats the gold first, then the caravaneers. Its hide has become flecked with gold, and its spines are tipped with it.",
set:[["Zaruma gold-road towns","Rich towns of mud-brick towers, libraries and markets at the wells along the gold road."]],
lm:[["The Golden Mile","The stretch of road once paved in gold, now bare and scarred."],["The Griots' Baobab","A vast baobab where the griots gather to sing the history of the kingdom."],["The Southern Mines","The gold mines in the hills, guarded by the miners' people."]],
hk:["A caravan master wants to bait the manticore with gilded lead.","A griot has forgotten a verse of the kingdom's founding song, and it is the verse that names the manticore's weakness.","A miner has found a seam of gold that the manticore will not touch."],
sen:"Red dust and spice; drums and kora under the baobab; the jingle of harness bells; a laugh that sounds almost human."},

dunewhale_drift:{ep:"The Moving Town",
ov:"Dunewhale Drift is a sea of sand, and on it swims Thalassa, a sand-whale as big as a hill, with a whole town lashed to her back. The town moves wherever she swims, and it has been moving for longer than anyone can remember. The inn sways, the streets roll and first-time visitors get seasick. Glassmaw, the worm of the endless dune, hunts them both.",
geo:"The Drift is a deep desert of fine, soft sand that flows almost like water, and the creatures that live there swim through it rather than walk on it. The dunes rise and fall like waves, and storms raise sand-spray higher than towers. The town on Thalassa's back is built of wood, rope and canvas, its houses lashed to her hide by cables hooked into her barnacles. Glassmaw leaves trails of glass behind it, the only fixed landmarks in the Drift.",
eco:"The Drift has its own sea life: sand-whales, sand-sharks, sand-rays, burrowing crabs and swarms of glittering sand-fish. The whales filter the sand-fish through baleen like their ocean cousins. Glassmaw hunts the whales. There were once many sand-whales; now Thalassa is the last anyone knows of.",
ppl:"The people of the Drift are born on Thalassa's back and live their whole lives there. They are sailors, traders, whale-singers and sand-fishers. They are proud, close and suspicious of land-dwellers, whom they find boring. The whale-singers can speak to Thalassa and guide her, and they are the most respected people in the town.",
pow:"The town is governed by a captain elected by its people and advised by the whale-singers. When Thalassa surfaces near an oasis or a city, the town trades sand-fish, whale-oil, glass and news for water, food and timber.",
faith:"The people honour the day-gods and Thalassa, whom they think of as their mother. Every child's birth is announced to her by the whale-singers, and every death is sung into her ear before the body is given to the sand.",
hist:["Glassmaw has been following Thalassa for a month, and she is swimming faster and singing less. The whale-singers think she is afraid.","Within living memory Thalassa swam all the way to the sea and back, and the town saw the ocean for the first time.","In their grandparents' time there were three sand-whale towns, and they met every year for a great festival. The other two whales were lost to Glassmaw.","Thalassa's riders keep a calendar of her songs. She has been singing less."],
ty:"Glassmaw, the Worm of the Endless Dune, is a sandworm of incredible size with a mouth full of teeth like broken glass. Wherever it passes, it leaves a trail of glass behind it. It hunts the sand-whales, and it has killed every one of them except Thalassa.",
set:[["The town on Thalassa's back","A town of rope, timber and canvas lashed to the hide of a sand-whale, home of the Whale's Belly inn."]],
lm:[["Thalassa's Crown","The highest point of her back, where the whale-singers sing to her."],["The Glass Trails","The trails Glassmaw leaves behind, the only fixed landmarks in the Drift."],["The Whale Graveyard","Where the bones of the other sand-whales lie."]],
hk:["Thalassa is sick, and the whale-singers need a herb from an oasis she refuses to approach.","Sand pirates have been shadowing the town, waiting for Glassmaw to weaken it.","Glassmaw has been seen near the whale graveyard, and the whale-singers think it is waiting for Thalassa."],
sen:"The slow sway of the streets; whale-song through the floorboards; sand-spray on the wind; the hiss of something burrowing far below."},

xochitl_mire:{ep:"The Flower Rivers",
ov:"Xochitl Mire is a jungle swamp of rivers, lagoons and floating gardens, where river-cities of reed and carved stone rise above the water and are linked by canoe-roads and flower markets. Its people are farmers, traders, astronomers and priests, and they fill their canals with flowers every morning. Xibalbar, the hydra of the mire, has begun hunting along the canoe-roads, and it grows back every head it loses.",
geo:"The mire is a great basin where several rivers spread out into a maze of channels, lagoons and swamp forest. The river-cities stand on islands of rock in the lagoons, and the people have built floating gardens of reed and mud, called chinampas, around them. Canoe-roads, marked by carved posts, link the cities. Deep lagoons in the middle of the mire are said to have no bottom.",
eco:"The jungle is full of jaguars, caimans, monkeys, parrots, frogs and snakes. The lagoons are full of fish, turtles and water-birds. The floating gardens grow maize, beans, squash, flowers and chillies. Xibalbar lives in the deepest lagoon and hunts everything that swims or floats.",
ppl:"The people of the mire are farmers, fishers, traders, artisans, priests and astronomers. They are hard-working and ceremonial, and every part of life has a ritual. Their markets are among the busiest in the world. Ball-games are a passion, and great matches are played between the cities.",
pow:"Each river-city is ruled by a king advised by priests, and the cities form a league that meets to settle disputes. Maize, cacao, feathers, cotton, jade and flowers are traded between the cities and abroad. Cacao beans are used as money.",
faith:"The people honour the day-gods and the river, which they feed with flowers every morning. Their astronomers keep a calendar of the stars as precise as any in the world. In the old days the river-kings fed the swamp with greater offerings at the Feeding Steps.",
hist:["Xibalbar has begun hunting along the canoe-roads, and the cities are cut off from each other. The league is meeting for the first time in a generation.","Within living memory the old feeding rites at the Feeding Steps were abandoned as barbaric, and the priests who kept them were driven out.","In their grandparents' time the river-kings fed the swamp, and Xibalbar slept.","The old river-kings fed the swamp so that it would not feed on them. The tradition lapsed."],
ty:"Xibalbar, the Hydra of the Mire, is a vast serpent with many heads that grows two back for every one it loses. It slept for generations, fed by the offerings of the river-kings. Since the rites were abandoned it has woken, and now it hunts.",
set:[["Xochitl river-cities","River-cities of reed and carved stone on islands in the lagoons, linked by canoe-roads and flower markets."]],
lm:[["The Floating Gardens","Gardens on rafts of reed and mud around the cities."],["The Feeding Steps","A stone stair into the deep lagoon, where the river-kings once made their offerings."],["The Star Tower","The astronomers' observatory, the tallest building in the mire."]],
hk:["One of the old priests has come back, and he wants to restore the feeding rites; the city wants someone to find out what the rites really were.","A great ball-game between two cities is threatened by the hydra, and the players want an escort.","The astronomers have seen something in the stars that they say explains why Xibalbar woke."],
sen:"Flowers floating on dark water; drums from the ball-courts; chocolate and chilli; the slow ripple of something very large."},

lumbaya:{ep:"The Temple Jungle",
ov:"Lumbaya is a jungle of temple villages under a hot green canopy, where ruined stone stairs climb into the leaves and vanish. The people farm, fish and tend the temples their ancestors built, and they are warm, cheerful and fond of music. At dusk the Nightmother's shapeshifters stop pretending to be people, and every village has started counting its children.",
geo:"Lumbaya is a coastal jungle of tall trees, rivers and mangroves. The ruins of an ancient temple civilisation are everywhere: stepped pyramids, carved terraces and roads paved in stone, half-swallowed by roots. The temple villages are built around the ruins and use the old stones in their walls.",
eco:"The jungle is home to monkeys, birds, snakes, frogs, big cats and great clouds of insects. Fruit, nuts and medicinal plants grow everywhere, and the rivers are full of fish. The Nightmother's nightshifters live among the people, taking the form of someone familiar.",
ppl:"The people of Lumbaya are farmers, fishers, healers, musicians and temple-keepers. They live in close extended families and share everything. Music is part of every task, and every village has its own songs.",
pow:"Each village is led by a council of elders and its temple-keeper. The villages trade fruit, spices, medicines, carvings and rare woods with the coast.",
faith:"The people honour the day-gods and the sky, which the old temples were built to watch. Temple-keepers maintain the old astronomical alignments, though they no longer understand them fully. The people never speak the names of the dead after dark.",
hist:["The nightshifters have infiltrated three villages, and people have been found dead with someone they loved standing over them, smiling.","Within living memory the last temple-keepers who understood the old star alignments died.","In their grandparents' time the temples still watched the sky every night, and the nightshifters never came.","Lumbaya's temples were built to watch the sky. Their roofs have all been torn off from the inside."],
ty:"The Nightmother, Queen of the Nightshifters, is a shapeshifting horror who leads a brood of creatures that take the forms of people. She can wear anyone's face and voice, and she sends her children into villages to replace people one by one. She wants the temples, though nobody knows why.",
set:[["Lumbaya temple villages","Villages built among the ruins of the old temples, deep in the jungle."]],
lm:[["The Sky Temples","Stepped pyramids built to watch the stars, their roofs torn off from inside."],["The Root Stair","A stone stair swallowed by the roots of a giant fig tree."],["The Night Market","A market that appears only at night, where the nightshifters trade."]],
hk:["A woman believes her husband has been replaced, and the only way to be sure is to ask him something only he would know.","A temple-keeper wants to restore the old star alignments, believing they kept the nightshifters away.","A child says she has seen the Nightmother, and that the Nightmother looked like her mother."],
sen:"Heat and wet leaves; drums and flutes; overripe fruit; footsteps that stop when you do."}
});
Object.assign(GZL,{
sunscar:{ep:"The Glass Desert",
ov:"Sunscar is a desert of red dunes streaked with lines of glass, where a great empire once stood and vanished in a single day. Its towers still stick out of the sand like the masts of sunken ships. The Oasis of Qadira, with its seven wells, is the only green place for weeks in any direction, and every caravan in the desert passes through it. A colossus walks the horizon, and the oasis shrinks after every pass.",
geo:"The dunes of Sunscar are tall, red and restless, driven by winds that change with the seasons. Long streaks of glass run across them, some miles long, where something once burned the sand to crystal. The ruins of the vanished empire lie half-buried: towers, aqueducts, roads and great statues with their faces worn away. The oasis lies in a hollow where seven wells draw water from an aquifer deep below the sand, and palm groves and gardens surround it.",
eco:"Camels, sand foxes, desert hares, scorpions, vultures and sandworms live in the desert. Glass-backed lizards bask on the streaks and absorb heat through their crystal scales. Around the oasis live date palms, songbirds, fish in the pools and the gardens that feed its people. The Colossus draws water from the deep aquifer as it walks, and the oasis's wells are drying.",
ppl:"The people of Sunscar are nomads, caravaneers, water-keepers, merchants and treasure-hunters. The nomad tribes know every well and every dune, and they guide the caravans for a price. The water-keepers of Qadira are a hereditary order who manage the wells and keep the oasis's records. The treasure-hunters are mostly outsiders, drawn by stories of the vanished empire's wealth, and the water-keepers dislike them.",
pow:"The oasis is governed by the water-keepers, and every caravan pays a water-tithe. The nomad tribes are independent and keep their own laws. Trade in salt, spice, incense, glass and relics of the vanished empire flows through the oasis, and the caravanserai is the busiest market in the desert.",
faith:"The people honour the day-gods and the water, which they consider sacred. Wasting water is the worst of crimes. The vanished empire is remembered as a warning against pride: the stories say it tried to make itself into a god and was burned for it.",
hist:["The Colossus of Sunscar walks the horizon, and two of the seven wells have run dry. The water-keepers have begun rationing, and the nomads are arguing about whether to abandon the oasis.","Within living memory a treasure-hunter found a working machine in the ruins, and the water-keepers buried it again before anyone could learn what it did.","In their grandparents' time the oasis was twice its size, and the Colossus walked much further away.","Qadira's water-keepers can recite the oasis's shoreline for every year back to the first well."],
ty:"The Colossus of Sunscar, Walker of the Dunes, is a giant construct of the vanished empire, built to carry water from the deep aquifer to its cities. The cities are gone, but the Colossus still walks its route, drawing water and carrying it to places that no longer exist, then spilling it on the sand. It does not know the empire is gone, and it does not know it is killing the oasis. It defends itself from anything that tries to stop it.",
set:[["Oasis of Qadira","The green oasis around seven wells, with palm groves, gardens and the Oasis Caravanserai."]],
lm:[["The Glass Streaks","Long lines of melted sand where something burned the desert to crystal."],["The Sunken Towers","Towers of the vanished empire rising from the dunes."],["The Seven Wells","The wells of Qadira, two now dry."]],
hk:["A water-keeper believes the Colossus could be redirected, if someone could reach the control chamber in its chest.","A treasure-hunter wants to dig up the machine the water-keepers buried, and she claims it could save the oasis.","A caravan has been lost in a sandstorm, and its water-tithe was never paid."],
sen:"Hot sand and date palms; the clink of glass underfoot; the call to the wells at dawn; a distant, rhythmic thud."},

stormreach:{ep:"The Lightning Coast",
ov:"Stormreach is a coast of cliffs and mountains where the sea never calms and the sky is never still. Its towns are bolted to the rock above the waves, and lightning rods crown every roof. The people are fishers, rope-makers and storm-callers, as wild as the weather and as tough as the cliffs. Raikaru, the Storm Roc, nests in the thunderheads, and the storms have grown worse since it arrived.",
geo:"Sheer cliffs of dark rock rise straight from the sea, battered by waves that throw spray hundreds of feet into the air. Behind them, jagged mountains catch the storm clouds that roll in from the ocean. The cliff-towns are built on ledges and terraces, joined by stairs, ladders and rope bridges, and every building is anchored to the rock. Lightning strikes the mountains so often that whole peaks are scorched black.",
eco:"Seabirds nest on the cliffs in vast numbers, and their eggs and guano are harvested by the people. Seals, sea lions and fish fill the waters below. Thunderbirds, storm elementals and giant eagles live in the mountains. The roc hunts everything, including the people.",
ppl:"The people of Stormreach are fishers, egg-gatherers, rope-makers and storm-callers. They are loud, cheerful, fearless and slightly mad, by the standards of everyone else. Storm-callers can read the weather and, it is said, call lightning down where they want it. Children learn to climb before they can walk.",
pow:"Each cliff-town is governed by its storm-caller and a council of elders. Fish, eggs, rope, guano and lightning-glass are traded south. Stormreach rope is the strongest in the world.",
faith:"The people honour the day-gods and the storm, which they believe is a living thing. Lightning that strikes a person is considered a blessing, if they survive. The dead are left on high peaks for the lightning to take.",
hist:["Raikaru has made its nest in the thunderheads above the cliffs, and the storms have become relentless. Lightning has struck two towns, and the fishing fleets cannot go out.","Within living memory a storm-caller called down lightning on a pirate fleet and sank it in a single afternoon.","In their grandparents' time the first lightning rods were bolted to the cliffs, and the towns stopped burning.","The bolts in the cliff are lightning rods. The towns were built after the first ones worked."],
ty:"Raikaru, the Storm Roc, is a giant bird of prey whose wings create thunder and whose feathers crackle with lightning. It has made its nest in the thunderheads above Stormreach, and it feeds on the storms themselves, growing larger and the storms fiercer with every passing month.",
set:[["Stormreach cliff-towns","Towns bolted to the cliffs above the sea, crowned with lightning rods."]],
lm:[["The Black Peaks","Mountains scorched black by lightning."],["The Rod Forest","A field of lightning rods on the highest cliff, where the storm-callers train."],["The Roc's Nest","A nest in the thunderheads, visible only during lightning flashes."]],
hk:["A storm-caller has lost her power, and she thinks the roc took it.","A fishing fleet is trapped in a cove by the storm, and the town needs rope carried to it along the cliffs.","An egg-gatherer has found a roc egg."],
sen:"Salt spray and ozone; thunder that never stops; wet rope and seabird cries; the hair on your arms standing up."},

true_name_isles:{ep:"The Naming Islands",
ov:"The True-Name Isles are a scattering of small islands far out in the eastern sea, where every child sails out on a Naming Voyage and comes home with a true name given by the sea. A true name is a person's deepest self, and those who know it can call them across any distance. The islanders are calm, thoughtful and deeply private. The Nameless Tide is a serpent no one has named, and it has begun taking names for itself.",
geo:"The isles are low, rocky islands of white sand and wind-bent trees, spread across a wide stretch of ocean. The waters between them are clear and calm, except at the Naming Rocks, a ring of stone pillars in the open sea where the currents meet. The harbour of the Naming Voyage stands on the largest island.",
eco:"Seabirds, turtles, dolphins and whales live around the isles, and the reefs are full of colourful fish. Sea serpents, merfolk and sea spirits live in the deeper waters. The sea itself seems to have a will here, and the islanders say it listens.",
ppl:"The islanders are fishers, sailors, navigators and namers. They are quiet, patient and careful with words. Everyone has a common name and a true name, and they share their true name only with those they love most.",
pow:"The isles are governed by a council of namers, who guide the Naming Voyages and interpret the sea. Fish, pearls, navigation charts and naming-services are the islands' trade; people from other lands pay to have their children named.",
faith:"The islanders honour the day-gods and the sea, which gives the names. A child who returns from the Naming Voyage without a name is considered unfinished and may try again the next year.",
hist:["The Nameless Tide has begun taking the true names of children on their Naming Voyages, and they return empty, unable to remember who they are. The council has suspended the voyages.","Within living memory a child returned from the Naming Voyage with a name that no one could pronounce, and became the greatest navigator of her age.","In their grandparents' time the sea gave every name it was asked for.","Names here are given by the sea. The sea has started keeping some of them."],
ty:"The Nameless Tide is a serpent without a name, born in the deep where the sea gives names. It has no self, and it wants one. It takes the true names of those on their Naming Voyages, trying each one on, but none of them fit.",
set:[["Naming Voyage harbor","The harbour on the largest island, where the Naming Voyages begin."]],
lm:[["The Naming Rocks","A ring of stone pillars in the open sea where names are given."],["The Hall of Names","Where the council keeps the records of every name given."],["The Silent Reef","A reef where nameless children are said to wander."]],
hk:["A child has returned from her Naming Voyage empty, and her parents want her name back.","The council wants someone to give the Nameless Tide a name, and they have a theory about how.","A navigator claims to have found the place where the sea keeps the names it has taken."],
sen:"Calm water and white sand; wind in the trees; whispers that sound like names; a silence at the Naming Rocks."},

hollow_sea:{ep:"The Ocean Under the World",
ov:"The Hollow Sea is a lightless ocean beneath the surface, reached by a great waterfall that pours down from the world above. Boat-towns sail it, steering by the glow of fish and the songs of their navigators. It is a dark, vast, eerie place, and its people love it. The Lumen-Eater swims below with its lure, and every boat-town remembers a town that followed it.",
geo:"The Hollow Sea fills a cavern so vast that its ceiling cannot be seen. The water is cold, still and black, lit only by bioluminescent fish, algae and fungi. Islands of rock and fungus rise from it here and there. The great waterfall that fills it can be heard from miles away.",
eco:"Glowing fish, jellyfish, eels and squid live in the water, and pale crabs scuttle on the islands. Fungus forests grow on the rocks. The Lumen-Eater hunts in the depths, luring prey with a light that looks like home.",
ppl:"The people of the Hollow Sea are sailors, fishers and navigators, descended from people who came down the waterfall by accident. They are pale, quiet and tough, and they have never seen the sun. They love the dark and pity surface-dwellers.",
pow:"Each boat-town is governed by its captain and navigators. Fish, glowing algae, fungi and pearls are traded with the Underworld and, rarely, with the surface.",
faith:"The people honour the day-gods, though they have never seen a day, and the light of the fish, which they believe is the light of their ancestors. They never follow a light they do not know.",
hist:["The Lumen-Eater has taken two boat-towns this year. Both followed a light that looked like the surface.","Within living memory a boat-town tried to sail back up the waterfall and was never seen again.","In their grandparents' time the boat-towns numbered in the dozens.","The first boats came down the great waterfall by accident. Their children made a nation of it."],
ty:"The Lumen-Eater, the Abyss Angler, is a vast angler fish whose lure glows with a light that looks like whatever its prey most wants to see. Most often it looks like the surface.",
set:[["Hollow Sea boat-towns","Floating towns of boats lashed together, sailing the lightless sea."]],
lm:[["The Great Waterfall","The waterfall that feeds the Hollow Sea from the world above."],["The Glow Gardens","Fields of glowing algae where the boat-towns fish."],["The False Light","A light in the deep that every navigator knows not to follow."]],
hk:["A boat-town's navigator has started seeing the sun in her dreams, and the captain wants to know why.","A survivor from a lost boat-town has been found clinging to a rock.","A surface-born adventurer wants a guide across the Hollow Sea, and no one will take her."],
sen:"Cold, still air; the distant roar of the waterfall; the glow of fish under the hull; songs sung in the dark to keep the boats together."},

ashira_vale:{ep:"The Kindest Valley",
ov:"Ashira Vale is the kindest valley in the world: soft fields, warm doors and a town that welcomes everyone who arrives. Its people are gentle, generous and happy. Visitors who come for a night stay a week, and those who stay a week stay forever. The Gentle Warden makes sure that no one who arrives ever wants to leave.",
geo:"The vale is a sheltered valley of green fields, orchards and woodland, ringed by hills that keep out the wind. A clear river runs through the middle, and the town of Ashira stands on its banks. The weather is always mild.",
eco:"Deer, rabbits, songbirds and bees live in the vale, and everything is tame. There are no predators. The flowers bloom all year round.",
ppl:"The people of Ashira are farmers, craftspeople and hosts, and many of them came from somewhere else. They are kind, cheerful and incurious. They do not like to talk about where they came from.",
pow:"Ashira is governed by a council of elders who rarely meet, because there is never anything to argue about. The vale trades nothing; it does not need to.",
faith:"The people honour the day-gods and the Gentle Warden, whom they call the vale's protector. There is no graveyard in Ashira.",
hist:["Travellers are disappearing on the roads into the vale, and their families are asking questions.","Within living memory a famous adventurer came to the vale to rest, and never left.","In their grandparents' time the vale was an ordinary valley with ordinary troubles.","Ashira has no graveyard. No one remembers when anyone last asked why."],
ty:"The Gentle Warden, Keeper of Ashira, is an aberration that feeds on contentment. It makes the vale perfect so that its people will never leave, and it keeps them happy until there is nothing left of them but happiness.",
set:[["Ashira","A warm, welcoming town on the river, where everyone is happy."]],
lm:[["The Warden's Garden","A garden at the centre of town, always in bloom."],["The Missing Graveyard","Where a graveyard should be, and is not."],["The Hill Road","The road into the vale, where travellers disappear."]],
hk:["A woman is looking for her husband, who came to Ashira a year ago and wrote that he was happy.","An adventurer who has lived in Ashira for twenty years has started to remember something.","A child in Ashira asks why there are no old people."],
sen:"Warm bread and honey; birdsong; laughter; a sweetness that becomes cloying if you stay too long."},

dragon_spine:{ep:"The Bones of the Dragon",
ov:"Dragon Spine is a range of volcanic peaks running along what the monks say is the backbone of a sleeping dragon. Monasteries are built into the bones, and the monks pray that the dragon stays asleep. Drakes nest on the peaks, and their lord wants the bones back.",
geo:"The range is a long, jagged ridge of volcanic peaks, some still active, with lava flows and steaming vents. Great bones, white and enormous, stick out of the rock in places, and the monasteries are built into them.",
eco:"Drakes, wyverns, fire salamanders and mountain goats live on the peaks. Hardy shrubs and lichens grow in the volcanic soil.",
ppl:"The people of Dragon Spine are monks, pilgrims and miners. The monks are scholars of dragons and keepers of the bones.",
pow:"The monasteries govern the range, and pilgrims bring wealth to them. Dragon-bone relics are traded, and the monks disapprove.",
faith:"The monks honour the day-gods and the sleeping dragon, whom they pray to keep asleep.",
hist:["Vyrmax the Drake Lord has attacked three monasteries and is demanding the bones.","Within living memory a monk tried to wake the dragon and was burned alive.","In their grandparents' time the drakes were few and feared the monks.","The monks say the mountain was a dragon who lay down to rest. They pray that it stays asleep."],
ty:"Vyrmax, the Drake Lord, is a great drake who believes the bones are those of his ancestors, and he wants them back.",
set:[["Dragon-bone monasteries","Monasteries built into the great bones."]],
lm:[["The Skull","A monastery built into a great dragon skull."],["The Burning Peaks","Active volcanoes along the range."],["The Bone Road","A road along the spine."]],
hk:["A monk wants to know if the bones really are dragon bones.","Vyrmax has offered peace in exchange for a single bone.","A pilgrim has stolen a relic."],
sen:"Sulphur and incense; chanting; the heat of the rock; the feeling of something breathing under your feet."}
});
Object.assign(GZL,{
ashira_vale:{ep:"The Kindest Valley",
ov:"Ashira Vale is the kindest valley in the world. Its fields are soft, its doors are always open and its single town welcomes every traveller with bread, honey and a bed. Visitors who come for a night stay a week, and those who stay a week stop writing home, though their last letters always say they are happy. The vale has no Tyrant that anyone in it would recognise as one. The Gentle Warden makes sure that no one who arrives ever wants to leave.",
geo:"The vale is a sheltered bowl of green fields, orchards and beech woods ringed by round hills that keep out the wind. A clear, slow river runs through the middle, and the town of Ashira stands on both its banks, joined by a dozen little bridges. The weather is always mild: rain falls at night, the sun shines by day and the seasons change so gently that no one notices. Only one road leads in over the hills, and the milestones along it stop counting halfway.",
eco:"Deer graze at the edge of the orchards and do not run from people. Rabbits, songbirds and bees fill the fields, and the flowers bloom all year. There are no wolves, no foxes, no hawks and, the locals say proudly, no flies. Travellers who know the wild find this unsettling: a valley with only prey animals in it should be overrun, and Ashira is not. Something keeps the balance, and it does not do it by hunting.",
ppl:"The people of Ashira are farmers, bakers, weavers and hosts, and most of them came from somewhere else. A retired soldier keeps bees; a former pirate grows roses; a famous adventurer from two generations ago runs the bakery and cannot remember her own legend. They are warm, cheerful and incurious about the outside world. They are happy to talk about the weather, the harvest and each other, and they change the subject, gently and completely, when asked where they came from or what they have lost.",
pow:"Ashira has a council of elders that meets on the first Solenday of each month and has nothing to decide. There is no crime, no debt and no quarrel worth bringing to it. The vale trades nothing with the outside world and needs nothing from it; its fields feed everyone with something left over. Merchants who come to sell find that they no longer want to, and they stay to help with the harvest.",
faith:"The people honour the day-gods with flowers and songs and speak of the Gentle Warden as the vale's protector, the reason Ashira is safe. They leave honey at a garden in the middle of town where the Warden is said to walk. There is no graveyard in Ashira, no funeral customs and no word in the local speech for mourning.",
hist:["Travellers are disappearing on the road into the vale, and their families are asking the guild where they went. The guild's own investigator went in a month ago and sent back a letter saying she had never been happier.","Within living memory a famous party of adventurers came to the vale to rest after a great campaign. They are still there, and they do not remember the campaign.","In their grandparents' time Ashira was an ordinary farming valley with ordinary troubles, and the old maps show a graveyard on the hill behind the mill.","Ashira has no graveyard. No one remembers when anyone last asked why."],
ty:"The Gentle Warden, Keeper of Ashira, is an aberration that feeds on contentment. It is not cruel; it genuinely wants everyone to be happy. It soothes away grief, ambition, regret and memory, one by one, until a person is perfectly at peace and perfectly empty, and then it takes what is left. It is everywhere in the vale and nowhere in particular, and the only sign of it is how good everything feels. Fighting it means persuading people to want their pain back.",
set:[["Ashira","A warm, welcoming town of bridges and gardens on the river, where everyone is happy."]],
lm:[["The Warden's Garden","A walled garden at the centre of town, always in bloom, where honey is left for the Warden."],["The Hill Behind the Mill","Where the old maps show a graveyard, and where now there is only a meadow that hums."],["The Hill Road","The only road in, whose milestones stop counting halfway."]],
hk:["A woman from Aldmere is looking for her husband, who came to Ashira a year ago and wrote that he was happy, and then stopped writing.","The baker, once a famous adventurer, has begun to dream of a battle she cannot remember, and she wants to know whether to let herself remember it.","A child in Ashira asks why there are no old people, and nobody can answer her."],
sen:"Warm bread and honey; birdsong all day; laughter from every doorway; a sweetness that turns cloying if you stay too long."},

dragon_spine:{ep:"The Bones of the Dragon",
ov:"Dragon Spine is a long ridge of volcanic peaks that runs along what the monks say is the backbone of a sleeping dragon. Great white bones break through the black rock along its length, and the monasteries of the dragon-monks are built into them: halls in ribs, libraries in vertebrae, a temple in a skull. Pilgrims come from every land to pray there. The drakes of the peaks have a lord now, and he wants the bones back.",
geo:"The range is a ridge of black basalt peaks, some still active, with rivers of lava creeping down their flanks and steaming vents along the valleys. The bones rise from the rock in a line that runs the length of the range, each one as big as a tower, and the soil around them is strangely fertile. The Bone Road, a pilgrim path cut along the crest, links the monasteries from end to end. At the northern end stands the Skull, the greatest monastery of all.",
eco:"Drakes, wingless cousins of the true dragons, nest on the hottest peaks and hunt goats, boars and anything slow. Wyverns roost in the cliffs, and fire salamanders swim in the lava. Hardy pines, fire-lilies and lichens grow in the volcanic soil around the bones, which give off a faint warmth even in winter. The drakes are territorial and grow larger the closer they nest to the bones, which the monks find worrying.",
ppl:"The dragon-monks are scholars, healers and keepers of the bones, sworn to study dragons and keep the sleeper asleep. They come from every land and give up their old names when they take their vows. Pilgrims, miners and the families who serve the monasteries make up the rest of the population. Some miners have been caught chipping relics from the bones, which fetch a fortune in the lowland markets.",
pow:"The monasteries govern the range jointly through an abbots' council that meets in the Skull. Pilgrims bring gold and offerings, and the monasteries trade medicines, books and fire-lily oil. The black market in dragon-bone relics is the monks' greatest shame and the miners' greatest temptation.",
faith:"The monks honour the day-gods and the sleeping dragon, whom they believe is neither dead nor a god but simply resting. Their daily prayers are lullabies. Any sound loud enough to echo off the bones is forbidden within the monastery walls, and visitors are asked to remove their boots.",
hist:["Vyrmax the Drake Lord has attacked three monasteries and demands that the monks give up the bones. The abbots' council is split between those who would fight and those who would bargain.","Within living memory a monk tried to wake the dragon with a ritual he found in an old book, and was burned alive by a fire that came out of the rock.","In their grandparents' time the drakes were few and small and feared the monks, and pilgrims walked the Bone Road without guards.","The monks say the mountain was a dragon who lay down to rest. They pray that it stays asleep."],
ty:"Vyrmax, the Drake Lord, is the largest drake ever recorded, bigger than many true dragons. He believes the bones are those of his greatest ancestor and that the monks are grave-robbers who have defiled them for a thousand years. He wants the bones returned to the drakes and the monasteries torn down. He is proud and furious but not stupid, and he might be reasoned with by anyone who can prove what the bones really are.",
set:[["Dragon-bone monasteries","Monasteries built into the great bones along the Bone Road, with the Skull at their head."]],
lm:[["The Skull","The greatest monastery, built inside a dragon skull large enough to hold a town."],["The Burning Peaks","Active volcanoes at the southern end of the range, where Vyrmax nests."],["The Bone Road","The pilgrim path along the crest, linking every monastery."]],
