<style>
/* Layout: a painted sea-chart plate. Map on top with title and compass on the water; controls + legend band; region card band (vignette | facts | lore). Single committed night-sea look. */
:root{
  --sea:#0b2236; --bg:#081626; --panel:#0e2236; --panel2:#12304a; --line:#2c5070; --ink:#e9e2cf; --muted:#9fb3c4;
  --gold:#e3c27a; --gold-dim:#a88a4d; --red:#a8302f; --red-soft:#5c1f24; --btn:#163a57;
  --font-display:"Cinzel","Trajan Pro",Georgia,serif;
  --font-lore:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.page{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mapcard{position:relative;border-radius:6px;overflow:hidden;background:var(--sea);box-shadow:0 0 0 1px var(--line)}
.stage{position:relative;width:100%;aspect-ratio:3/2;max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ovl{cursor:pointer;touch-action:manipulation}
.band{display:grid;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.controls{grid-template-columns:auto minmax(0,1fr) auto}
.controls>div{padding:14px 16px;min-width:0}
.controls>div+div{border-left:1px solid var(--line)}
@media (max-width:980px){.controls{grid-template-columns:minmax(0,1fr)}.controls>div+div{border-left:0;border-top:1px solid var(--line)}}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.btnrow:last-child{margin-bottom:0}
.tb{font:500 14px var(--font-lore);font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 14px;cursor:pointer}
.tb[aria-pressed="true"]{background:var(--btn);border-color:#4c7da3;box-shadow:inset 0 0 0 1px rgba(227,194,122,.25)}
.tb:hover{border-color:var(--gold-dim)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cap{font:600 11px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 14px;font:16px var(--font-lore)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:16px;height:16px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.side{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:220px}
.finder{position:relative}
#find{width:100%;box-sizing:border-box;font:16px var(--font-lore);padding:7px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
#results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;max-height:300px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
#results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:15px var(--font-body);padding:6px 10px;cursor:pointer}
#results button:hover,#results button:focus-visible{background:var(--btn)}
#results small{color:var(--muted)}
.seed{font:13px var(--font-body);color:var(--muted);text-align:center}
.card{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1.2fr);min-height:190px}
.card>div{padding:16px 18px;min-width:0}
.card>div+div{border-left:1px solid var(--line)}
.card{overflow:hidden}.vig{padding:0!important;position:relative;min-height:180px;overflow:hidden;contain:size}
.vig canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:6px 0 0 6px}
@media (max-width:980px){.card{grid-template-columns:minmax(0,1fr)}.card>div+div{border-left:0;border-top:1px solid var(--line)}.vig{aspect-ratio:16/7}.vig canvas{border-radius:6px 6px 0 0}}
.where{font:600 11px var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{font:700 26px var(--font-display);margin:4px 0 8px;letter-spacing:.04em;text-wrap:balance}
.pill{display:inline-block;font:600 15px var(--font-lore);padding:2px 12px;border-radius:6px}
.pill.besieged{background:var(--red-soft);color:#ffd2c8;box-shadow:inset 0 0 0 1px #8a3a36}
.pill.liberated{background:#3a3218;color:var(--gold);box-shadow:inset 0 0 0 1px #6b5a2c}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 18px;margin:12px 0 0;align-items:baseline}
dt{font:16px var(--font-lore);color:var(--muted)}
dd{margin:0;font:16px var(--font-lore)}
.mono{font:600 18px var(--font-display);letter-spacing:.12em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:0 9px;font:15px var(--font-lore)}
.lore{font:italic 500 18px/1.55 var(--font-lore);color:#e6dcc4;margin:0}
.lore b{font-style:italic;color:var(--gold);font-weight:600}
.lore-note{font:13px var(--font-body);color:var(--muted);margin:10px 0 0}
.entry{display:block;padding:22px 24px}
.entry .ep{font:italic 500 20px var(--font-lore);color:var(--gold);margin:0 0 4px}
.entry h3{font:700 22px var(--font-display);letter-spacing:.05em;margin:0 0 14px}
.entry .cols{columns:2 420px;column-gap:36px}
.entry section{break-inside:avoid;margin:0 0 18px}
.entry h4{font:600 11px var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.entry p{font:17px/1.6 var(--font-lore);margin:0 0 8px;color:#e6dcc4}
.entry ul{margin:0;padding-left:18px;font:17px/1.55 var(--font-lore);color:#e6dcc4}
.entry li{margin:0 0 6px}
.entry li b,.entry p b{color:var(--gold);font-weight:600}
.entry .hist dt{font:600 15px var(--font-lore);color:var(--gold);margin-top:6px}
.entry .hist dd{margin:0 0 4px;font:17px/1.55 var(--font-lore);color:#e6dcc4}
.entry .hist{display:block;margin:0}
.entry details.cx{margin:6px 0 4px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.entry details.cx summary{cursor:pointer;color:var(--gold);font:600 15px var(--font-lore)}
.entry details.cx p,.entry details.cx li{font-size:16px}
.entry .sen{font-style:italic;color:#cfc6b0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <section class="mapcard" aria-label="World map of Aetheria">
    <div class="stage">
      <canvas id="terrain" aria-hidden="true"></canvas>

    <div>
      <p class="cap" id="legendCap">Terrain colours</p>
      <div class="legend" id="legend"></div>

    <div class="side">
      <div class="finder">
        <label class="cap" for="find" style="display:block">Find a region, town, Tyrant or clan</label>
        <input id="find" type="search" placeholder="Brindlewick, Ashgrave, otter clan…" autocomplete="off" aria-controls="results">
        <div id="results" hidden></div>
      </div>
      <button class="tb" id="reseed">Redraw coastlines</button>
      <div class="seed" id="seedNote"></div>
    </div>
  </section>

  <section class="band card" aria-live="polite">
    <div class="vig"><canvas id="vig" aria-hidden="true"></canvas></div>
    <div id="facts"></div>
    <div id="loreBox"></div>
  </section>

  <section class="band entry" id="entry" aria-label="Gazetteer entry"></section>
</div>

// Gazetteer v1 — player-facing, spoiler-free. Built with the fantasy-world-building framework:
// every land gets a present (what you see now) and a past (what shaped it), and its terrain explains its people.
const GAZ = {
whisperwood:["Old oaks close over the cart-roads between <b>Brindlewick</b> and <b>Millbrook</b>, and every new adventurer's first map is a map of this wood. The Hollowpine goblins raid from a camp among the ruins, and <b>Grukk</b> leads them with more cunning than anyone expects of a goblin chief.","The ruins were waystations of the old kingdom. Grandmothers still leave bread on their steps for travellers who never came home."],
aldmere:["The heartland: wheat plains, wet woods and a crown city whose walls still stand. At night the dead march out of the Greyhollow barrows under <b>Ashgrave, the Oathless Baron</b>, a knight who broke his oath and lost the rest of himself.","Aldmere's royal valley fed three wars. Every farm along it has a sword buried under its doorstep, and every family has its own story about why."],
greymoor:["Stilt-houses and a market hut that walks on its own legs stand in a fog so thick that sound dies in it. The <b>Hollow Abbot</b> leads a choir of silence through the reeds, and wherever it passes the bells stop ringing.","The abbey sank into the bog a lifetime ago, monks and all. The villagers still keep its feast days, out of habit and out of fear."],
labyrinth_upper:["The first forty floors of the <b>Great Labyrinth</b> are the guild's proving ground. The halls reset, the loot returns, and the stairs never seem to end where the map says they should.","Nobody built the Labyrinth that anyone can name. The earliest guild ledgers already call it old."],
labyrinth_deep:["Below floor forty the halls widen into drowned cities and inverted forests. Raid councils draw lots for who goes first.","Parties that never came back left chalk marks behind them. Some of the marks point to rooms that no longer exist."],
labyrinth_abyss:["The last thirty floors bend light and memory. Monsters this deep wear ranks that no adventurer's card can show.","Legend says the hundred-and-twentieth floor is where the world was sewn together, and where one knot was never tied."],
sylvaran:["Canopy City <b>Lothaniel</b> hangs in trees taller than towers, and moonwells glow in the hamlets beneath it. <b>Mycelia the Spore Lord</b> spreads from below, softening bark and mind alike.","The elves remember planting these trees. The trees remember something older that grew there first."],
mossdeep:["Everything in Mossdeep is too big, except the people. The Thimblefolk live in a mushroom town knee-high to a traveller, and <b>Mother Webcrawler</b> hunts them from the ferns above.","Thimblefolk tell of a giant who once shared their bread and kept the spiders off. They still set out a thimble of milk for him."],
lirian:["A city of canals, lanterns and bridges where songs float up from the water at dusk. Those songs belong to the <b>Drowned Choir</b>, and the people who follow them into the canals are never seen again.","Lirian was built over a flooded older Lirian. On quiet nights you can see its rooftops under the boats."],
fanghold:["Wind-scoured grasslands where yurt camps follow the herds and one stone fort guards the only well for a week's ride. <b>Varrick Kade</b> deals in people here, and his ledger is longer than his whip.","The nomad clans swore a water-peace three generations ago. Kade is the first man to break it and live."],
iron_hold:["Mountains with fire for veins. The dwarven hold of <b>Karak Dûn</b> mines the Ashen seams beneath them, and <b>Skarn the Fire Giant Warlord</b> wants the forges and the furnace-heart that feeds them.","The dwarves sealed the deepest shaft after something answered their hammers from below. The seal is warm to the touch."],
moraveil:["Rolling farmland, deep caves and something rare: a goblin village and a human market town that trade in peace. <b>Grakkus the Orc Disaster</b> means to end that, and he is called a disaster for good reason.","Moraveil's truce began when a goblin child pulled a farmer's daughter out of a flooded cave. Both of them are still alive."],
strife_marches:["Border baronies and mercenary forts trade the same fields back and forth every season, and the old ruins have changed flags more often than anyone can count. Lately a preacher called <b>Diego Alvarez</b> has gathered the Choir of Chains to sing over them.","Every baron here can point to the treaty that makes him the rightful one. None of the treaties agree."],
velmark:["Prosperous ducal towns of white stone and paid tithes. Beneath the foundations, the <b>Tithe Colossus</b> has woken hungry for what the stones were promised.","The first duke paid the land a tithe for its stones. His heirs stopped paying."],
hoshizora:["Cedar mountains, a sea of bamboo and a city of red bridges where spirits are given seats at festivals. <b>Kurogane the Oni Warlord</b> came down from the peaks with a mask for every village he means to rule.","Hoshizora's shrines are rebuilt every twenty years so that the gods stay curious. The last rebuilding was left unfinished."],
kitsune_isles:["Fox shrines and spirit inns where the hosts' ears don't always match their faces. The <b>Hollow Bride</b> walks the cliff paths with a neck that stretches as long as her grief.","Each island was once a promise between a fox and a fisherman. One of those promises was broken."],
frostveil:["Longhouses hug the fjord walls and the sun barely clears the peaks in winter. <b>Ymgrir the Frost Sovereign</b> claims every stead his breath can reach, and his breath reaches farther each year.","The skalds of <b>Skjaldheim</b> sing of a summer that lasted a hundred years. No one living has seen one."],
shen_lu:["Cultivation sects train on mountain stairs that climb into the clouds. <b>Wuxiang the Hunger Colossus</b> devours the qi of the peaks themselves.","The sects were one school before the Hundred-Stair Schism. Their founders' graves face away from each other."],
haneul:["Gate-towns climb a mountain pass to a city that has never fallen, though it has come close. A red gate has opened in the clouds, and <b>Varos</b> is its herald.","Haneul built its wall for an enemy from the north. The red gate opened in the sky instead."],
whitewater_reach:["White water, white ice and fishing villages built on both. <b>Ysgrath the Ice-Jaw Leviathan</b> breaks the floes from below.","Fishers here marry the sea first and their spouses second. It is in the vows."],
umbravel:["A city of hanging lanterns spun in silk, deep beneath the surface. The webs hold the city up, and <b>Vel'thara the Web Queen</b> wants to collect the rent.","Umbravel's founders fled the surface during the Sundering and chose the dark over the sky."],
sunscar:["Glass-streaked dunes surround the green <b>Oasis of Qadira</b>. The <b>Colossus of Sunscar</b> walks the horizon, and the oasis shrinks after every pass.","Qadira's water-keepers can recite the oasis's shoreline for every year back to the first well."],
goldmere_coast:["<b>Port Goldmere</b> runs on salvage, and the pirate stilt-towns run on what Goldmere misses. The <b>Krakenmother Ys</b> rules the wreck-tide, which is where all the salvage comes from.","Half the port is built from the timber of one great fleet that sank in a single night."],
zarvan:["Garden cities bloom on terraces cut into desert mountains, fed by aqueducts older than the kingdom. <b>Zahhar, King of the Divs</b> claims the water and every rose it grows.","The div-kings ruled Zarvan before people did. They signed the garden treaties in water, and water forgets."],
zaruma:["Towns along the gold road and caravans heavier than their camels. <b>Mansacor</b> eats the gold first and then the people carrying it.","Zaruma's first queen paved a mile of road in gold to shame a rival. The manticore found the mile."],
dunewhale_drift:["A town lives on the back of <b>Thalassa</b>, a sand-whale as big as a hill, and moves wherever she swims. <b>Glassmaw</b>, the worm of the endless dune, hunts them both.","Thalassa's riders keep a calendar of her songs. She has been singing less."],
xochitl_mire:["River-cities of reed and stone rise above a jungle swamp, linked by canoe-roads and flower markets. <b>Xibalbar</b>, the hydra of the mire, grows back every head it loses.","The old river-kings fed the swamp so that it would not feed on them. The tradition lapsed."],
lumbaya:["Temple villages under a hot green canopy, where ruined steps climb into the leaves. At dusk the <b>Nightmother</b>'s shapeshifters stop pretending to be people.","Lumbaya's temples were built to watch the sky. Their roofs have all been torn off from the inside."],
stormreach:["Cliff-towns are bolted to the rock above a sea that never calms. <b>Raikaru the Storm Roc</b> nests in the thunderheads.","The bolts in the cliff are lightning rods. The towns were built after the first ones worked."],
true_name_isles:["Islands where every child sails out on a Naming Voyage and comes home with a true name. The <b>Nameless Tide</b> is a serpent no one has named, and it wants one.","Names here are given by the sea. The sea has started keeping some of them."],
hollow_sea:["A lightless ocean under the world, sailed by boat-towns that steer by the glow of fish. The <b>Lumen-Eater</b> swims below with its lure, and every boat-town remembers a town that followed it.","The first boats came down the great waterfall by accident. Their children made a nation of it."],
ashira_vale:["The kindest valley in the world: soft fields, warm doors and a town that welcomes everyone. The <b>Gentle Warden</b> makes sure that no one who arrives ever wants to leave.","Ashira has no graveyard. No one remembers when anyone last asked why."],
dragon_spine:["Volcanic peaks along a dragon's backbone, with monasteries built into the bones. <b>Vyrmax the Drake Lord</b> wants the bones back.","The monks say the mountain was a dragon who lay down to rest. They pray that it stays asleep."],
sky_archipelago:["The Titans' cities float in the clouds, abandoned and silent, linked by bridges that end in open air. No Tyrant holds them, but the winds are not empty.","The Titans left their tables set, as if they meant to come back."],
heavenreach:["Eyries carved into the highest cliffs in the world, home of the winged Heavenfolk. <b>Aquilon the Roc Sovereign</b> rules the air and taxes the sky.","The Heavenfolk once flew messages for every king below. Their oaths were broken first."],
vharlen:["Fortress plains facing the demon frontier, where every citizen drills and every child knows the alarm horns. <b>Morvane, Vanguard of the Overlord</b> tests their walls.","Vharlen held the line the last time. The pledge it took to do so is carved under the barracks."],
gearholm:["A clockwork city stacked on a mountain, and an Undercity where the steam and the poor collect. <b>Cogmaw the Gremlin Engine King</b> is taking it apart from the bottom up.","Gearholm's founders built the city's engines and lost the instructions within a generation."],
cinderhole:["A city in a smoking crater, built inside caves that are never dark and never clean. <b>Cinderlord Vasque</b> rules the smoke and everything sold through it.","Cinderhole was a mine until it caught fire. It never stopped burning, so people moved in."],
bastion:["Ring upon ring of walls on an open steppe, the last stop before the horde lands. <b>Thrakka, Sabretooth Khan</b> rides against the outer ring.","Bastion builds a new ring every time the horde breaks the outermost one. There are many rings."],
everdusk:["An endless twilight forest where fey courts hold revels in the glades. The <b>Briar King</b> of the Winter Court wants the Summer Court's last glade.","The courts made the dusk to settle an argument about whether it was day or night. They are still arguing."],
apu_highlands:["Terrace cities climb mountains that were carved by hand, though no one knows whose. <b>Ukhu-Tal</b>, the first stone giant ever made, has woken to see what was done with them.","Highland families keep knotted cords recording every terrace. The oldest cords record a giant's name."],
lustrine_shores:["Beaches of moon-glass where the tide leaves light behind it. <b>Ilyanthe the Moon Harvester</b> gathers that light for the red moon.","The glass began washing in after the red moon rose. The fishers' songs changed key that same year."],
quaking_lands:["The ground here moves, and towns are built around the few springs where it is still. <b>Quakeback</b> is the reason, and it is turning in its sleep.","The Stillers learned to read tremors the way sailors read weather. Their oldest maps are all wrong now."],
aurumdeep:["A drowned underground kingdom of gold, now an explorers' camp at its edge. The <b>Mad Magician</b> who sank it is still performing.","Aurumdeep was the richest kingdom on any map, until a single show-night sank it."],
nox_dominion:["Volcanic ruinland under a dark sky, and the seat of the Demon Overlord's power. No Tyrant holds it, because the Dominion answers to someone far worse.","The heroes of past ages marched here. The ruins remember them, and so do the statues."],
calamity_steppe:["A steppe the size of a kingdom with no towns and no roads, where the monsters graze like herds. No one lives here to be besieged.","Calamities are born here and wander out. The guild charts their trails like rivers."],
the_maw:["A pit that breathes. The Hive Mother's world event begins here, and so does the swarm.","The Maw opened after the Sundering, and the land around it has been sinking ever since."],
root_of_the_world:["The deepest place there is: roots of light and stone that hold the world above. Only the strongest monsters live this close to where the world was made.","Legends call it the place the gods knelt down to weave."],
vesper:["The red moon. After the war it opens for those strong enough to reach it.","Nobody on the surface remembers the moon being red before. Everyone remembers it red now."],
};

whisperwood:{ep:"The Wood Where Every Map Begins",
ov:"Whisperwood is the first wild place most newcomers to Aetheria ever enter, and the first place most of them run out of. It is a broad, old-growth forest of oak, ash and hornbeam that swallows the southern cart-roads between Brindlewick and Millbrook, and it has been the guild's training ground for as long as there has been a guild. Its monsters are small, its paths are forgiving and its ruins are shallow, which is exactly why rookies grow careless in it. Right now the wood is besieged: the Hollowpine goblins have united under a chief who plans, and the two villages that live off the forest have learned to bolt their doors at dusk.",
geo:"The forest sits in a shallow bowl of land drained by dozens of brooks that feed the Millbrook stream. The ground is soft loam over limestone, which makes for sinkholes, little caves and springs that appear after rain and vanish by the next week. Toward the centre the canopy closes completely and the light turns green; the locals call this the Hush, because birdsong stops there. Moss-covered ruins of old waystations dot the old roads, built in a grey stone that does not occur anywhere in the wood.",
eco:"Whisperwood is a nursery ecosystem. Slimes graze the fallen leaves and are eaten by horned rabbits, which are eaten by forest wolves, which avoid the goblins, who eat everything. Mana Motes drift thickly in the Hush and feed the glowcaps that light the forest floor at night. The goblins of Hollowpine farm mushrooms in the sinkhole caves and trap wolves for their pelts; when the wolves grow scarce, they come for the villages' sheep instead, and then for the villages.",
ppl:"Brindlewick folk are woodcutters, charcoal burners, beekeepers and innkeepers; they are practical, nosy and generous, and they have grown used to strangers who arrive confused and in odd clothes. Millbrook is a mill town of millers, weavers and a handful of retired adventurers who chose a quiet stream to grow old beside. The Hollowpine goblins are not one people but six clans with their own marks, feuds and recipes; most of them want full bellies and dry caves, and only some of them want war.",
pow:"No lord sits in Whisperwood. The villages answer nominally to the crown of Aldmere but are run by a reeve in Brindlewick and the miller's council in Millbrook. The guild's branch office in Brindlewick holds more practical power than either, because it posts the bounties that keep the roads open. The economy is timber, honey, flour and, increasingly, rookies: the inns, smiths and outfitters of Brindlewick live off the steady stream of new adventurers.",
faith:"Wayside shrines to the seven day-gods stand at the forest's edges, and Sylvasday is a half-holiday when no one cuts green wood. Villagers leave bread on the steps of the old waystations for travellers who never came home, a custom older than anyone can explain. Rookies are expected to carve their names somewhere in Brindlewick before they leave; most carve them into the beams of the Sleeping Griffon's loft.",
hist:["The Hollowpine clans have stopped raiding as rabble. Under Grukk they strike in coordinated waves one or two days a week, never two days running, and they retreat before the guild can respond.","A generation ago the wood was cleared of a goblin warband by a party of four rookies who later became famous. The villages built them a monument, and Grukk's father died in that clearing.","In their grandparents' time the waystations still had keepers, and the south road was the main road to the coast. A plague year emptied them, and the road shifted east and never came back.","The grey stone of the waystations matches the stone of the Great Labyrinth. Some scholars think the old roads once ran to its gates; most scholars think that is a story told to rookies."],
ty:"Grukk, Goblin Chief of Hollowpine, is not the biggest goblin in the wood, but he is the first in a long time who can count. He has united the six clans by sharing food fairly and punishing theft, and he raids the villages because their granaries could feed his people through winter. His camp lies among the deepest ruins in the Hush. Killing him lifts the siege on Brindlewick and Millbrook and is the trial that turns an F-rank adventurer into an E-rank one. Not every goblin in the wood will forgive whoever does it.",
set:[["Brindlewick","A timber village where most adventurers wake up for the first time in Aetheria, home of the guild branch and the Sleeping Griffon inn."],["Millbrook","A mill town on the Millbrook stream with a working waterwheel, a cheese cellar and a stubborn council of millers."]],
lm:[["The Hush","The silent green heart of the forest, where the canopy closes and the Mana Motes drift like snow."],["The Rookie Stones","A ring of standing stones where the guild holds its first field tests; every stone is scratched with tally marks."],["Hollowpine Camp","The goblin stronghold, built into a ruined waystation with a cave behind it that is deeper than it should be."]],
hk:["A Millbrook miller swears the waterwheel turns backwards on nights when the goblins raid.","The guild wants a map of the sinkhole caves before the next spring rains open new ones.","A goblin child keeps leaving carved wooden wolves on the Sleeping Griffon's doorstep."],
sen:"Woodsmoke and wet leaves; the creak of the mill; honey on black bread; goblin drums, very far away."},

aldmere:{ep:"The Crown Valley",
ov:"Aldmere is the kingdom at the centre of every map of Aetheria and the realm most newcomers think of as home. Its royal city stands on a hill above a broad valley of wheatfields, orchards and wet woodland, and its roads run out to every corner of the continent. It is the safest large region in the world in daylight. At night it is not: the barrows of Greyhollow have opened, and the dead walk out of them under a banner that was struck from the kingdom's rolls long ago.",
geo:"The valley is wide, fertile and crossed by slow rivers that flood each spring and leave rich silt behind. To the west the farmland breaks into wet woods and fens that run toward Greymoor; to the east it rises into the gentle hills where the old barrows stand. The capital sits on a granite hill that the river curves around on three sides, and its walls have never been breached. Ruins of older Aldmeres lie under the fields, and ploughs turn up coins, armour and bones every year.",
eco:"Aldmere's wilds are tame by the standards of the world, which is why the kingdom grew rich. Deer, boar and flocks of fat pheasant fill the woods; wolves are rare and goblins rarer. The danger is old death: barrow-wights, skeletal soldiers and restless knights rise where the valley's many battles were fought. The fens to the west breed giant frogs and will-o-wisps, and farmers use smoke and salt lines to keep both out of the fields.",
ppl:"Aldmerians are farmers, artisans, clerks and soldiers, proud of their crown and grumbling about its taxes. The capital is a crowded mix of every people on the continent: dwarven smiths, elven envoys, beastfolk caravaneers and Veilborn adventurers who were summoned here and never left. In the countryside families measure their worth in generations on the same land, and they are polite to strangers but slow to trust them.",
pow:"The crown rules through a council of noble houses, the Church and the guild, and the three rarely agree. Succession passes to the eldest child of the reigning monarch, confirmed by the Church. The great houses quarrel over the river tolls, the Church over the summoning of heroes, and the guild over who pays for the roads. Wheat, wool, river trade and the business of adventuring keep Aldmere rich, and the capital's banks lend to half the kingdoms of the world.",
faith:"The Church is strongest here. Its great cathedral holds statues of the past Heroes, and the people are taught to honour all seven day-gods with Solenday as the holy day of rest. One plinth in the Hall of Heroes stands empty, with only a pair of stone boots left on it; the guides do not like questions about it. Harvest-end is the year's great festival, when every village burns a straw knight to keep the dead in their barrows.",
hist:["The dead of Greyhollow march every week. Ashgrave's host has not yet reached the capital's walls, but the outer farms of the Royal Valley are emptying, and Ashby keeps its gates shut by day.","Within living memory the kingdom fought a war on its eastern border and won it at a terrible price. The veterans are old men now, and many of the dead in the barrows wear the same colours they did.","In their grandparents' time a Hero sealed the Demon Overlord with a lantern of his own soul, and Aldmere's bells rang for a week. The lantern-lighting festival is still held every year on that date.","The capital is the fourth city built on its hill. The first was older than the Church, and its foundations run into tunnels no one has fully mapped."],
ty:"Ashgrave, the Oathless Baron, was once a knight of Aldmere who swore to hold Greyhollow to the last man, then fled when the last man was all that was left. The Church struck his name from the rolls, and the barrows took him in. Now he leads the dead who kept the oath he broke, and he wants the one thing they cannot give him: to be remembered as faithful. He fights at C+ rank and is far above what a new adventurer can face; the kingdom hopes someone will be ready before the barrows empty.",
set:[["Ashby","A walled market town at the edge of the barrow-hills, first to see the dead each week."],["Greyhollow Village","A farming village built among the barrows, half abandoned and half too stubborn to leave."],["Royal Valley farms","The crown's richest farmland, a scattered patchwork of manors, mills and orchards along the river."]],
lm:[["The Hall of Heroes","The cathedral nave where the statues of past Heroes stand, and one does not."],["Greyhollow Barrows","Grassy mounds on the eastern hills; the doors that were sealed with silver are open now."],["The King's Ford","Where the river is shallow enough to cross on foot, and where every war with Aldmere has been decided."]],
hk:["A farmer has ploughed up a seal that matches the one on Ashgrave's barrow, and the dead have started coming to his farm specifically.","The capital's banks want a courier to carry gold to Ashby through the night.","An old veteran insists that one of the dead soldiers is his brother, and wants him brought home."],
sen:"Bells at dawn; fresh bread and wet stone; banners snapping on the walls; silence over the barrow-hills at dusk."},

greymoor:{ep:"The Silent Fen",
ov:"Greymoor is a fen country west of Aldmere, a sprawl of black water, reed beds and drowned woodland under a fog that rarely lifts before noon. Its people live on stilts, trade from flat-bottomed punts and buy their medicines from a market hut that walks. It is a strange, close-knit land that keeps its secrets, and the fog keeps them better. Lately the fog has become quieter than it should be, because wherever the Hollow Abbot's choir passes, every sound dies.",
geo:"The moor is the flood basin of three rivers that fail to agree on where they meet. The ground is peat floating on water, and the safe paths shift with the seasons; only the punt-guides know them. Drowned forests of black alder stand in the deeper meres, and the remains of a great abbey lie half sunk in the centre, its bell tower leaning out of the bog like a broken mast. The western edge rises into the Witchwood, a tangle of thorn and yew where the swamp witches live.",
eco:"The fen is rich in food for anyone who knows where to look: eels, frogs, wildfowl, cranberries and bog-iron. It is also rich in things that eat travellers. Bog hags, leech swarms, giant herons and drowned dead rise from the mires, and the peat preserves anything that falls in, which means the dead of Greymoor are unusually well kept. Will-o-wisps are not monsters here but a kind of lantern-moth that the locals farm in jars.",
ppl:"Greymoorers are small, wiry, patient people who speak softly out of long habit; voices carry over water. They are eel-fishers, peat-cutters, reed-weavers and herbalists, and the witches of the Witchwood are both their healers and their judges. Outsiders find them rude; they find outsiders loud. They are fiercely loyal to each other and to the Walking Hut, whose trader has sold them medicine and news for longer than anyone has been alive.",
pow:"Greymoor has no lord. Each stilt-village is run by a moot of elders, and disputes go to the witches, whose word is law because nobody wants to find out what happens if it is not. Aldmere claims the fen on paper and has never collected a tax from it. Trade flows out as eels, reeds, peat and witch-medicine, and flows in as salt, iron and cloth. The Walking Hut is the closest thing the fen has to a capital.",
faith:"Greymoorers keep the feast days of the sunken abbey, though no monk has lived there in a lifetime. They ring hand-bells at dusk to tell the dead which way is home, and they never whistle on the water. Every house keeps a lantern-moth jar burning through the night. On Morrowsday no one cuts peat, because the bog is said to give back what it takes on that day.",
hist:["The Hollow Abbot's choir walks the reeds and the bells have stopped. Villages that once rang at dusk now sit silent, and those who go out into the fog after a lost sound do not return.","Within living memory the last monks of the abbey were seen rowing out to the bell tower one night with every bell they owned. The bells were never heard again, and neither were the monks.","In their grandparents' time the abbey stood on dry ground, at the end of a causeway. One wet spring the causeway sank, then the cloister, then the church, over a single month.","The witches say the fen was once a lake of clear water, and the abbey was built to hold down something that lived in it."],
ty:"The Hollow Abbot was the last abbot of Greymoor, and his Choir of Silence is made of his monks. They walk the reeds in a slow procession, singing a hymn that cannot be heard, and every sound within reach of it dies: bells, birds, voices and the heartbeats of anyone who stays too long. The abbot wants silence because something in the bog stirs at noise, and he has decided that the only way to keep it asleep is to silence the whole fen. He is right about the thing in the bog and wrong about everything else.",
set:[["Greymoor stilt-village","The largest of the fen's villages, built on ironwood stilts around the Crooked Lantern inn."],["The Walking Hut market","A trader's hut on great bird legs that walks a slow circuit of the fen; where it stops, there is a market."]],
lm:[["The Leaning Tower","The abbey bell tower, sinking a hand's width each year."],["The Witchwood","A thorn forest on the fen's western rim, where the witches meet on the darkest night of each month."],["The Peat Library","A cave where the bog has preserved a monastery's books, readable if you dry them carefully."]],
hk:["A girl wants her brother's voice back; the choir passed his punt and took it.","The witches want a bell, any bell, carried to the Leaning Tower and rung at noon.","The Walking Hut has stopped walking, and no one knows how to ask it why."],
sen:"Fog that tastes of iron; eel smoke; the drip of water from reeds; a silence so complete it hums."},

labyrinth_upper:{ep:"The Proving Halls",
ov:"The Great Labyrinth is a dungeon of a hundred and twenty floors beneath the heart of the continent, and its first forty floors are where every serious adventurer earns their rank. The guild regulates the entrance, sells the maps and runs the rescue teams. The halls reset after they are cleared, so the loot returns and the monsters return with it. It is the most profitable hole in the world and the most crowded, and the guild says it is safe in the way a forge is safe.",
geo:"The upper floors are built of the same grey stone as Whisperwood's waystations: corridors, vaults, flooded galleries and stairways that do not always connect to the floors the maps say they do. Every tenth floor is a guardian floor with a single great chamber. Safe towns have grown up on floor thirty, where a natural cavern holds clean water, and on floor forty, where something stranger keeps the monsters away. The Labyrinth's layout shifts slightly after each reset, enough to keep mapmakers in business.",
eco:"The Labyrinth breeds its own monsters from dungeon cores, and they are not animals in any ordinary sense: they do not eat, breed or age, and they respawn where they fall. Real creatures have moved in anyway. Rats, cave bats, slimes and fungus have colonised the upper floors, feeding on the waste of thousands of adventurers, and a few families of dungeon-born kobolds run a thriving salvage trade in lost gear.",
ppl:"The Labyrinth's people are adventurers, porters, map-sellers, healers, cooks and the dwarven brewers of floor thirty. Parties form and break at the guild board in the entrance hall, and the culture is part sport, part trade and part religion. Rookies are hazed, veterans are worshipped and anyone who comes back from floor forty with a full party is bought drinks for a week.",
pow:"The guild controls the entrance and licenses every party by rank. The safe towns are run by whoever runs their taverns, and the dwarf who keeps the bar on floor thirty has more authority than most barons. The economy is loot, mana crystals, monster parts and the services sold to the people who collect them. Prices triple every ten floors down, and nobody complains, because the alternative is going back up.",
faith:"Adventurers pray to Vex before every descent, and the luckiest coin in a party's purse is never spent. A chalk mark at a stairway means someone made it down safely; a crossed mark means they did not. On floor forty the ghost market holds a wake every night for the people who died below it, and newcomers are expected to attend one before they go deeper.",
hist:["The guild has posted record numbers of rookies to the upper floors this year, and the rescue teams are stretched thin. Something has been killing parties on floor thirty-nine that does not appear on any bestiary.","Within living memory the guild built the entrance hall and closed the old side-doors. Some of those doors still open from below.","In their grandparents' time the Labyrinth reset only once a year, and there was a festival when it did. Now it resets every week.","The earliest guild ledgers already call the Labyrinth old. No one knows who built it, and those who say they know tend to be selling something."],
ty:"The upper Labyrinth has no Tyrant and no siege; it is a dungeon band, not a region with settlements. Its guardians are the floor bosses that stand on every tenth floor, and they come back after every reset. Rumour in the safe towns speaks of a Maze King who moves the walls, but the guild does not post bounties on rumours.",
set:[],
lm:[["The Entrance Hall","The guild's great hall over the first stair, with the rank board and the rescue bell."],["Floor 30 safe town","A cavern town of tents and taverns around a clean spring, home of the Deep Pint."],["Floor 40 ghost market","A night market run by the dead, where prices are paid in stories and the only living guest is you."]],
hk:["A rescue team went down for a party on floor thirty-nine and did not come back up.","A kobold salvager is selling a map of a floor that does not exist.","The ghost hostess on floor forty wants someone to deliver a letter to the surface."],
sen:"Lamp oil and old stone; the echo of distant fights; dwarf ale on floor thirty; the hush of the ghost market."},

labyrinth_deep:{ep:"The Drowned Floors",
ov:"Below floor forty the Great Labyrinth stops pretending to be a building. Floors forty-one to ninety are entire landscapes underground: drowned cities, forests that grow downward, deserts lit by false suns and libraries that go on for days. Only B-rank adventurers and above are licensed to enter, and the guild keeps a separate board for them. The loot is the best in the world. So are the deaths.",
geo:"Each floor in the deep band is a biome of its own, connected by stairs, shafts, waterfalls or doors that appear only at certain hours. The ceilings rise out of sight, and some floors have weather. A sunken city fills floors fifty-five to fifty-eight, its streets flooded to the second storey. An inverted forest hangs from the ceiling of floor sixty-six, its roots in stone and its canopy in open air.",
eco:"The deep floors are where the Labyrinth's cores are strongest, and the monsters they produce are elaborate: golems, chimeras, elementals and things that resemble animals from no surface land. Real life is rarer but stranger. Blind fish swim the drowned streets, and the inverted forest has its own birds that fly upside down. Parties trade with a reclusive people of deep gnomes who live in the walls and will not say how they got there.",
ppl:"There are no towns here, only camps. Raid councils of several parties form to tackle the deeper floors together, and they keep their own laws about loot, rescue and debt. The deep gnomes are wary but honest traders. A small community of adventurers who have stayed too long below lives in the sunken city and refuses to go back to the surface.",
pow:"The raid councils are the only government, and their agreements are recorded at the guild and enforced by reputation. Breaking a council oath is the fastest way to lose your licence. The deep gnomes trade mana crystals and maps for surface food and news, and they never haggle.",
faith:"Deep adventurers stop praying to Vex below floor sixty and start praying to whoever is listening. Every raid council carries a lantern, and if the lantern goes out the raid turns back, whatever the loot. It is a superstition that has saved more lives than any spell.",
hist:["A raid council reached floor ninety this season for the first time in eleven years. Only half of it came back, and they will not talk about what they found at the stair.","Within living memory a party mapped the sunken city fully, and the city changed its streets the next week.","In their grandparents' time no one went below floor sixty and returned. The first who did came back older than they should have been.","The deep gnomes say the floors were once a single world, folded up and stored here for safekeeping."],
ty:"The deep band has no Tyrant and no siege; it is a dungeon band. Its floor guardians on every tenth floor are among the strongest monsters a B- to S-rank party can face, and several are unique.",
set:[],
lm:[["The Sunken City","Four floors of flooded streets and towers, lit by phosphorescent algae."],["The Inverted Forest","Floor sixty-six, where the trees grow downward and the sky is underfoot."],["The Gnome Walls","Hidden doors on several floors that lead into the deep gnomes' tunnels, if they let you in."]],
hk:["A deep gnome asks for help finding a door that has disappeared from its own wall.","The survivors of the floor-ninety raid want someone to go back for the lantern they left behind.","A scholar wants a book from the upside-down library on floor seventy-two, read in the right direction."],
sen:"Cold damp air; the drip of the sunken city; the smell of mana like struck flint; lantern light swinging on wet stone."},

labyrinth_abyss:{ep:"The Last Thirty Floors",
ov:"Floors ninety-one to one hundred and twenty are the Abyss of the Great Labyrinth, a place few adventurers have reached and fewer have described. Monsters here carry ranks beyond what a guild card can display. Light bends, memory slips and distances lie. The guild does not sell maps of the Abyss; it sells condolences.",
geo:"The Abyss floors are less built than imagined. Some are vast dark plains with a single stair in the distance; some are rooms that contain other rooms; some are memories of places on the surface, wrong in small ways. The lowest floors grow steadily quieter, and the walls seem threaded with faint lines of light, like the warp of a loom.",
eco:"Nothing living is native to the Abyss. Its monsters are the purest expression of the Labyrinth's cores, and they behave more like weather than animals. Adventurers report that the threads in the walls pulse when monsters respawn, as if the floors were stitching them.",
ppl:"No one lives here. A few SS- and SSS-rank adventurers have made camps on the guardian floors, and they speak about the deep floors in a quiet, careful way, like sailors talking about the open sea.",
pow:"There is no authority below floor ninety except the strength to come back.",
faith:"Those who return from the Abyss often take up odd devotions: lighting a candle every evening, refusing to sleep without a thread tied around one wrist, or speaking of the Weave as if it were a living thing.",
hist:["No party has cleared floor one hundred and twenty in recorded history. Several have reached its door.","Within living memory a famous adventurer reached floor one hundred and ten and came back unable to remember her own name.","In their grandparents' time the Abyss was a story, not a place on the guild's charts.","Legend says the hundred-and-twentieth floor is where the world was sewn together, and where one knot was never tied."],
ty:"The Abyss has no Tyrant and no siege; it is a dungeon band. Its guardians are among the greatest monsters in the world, and the guild has stopped naming them, because names do not seem to stay attached.",
set:[],
lm:[["The Threaded Walls","Floors where faint lines of light run through the stone like warp threads."],["The Door at One-Twenty","A door no one has opened, at the bottom of the last stair."],["The Rememberer's Camp","A camp on floor one hundred where the strongest adventurers rest and compare what they have forgotten."]],
hk:["An adventurer who came back from floor one hundred and ten is looking for anyone who knew her before.","The threads in the walls have started pulsing in a pattern, and a scholar thinks it is a message.","Someone has carved a name beside the Door at One-Twenty, and it was not there last season."],
sen:"Absolute quiet; a faint hum like a spinning wheel; light that arrives late; the taste of copper in the air."},

sylvaran:{ep:"The Canopy Kingdom",
ov:"Sylvaran is the forest realm of the elves, a land of trees so tall that whole cities hang in their branches. Canopy City Lothaniel is its crown, a city of bridges, halls and gardens high above a forest floor that most elves rarely visit. The kingdom is beautiful, ancient, proud and very slow to admit it needs help. It needs help now: a blight is spreading through the roots, softening bark and minds alike, and it has a name.",
geo:"Sylvaran is a vast temperate rainforest of giant trees, some of them older than any kingdom on the map. The forest floor is dim, damp and spongy, crossed by clear streams and dotted with moonwells, pools of water that glow faintly at night. The canopy cities sit two hundred feet up, joined by living bridges grown over centuries. At the centre of the realm stands the World Tree, whose crown can be seen from three regions away.",
eco:"The forest is a layered world. The canopy is home to birds, tree-lynx, gliding squirrels and the elves; the middle storey to dryads and owlbears; the floor to fungi, giant beetles and the mushroom-folk. Fungus breaks down the forest's fallen wood and feeds everything else, which is what makes the blight so dangerous: the Spore Lord has turned the fungus itself against the trees.",
ppl:"The elves of Sylvaran are not one people. Court elves of Lothaniel are formal, long-lived and status-conscious; the moonwell hamlets below are home to wood elves who farm, hunt and find the court absurd. Humans, half-elves, gnomes and beastfolk live in the trade quarters, and the court charges them twice as much for everything until they earn its respect. Young elves are increasingly impatient with the old ways.",
pow:"The realm is ruled by a hereditary queen and a council of elder houses whose members can be centuries old. Court politics are slow and ruthless, conducted through favours, marriages and very long memories. The economy runs on living wood, moonwell water, herbs and the finest bows in the world, and the court controls all four.",
faith:"Elves honour the day-gods but revere the World Tree above them, and Sylvasday is the realm's holy day. Moonwells are sacred and may not be drunk from without permission. Every elven child plants a seed when they are named, and the tree that grows from it is their twin for life.",
hist:["The Spore Lord's blight is spreading from the forest floor upward, and three moonwell hamlets have been abandoned. The court debates whether to cut the infected trees, and the trees it would cut are people's twins.","Within living memory the court closed its borders to humans for twenty years after a dispute over a stolen seed. The trade quarters still bear the scars of that time.","In their grandparents' time the elves fought the dwarves of Iron Hold over a river of timber, and the peace treaty is still read aloud each year.","The elves remember planting these trees. The trees remember something older that grew there first."],
ty:"Mycelia, the Spore Lord, is a vast fungal intelligence that has spread through the root network beneath Sylvaran. It does not hate the elves; it wants to grow, and it has learned that minds are fertile ground. Its spores soften the bark of the great trees and soften the will of those who breathe them, until they wander down to the forest floor to tend it. Its body is everywhere; its heart is in a cave of mushrooms beneath the World Tree's roots.",
set:[["Canopy City Lothaniel","The court city high in the canopy, a maze of halls and bridges grown from living wood, home of Leafhall Rest."],["Moonwell hamlets","Wood-elf villages on the forest floor, built around glowing pools, now the first in the blight's path."]],
lm:[["The World Tree","A tree so large it has its own weather; its roots reach places the elves will not discuss."],["The Twin Groves","Groves of trees planted by elven children, each one bound to a living elf."],["The Grey Hollow","The heart of the blight, a cave of luminous fungus beneath the forest floor."]],
hk:["A young elf's twin tree is infected, and he has started sleepwalking toward the forest floor.","The court wants a human envoy to negotiate with the dwarves for fire, and none of them wants to be seen asking.","A moonwell has turned from silver to grey, and someone has to find out why before anyone drinks."],
sen:"Green light through a hundred feet of leaves; the creak of living bridges; damp earth and sweet resin; a faint, sweet smell of rot."}
});
Object.assign(GZL,{
mossdeep:{ep:"The Land of Small Things",
ov:"Mossdeep is a forest where everything is too big except the people. Ferns grow as tall as houses, mushrooms as wide as wagons and beetles as big as ponies, and the Thimblefolk live among them at the height of a traveller's knee. Visitors drink a shrinking draught at the door of the town's inn and see the world from below. It is charming, cosy and full of small heroism, and it is under attack by something with eight legs.",
geo:"Mossdeep lies in a sheltered valley where warm springs keep the air damp all year. The ground is a thick carpet of moss over rich black soil, and the canopy is mostly giant fern and toadstool rather than trees. Streams that a person could step over are rivers to the Thimblefolk, crossed by bridges of woven grass. A single enormous oak, the Old Shade, stands at the valley's head and blocks the cold north wind.",
eco:"Mossdeep's giants are mostly gentle. Beetles graze the mushrooms, snails tend the moss and bees the size of sparrows make honey in hollow stems. The Thimblefolk ride beetles, keep aphid herds and trade honey for everything else. The predators are spiders, centipedes and the occasional wandering cat, which the Thimblefolk consider a natural disaster. The giant insects are the reason Mossdeep exists: the warm springs feed a mana-rich soil, and everything that eats from it grows.",
ppl:"The Thimblefolk are a small, hardy, sociable people, ingenious with tools and fond of complicated etiquette. They call everyone else the big folk and are polite to them in the way one is polite to a friendly bear. Beetle riders are their knights and heroes, and every child dreams of riding one. There is a lively debate in the town between those who think the big folk should be asked for help and those who think they would only step on things.",
pow:"Thimblefolk Mushroom Town is governed by a council of guild-heads: the honey-keepers, the beetle-riders, the moss-weavers and the brewers. The council meets in a toadstool hall and votes by dropping seeds in cups. Mossdeep's honey, silks and tiny, perfect tools are traded to the big folk at the valley mouth, and Mossdeep honey sells for a fortune in Aldmere.",
faith:"The Thimblefolk keep a festival for each day-god and several for gods of their own, including the Giant who once shared their bread. On the first warm day of spring, they put out a thimble of milk at the foot of the Old Shade. Every house has a pressed-flower calendar, and a family's luck depends on keeping it accurate.",
hist:["Mother Webcrawler's brood has spread through the ferns, and the beetle riders have lost half their mounts. The town has built thorn walls for the first time in its history.","Within living memory a big-folk adventurer spent a summer in Mossdeep and taught the Thimblefolk to forge. They still talk about her as if she might come back.","In their grandparents' time the spiders were small and the beetle-riders hunted them for silk.","Thimblefolk tell of a giant who once shared their bread and kept the spiders off. They still set out a thimble of milk for him."],
ty:"Mother Webcrawler, Terror of the Small, is a spider grown huge on the valley's mana-rich soil. She webs the high ferns into a canopy of silk and drops her children on anything that moves beneath it. She is not cruel in any human sense; she is a mother with a very large family, and the Thimblefolk are the right size to feed them. Her nest is in the hollow trunk of a fallen giant fern near the springs.",
set:[["Thimblefolk Mushroom Town","A town of hollowed toadstools and grass bridges, home of the Thimble & Thistle inn."]],
lm:[["The Old Shade","A great oak at the valley head; its roots hold the town's honey stores."],["The Silk Canopy","The ferns that Mother Webcrawler has webbed over, dim and quiet."],["The Warm Springs","Steaming pools where the beetles bathe and the Thimblefolk do their laundry."]],
hk:["A beetle rider's mount has been taken alive into the Silk Canopy, and she is going after it with or without help.","The council wants a big-folk volunteer to carry a beehive to safety, very carefully.","A Thimblefolk inventor is building a war machine from a snail shell and needs parts."],
sen:"Warm wet moss; honey in the air; the drone of bees as loud as a mill; the rustle of something large in the ferns."},

lirian:{ep:"The Lantern Canals",
ov:"Lirian is a coastal republic of canal cities, built on islands in a lagoon and joined by bridges, gondolas and lantern-lit waterways. It is rich, artistic and cheerfully corrupt, the place where the world's merchants come to make deals and the world's artists come to spend the proceeds. In the evening songs float up from the water. Lately some of the songs have been coming from beneath it, and those who follow them do not come back.",
geo:"The lagoon is shallow, brackish and protected from the sea by a long sandbar with three gaps that the city controls. The cities stand on thousands of oak piles driven into the mud, and the canals between them rise and fall with the tide. Beneath the modern city lies an older Lirian, drowned when the sea rose long ago, and on clear calm nights its rooftops can be seen from the boats.",
eco:"The lagoon teems with fish, shellfish and seabirds, and the canals with rats, cats and gulls. Merrows, crabs and sea-eels hunt the outer channels. The drowned city has become a reef, colonised by coral, octopus and stranger things, and it is from there that the Drowned Choir sings.",
ppl:"Lirians are merchants, gondoliers, glassblowers, bankers, painters and spies, and many are several of those at once. They love masks, music and gossip, and they judge one another by wit rather than birth. A large population of sea-elves and merfolk lives in the outer lagoon and trades with the city through water-gates.",
pow:"Lirian is a republic ruled by a doge elected for life by a council of merchant houses. Elections are expensive and occasionally fatal. The city's wealth comes from trade, glass, banking and the tolls on the sandbar gaps; its fleet is small but very fast.",
faith:"Lirians keep the day-gods with gusto and the sea with caution. Every gondola carries a lantern, and on Maelsday the whole city lights its lanterns at once. A coin is thrown into the canal for every deal made, which keeps the city's divers rich.",
hist:["The Drowned Choir's song is heard every week now, and people walk into the canals smiling. The city has banned singing after dusk, which has not helped.","Within living memory a doge tried to drain part of the lagoon to build a new district, and the sea took it back in a single storm.","In their grandparents' time Lirian fought a long trade war with Goldmere's pirates, and its old lantern-galleys still hang in the arsenal.","Lirian was built over a flooded older Lirian. On quiet nights you can see its rooftops under the boats."],
ty:"The Drowned Choir is a chorus of sirens who nest in the drowned city's bell towers. Their song is a lure and a hunger: those who hear it long enough want to go down to the old city and join it. The sirens claim the drowned city as theirs and the living city as their larder. They are led by a voice that no one has seen, and the lantern-galleys of the old war were built to fight them.",
set:[["Lirian canal cities","A cluster of island cities joined by bridges and canals, with the doge's palace at their centre."]],
lm:[["The Doge's Palace","A palace of pink marble on the main canal, half government and half theatre."],["The Drowned Belltowers","The towers of old Lirian, rising almost to the surface at low tide."],["The Glass Isle","An island of furnaces where the city's famous glass is blown."]],
hk:["A famous singer has lost her voice, and she thinks the Drowned Choir took it.","The doge wants an outsider to escort a sealed chest past the sandbar at night.","A gondolier has started sleepwalking to the edge of the canal, humming."],
sen:"Salt and lamp oil; bells over water; fried fish and sugared almonds; a song you cannot quite hear."},

fanghold:{ep:"The Wind-Plains",
ov:"Fanghold is the open steppe north-west of Aldmere, a sea of grass under an enormous sky. Its people are herders, horse-riders and wolfkin clans who follow the herds from pasture to pasture. One stone fortress guards the only reliable well for a week's ride in any direction, and whoever holds it holds the steppe. Right now a slaver holds it, and his ledger is longer than his whip.",
geo:"The steppe is a high, dry plateau of grass and wildflowers, cut by shallow river valleys that flood in spring and dry to cracked mud in summer. The wind never stops. The fortress of Fanghold sits on a rock outcrop above the Deep Well, a spring that has never failed. Ancient stone markers carved with animal faces stand at the old meeting places of the clans.",
eco:"The steppe feeds vast herds of wild horses, saiga and woolly cattle, and the predators that follow them: wolves, steppe lions, giant eagles and dire boars. Stampedes are a natural disaster as dangerous as any storm. The clans move with the herds and take only what they need, and the ground repays them with grass that comes back every spring.",
ppl:"The clans of Fanghold are wolfkin, humans and half-orcs, organised into families that trace their descent through their grandmothers. They are hospitable to strangers, ferocious to enemies and suspicious of anyone who lives in one place. Their yurts are warm, crowded and full of children, and every guest is fed before they are asked their name.",
pow:"The clans form a loose federation that meets once a year at the stone markers. Each clan is led by its eldest woman, and disputes are settled by contests of horsemanship or arm-wrestling. Wool, horses, felt and leather flow out to the cities; salt, iron and tea flow in. The water-peace, a sworn oath that no clan may deny water to another, has held for three generations.",
faith:"The clans honour the day-gods and the wind, which they believe carries the voices of their ancestors. They leave the first cup of milk of each day to the wind, and they never build a wall that blocks it. Eagles are sacred and may not be hunted.",
hist:["Varrick Kade has seized the fortress and the Deep Well, and he trades water for people. The clans that cannot pay lose their children to his chains.","Within living memory a great drought killed half the herds, and the clans survived only because the water-peace held.","In their grandparents' time the clans swore the water-peace at the stone markers after a feud over the Deep Well that killed hundreds.","The stone markers were raised by the first clans, who are said to have been wolves who learned to stand."],
ty:"Varrick Kade, the Slaver Lord, is a human mercenary captain who came to the steppe to sell weapons and stayed to sell people. He took Fanghold's fortress by bribing its guards and now holds the Deep Well hostage. He pays his mercenaries well, keeps meticulous accounts and believes that everything, including a person, has a price. He is the first man to break the water-peace and live.",
set:[["Fanghold","The stone fortress above the Deep Well, and the market town around it, home of the Howling Hearth inn."],["Nomad yurt camps","Moving camps of felt yurts that follow the herds across the steppe."]],
lm:[["The Deep Well","A spring in the rock beneath the fortress that has never run dry."],["The Wolf Stones","Carved stone markers where the clans meet each year."],["The Long Run","A valley where the wild horses stampede every spring, and young riders prove themselves."]],
hk:["A clan grandmother wants her grandchildren back from Kade's ledger, and she has a plan.","A wild horse herd has started stampeding toward the fortress every night, and no one knows what drives them.","Kade's bookkeeper wants out, and she is willing to trade the ledger for safe passage."],
sen:"Endless wind; horse sweat and wild thyme; drumming hooves; fermented milk around a dung fire."},

iron_hold:{ep:"The Forge Under the Mountains",
ov:"Iron Hold is the mountain realm of the dwarves, a range of black peaks with fire in their veins. Its great hold, Karak Dûn, is a city carved into the mountain's heart, lit by forges that have not gone cold in a thousand years. The dwarves mine the Ashen seams below for iron, mithril and fire-crystal, and they forge the finest steel in the world. A fire giant has come for the forges, and he has brought an army.",
geo:"The range is volcanic: black basalt peaks, steaming vents, lava tubes and hot springs. The dwarves have tunnelled through all of it, and the mountains are honeycombed with halls, shafts and roads. The Ashen Mines lie to the east, where the rock is richest and the heat is worst. The deepest shaft was sealed long ago, and its seal is warm to the touch.",
eco:"Little grows on the mountains except lichen, thornbush and hardy goats. Beneath them, cave fish, blind beetles and mushrooms feed on the warmth. Fire salamanders, magma slimes and rock wyrms live in the lava tubes, and the dwarves hunt them for their hides and hearts. Fire giants and their orc servants have come down from the volcanic north, drawn by the forges' heat.",
ppl:"The dwarves of Iron Hold are miners, smiths, engineers and brewers, organised into clans by craft. They are proud, stubborn, loyal and funny in a dry way that outsiders often miss. Human, gnome and orc labourers work the outer mines for wages, and some have lived there for generations. A small, quarrelsome community of rune-smiths keeps the old secrets of enchanted steel.",
pow:"Karak Dûn is ruled by a High Thane elected from the clan heads, and the clans govern their own halls. Laws are carved in stone and changed only with great difficulty. The economy is iron, steel, weapons, armour and fire-crystal, sold to every kingdom in the world. Iron Hold's steel has armed both sides of most of the world's wars.",
faith:"Dwarves honour Thor above the other day-gods, and Thorsday is the day of the great forging. Every smith keeps a hearth-stone from their first forge, and losing it is a terrible omen. Drinking contests are a sacred tradition, and the record holder is three hundred years old.",
hist:["Skarn's army has taken the Ashen Mines and is besieging the outer gates. The dwarves are holding, but their forges are short of fuel.","Within living memory the dwarves fought the elves of Sylvaran over a river of timber, and the peace treaty is still read aloud each year.","In their grandparents' time the deepest shaft was sealed after something answered the hammers from below.","The dwarves say Thor struck the first anvil in these mountains, and the sparks became the first dwarves."],
ty:"Skarn, the Fire Giant Warlord, leads an army of fire giants, orcs and salamanders from the volcanic north. He wants the forges of Karak Dûn and the furnace-heart that feeds them, a living fire that the dwarves have kept burning for a thousand years. With it he believes he can forge weapons that will let his people conquer the cold lands of the world. He is huge, clever and patient, and he respects the dwarves enough to want them as slaves rather than corpses.",
set:[["Karak Dûn","The great dwarven hold carved into the mountain's heart, entered through the Khazdûr Gate and home of the Anvil's Rest inn."],["Ashen Mines camps","Mining camps of dwarves and hired labourers in the eastern seams, now held by Skarn's army."]],
lm:[["The Furnace-Heart","A living fire at the heart of Karak Dûn that has never gone out."],["The Sealed Shaft","The deepest mine shaft, sealed with runes and warm to the touch."],["The Hall of Thanes","A great hall where the carved faces of every High Thane watch the living."]],
hk:["A rune-smith needs fire-crystal from the occupied mines to finish a weapon that could stop Skarn.","A young orc labourer wants to warn the dwarves about a plan inside Skarn's camp.","The Sealed Shaft has started knocking back."],
sen:"Hot iron and coal smoke; hammer-song echoing through stone; dark ale; the tremor of the mountain breathing."},

moraveil:{ep:"The Truce Country",
ov:"Moraveil is a gentle country of farmland, woods and caves where something unusual has happened: a goblin village and a human market town have learned to trade in peace. Goblins sell mushrooms and cave-fish at the human market, humans sell bread and iron at the goblin one, and the truce has held for a generation. It is a fragile, hopeful, stubbornly ordinary place. An orc warlord the size of a house has decided to end it.",
geo:"Rolling green hills dotted with farms and copses, over limestone riddled with caves. A river runs through the middle, and the human town is built on one bank and the goblin village in the cliffs of the other. A stone bridge joins them, and it is the most important building in Moraveil.",
eco:"The farmland is rich, the woods are full of game and the caves are full of mushrooms, cave-fish and bats. The goblins farm the caves; the humans farm the fields. Wild orcs, trolls and dire wolves come down from the northern hills in hard winters, and the truce began partly because both peoples needed each other to fight them.",
ppl:"Moraveil's humans are farmers and merchants, and its goblins are cave-farmers, fishers and craftspeople. Both peoples have their bigots and their friends. A new generation has grown up speaking both languages and finds the old prejudices tiresome. The goblin village runs an inn that welcomes humans who are polite and keep their weapons at the door.",
pow:"Each side governs itself, and a joint council meets on the bridge once a month to settle disputes. The council has no army and no money, only the trust of both peoples. Trade between the two sides is the economy, and it has made both richer than either was alone. Neighbouring human lords see the truce as dangerous; some goblin tribes see it as a betrayal.",
faith:"Humans keep the day-gods; goblins keep their own spirits of cave and fungus. Both sides celebrate Truce Day, the anniversary of the rescue that started it all, with a shared feast on the bridge.",
hist:["Grakkus the Orc Disaster has smashed two goblin villages in the hills and is marching on Moraveil. Some humans are blaming the goblins for drawing him, and some goblins are blaming the humans for making them soft.","Within living memory the truce began when a goblin child pulled a farmer's daughter out of a flooded cave. Both of them are still alive and sit on the council.","In their grandparents' time the humans and goblins of Moraveil fought a long, ugly war over the caves.","The goblins say the caves were dug by a great worm that taught them to farm mushrooms."],
ty:"Grakkus, the Orc Disaster, is an orc warlord of enormous size and strength who has never lost a fight. He hates the truce because it proves that monsters and humans can live together, and he believes that idea will destroy his people. He fights at a level far beyond most adventurers who reach Moraveil, and he is called a disaster for good reason: wherever he goes, nothing is left standing.",
set:[["Moraveil goblin village","A cliff village of caves and ladders, home of the Friendly Goblin inn."],["Moraveil market town","A busy human market town on the river, joined to the goblin village by the Truce Bridge."]],
lm:[["The Truce Bridge","A stone bridge over the river, where the joint council meets and the Truce Day feast is held."],["The Flooded Cave","Where the truce began; the goblins keep it as a shrine."],["The Northern Hills","Rough country where the wild orcs and trolls live."]],
hk:["A human merchant has been accused of poisoning goblin mushrooms, and someone wants the truce to fail.","The goblin and human council members who started the truce want help preparing both peoples for Grakkus.","A goblin warband from the hills has come to Moraveil to join Grakkus, and they need persuading."],
sen:"Bread and mushroom stew; two languages shouting over the market; river water on stone; drums from the northern hills."},

strife_marches:{ep:"The Contested Borderlands",
ov:"The Strife Marches are the borderlands between Aldmere and its eastern neighbours, a region of fields, forests and ruined castles that has changed hands more often than anyone can count. Every baron can produce a treaty proving he is the rightful lord, and every treaty contradicts the others. The people have learned to plant quickly and harvest early. Lately a new kind of trouble has come: a preacher who sings over the battlefields and makes the fighting worse.",
geo:"The marches are open plains broken by forests and low ridges, ideal country for cavalry and terrible country for anyone trying to defend a village. Ruined castles stand on every hill, and the fields are full of old earthworks. A road runs east-west through the middle, and every army in history has used it.",
eco:"War has shaped the land: forests have regrown over old battlefields, crows and wolves have grown fat, and the ground is full of iron. Wild animals have learned to avoid soldiers. The dead of many wars do not always stay buried, and the Choir of Chains has learned how to wake them.",
ppl:"Marchers are farmers, mercenaries and smugglers, tough and cynical, loyal to their families and their neighbours rather than any lord. They speak a mix of languages and switch flags without a second thought. The mercenary forts are full of sellswords from every corner of the world, some of whom have married into the local families.",
pow:"The border baronies are ruled by minor nobles who claim allegiance to whichever kingdom pays them best. Mercenary companies are the real power, and they are hired by whoever has money this season. Trade in food, iron and soldiers keeps the region alive, and smuggling keeps it prosperous.",
faith:"Marchers keep the day-gods, but they keep them quietly, because chapels are the first buildings armies burn. They bury their dead with a coin from each kingdom, so that whichever side wins, the dead can pay their way.",
hist:["Diego Alvarez, the Voice of the Choir of Chains, has gathered followers who chant over the battlefields. Wherever they sing, the fighting turns savage, the dead rise and old feuds reopen.","Within living memory a great peace was signed at Castle Varn, and it lasted eleven years before a baron's son broke it over a horse.","In their grandparents' time the marches were a kingdom of their own, briefly, until both neighbours invaded at once.","Every baron here can point to the treaty that makes him the rightful one. None of the treaties agree."],
ty:"Diego Alvarez, Voice of the Choir of Chains, is a preacher who arrived in the marches a few years ago with a beautiful voice and a terrible message: that suffering is holy, and that chains are a gift. His followers chant over the battlefields, and their song binds the living to old hatreds and the dead to new wars. He is charming, cruel and absolutely sure he is right. He cannot be reasoned with or redeemed.",
set:[["Border baronies","Small fortified towns and manors ruled by quarrelling barons."],["Mercenary forts","Timber and stone forts where the sellsword companies wait for their next contract."]],
lm:[["Castle Varn","A ruined castle where the great peace was signed, and broken."],["The Field of Coins","A battlefield where the dead were buried with coins from every kingdom."],["The East Road","The road every army has used."]],
hk:["A mercenary captain wants out of her contract before the Choir reaches her fort.","Two barons claim the same village, and the villagers want someone to decide.","A man swears his dead father has started singing in his sleep."],
sen:"Trampled wheat and old smoke; crows; marching songs in three languages; chanting carried on the wind."},

velmark:{ep:"The White Duchies",
ov:"Velmark is a cluster of wealthy duchies east of Aldmere, a land of white stone towns, tidy fields and well-paid taxes. It is orderly, prosperous and slightly smug, and its people believe hard work and good accounts solve every problem. Something under its foundations disagrees. The great stones on which the duchies were built have woken up, and they are hungry.",
geo:"Velmark is a fertile plain with a bedrock of white limestone, quarried for every town and road in the region. The towns are built of the same stone, and their foundations go deep. Old quarries pit the landscape, many flooded and turned into lakes. In the middle of the duchies stands the Foundation Stone, a single enormous block of stone that the first duke laid as the cornerstone of his realm.",
eco:"The plains are farmed intensively and the wild has been pushed back to the quarries and hedgerows. Stone golems, earth elementals and burrowing beasts have begun to emerge from the old quarries, and the farmers have taken to sleeping with their tools.",
ppl:"Velmarkers are farmers, stonemasons, clerks, bankers and lawyers, proud of their order and their ledgers. They value thrift, punctuality and good manners, and they look down on the chaotic marches and the extravagant Lirians. A growing underclass of quarry-workers and labourers lives in the shadow of the white towns.",
pow:"The duchies are ruled by dukes who inherit their titles, advised by councils of guildmasters and bankers. The dukes answer in theory to a grand duke, who is elected by the others. The economy runs on wheat, stone, banking and law; Velmark lawyers are hired across the world.",
faith:"Velmarkers keep the day-gods with sober piety and dislike displays of feeling. Every house has a tithe-box by its door, and the tithe is collected every Kaelsday. The first duke's tithe to the land, a stone offering laid at the Foundation Stone every year, was stopped generations ago to save money.",
hist:["The Tithe Colossus has risen from the foundations of the oldest duchy and is walking toward the Foundation Stone. Towns crack where it passes.","Within living memory a duke reformed the tax system and abolished all the old customary tithes, including the stone offering.","In their grandparents' time the duchies quarried so much stone that one whole town collapsed into its own cellars.","The first duke paid the land a tithe for its stones. His heirs stopped paying."],
ty:"The Tithe Colossus, Hunger of the Foundation Stones, is a giant of white stone that has risen from beneath the duchies. It was made from the land's own bedrock, and it is collecting what it was promised: stone for stone, a tithe for every block the duchies took. It does not hate the people of Velmark; it only wants what it is owed, and it does not understand that the people are not made of stone.",
set:[["Velmark ducal towns","White stone towns of markets, banks and courts, each ruled by a duke."]],
lm:[["The Foundation Stone","The great cornerstone of the realm, where the tithe was once laid."],["The Drowned Quarries","Old quarries filled with water, from which stone things have begun to climb."],["The Grand Ducal Court","A court of law whose rulings are respected across the world."]],
hk:["A clerk has found the original tithe contract, and it has a clause no one remembers.","A quarry-worker's family has been taken into the earth, and the dukes say it is not their problem.","The grand duke wants the Colossus stopped quietly, without admitting that the duchies owe anything."],
sen:"Dust of cut stone; ledger ink; church bells on the hour; the deep grinding of something moving underground."}
});
Object.assign(GZL,{
hoshizora:{ep:"The Land Under the Star-Sky",
