hk:["A young monk believes the bones are not dragon bones at all, and she wants proof before the council decides to fight.","Vyrmax has offered peace in exchange for a single bone, and the abbots want someone to find out which one he means and why.","A pilgrim has stolen a relic from the Skull, and the bone has started to grow warm in her pack."],
sen:"Sulphur and incense; lullabies sung in deep voices; the warmth of the rock underfoot; the feeling of something breathing far below."},

sky_archipelago:{ep:"The Abandoned Heights",
ov:"The Sky Archipelago is a chain of floating islands high above the north-east, where the Titans once built cities of white stone among the clouds. The Titans are gone, and their cities stand empty, their tables still set and their doors still open, as if they meant to come back. No Tyrant holds the archipelago and no one lives there to be besieged. Only the strongest adventurers reach it, and they report that the winds are not empty.",
geo:"The islands float at different heights, from just above the clouds to so high that the air is thin and cold. Each carries a piece of a Titan city: palaces, towers, amphitheatres and gardens gone wild. Bridges of white stone once linked them, and many now end in open air. The islands drift slowly on the wind, and their positions change over the years, so maps of the archipelago are always out of date.",
eco:"Cloud birds, sky whales, wind serpents and air elementals live among the islands. The Titans' gardens have run wild into forests of strange trees whose roots hang down beneath the islands. Sky pirates and scavengers who reach the islands by magic or airship hunt for Titan relics.",
ppl:"No one lives in the archipelago permanently. Scholars, scavengers and the occasional hermit camp in the ruins for a season. The Heavenfolk of nearby Heavenreach claim the islands as sacred and dislike visitors.",
pow:"No power holds the archipelago. The guild issues expedition licences, and the Heavenfolk occasionally drive expeditions away.",
faith:"Scholars argue about whether the Titans were gods, giants or something else. The Heavenfolk say the Titans were their ancestors' teachers.",
hist:["Expeditions have reported Titan machines moving on the higher islands, and a storm of unusual violence circles the highest island of all.","Within living memory an expedition reached the highest island and brought back a Titan's table knife the size of a man.","In their grandparents' time the islands were thought to be a myth.","The Titans left their tables set, as if they meant to come back."],
ty:"The Sky Archipelago has no Tyrant and no siege. The cities are abandoned, and the greatest danger that waits there is part of a larger story.",
set:[],
lm:[["The Set Tables","A Titan banquet hall where the tables are still laid for a feast."],["The Broken Bridges","White stone bridges that end in open air."],["The Highest Island","An island wrapped in a permanent storm, which no expedition has reached in years."]],
hk:["A scholar wants to know what the Titans were going to eat at the set tables.","A sky whale has become trapped in the ruins of a tower.","A Titan machine has started rebuilding a bridge."],
sen:"Thin cold air; wind through empty halls; the crunch of white stone; the sound of distant thunder from the highest island."},

heavenreach:{ep:"The Eyrie of the Heavenfolk",
ov:"Heavenreach is a range of the highest mountains in the world, home of the winged Heavenfolk, whose eyries are carved into cliffs no one else can reach. They were once the messengers of every kingdom below, and now they keep to themselves. Aquilon, the Roc Sovereign, rules the air above them and taxes the sky.",
geo:"The peaks are sheer, icy and impossibly tall, rising above the clouds. The Heavenfolk eyries are carved into the cliffs at great height, reached only by flight or by long, perilous stairs. The valleys below are green and full of rivers.",
eco:"Eagles, rocs, mountain goats and snow leopards live on the peaks. Aquilon's rocs hunt the skies and take what they want.",
ppl:"The Heavenfolk are a winged people, proud, reserved and fiercely independent. They were once messengers and scouts for every kingdom, and they remember being betrayed.",
pow:"The Heavenfolk are ruled by a council of the eldest flyers. They trade little with the world below.",
faith:"The Heavenfolk honour the day-gods and the sky, and they believe the Titans of the Sky Archipelago were their ancestors' teachers.",
hist:["Aquilon has begun taxing the sky, demanding tribute from the Heavenfolk.","Within living memory the Heavenfolk withdrew from the world below.","In their grandparents' time the Heavenfolk flew messages for every king.","The Heavenfolk once flew messages for every king below. Their oaths were broken first."],
ty:"Aquilon, the Roc Sovereign, is a giant roc who rules the skies above Heavenreach and demands tribute from all who fly.",
set:[["Heavenfolk eyries","Eyries carved into the highest cliffs."]],
lm:[["The Eyries","Homes of the Heavenfolk."],["The Tribute Peak","Where Aquilon collects his tribute."],["The Long Stair","A stair cut into the cliff for those without wings."]],
hk:["A young Heavenfolk wants to fly messages again.","Aquilon has taken a Heavenfolk child as tribute.","A ground-dweller wants to climb the Long Stair."],
sen:"Thin cold wind; the beat of great wings; ice on stone; the cry of a roc."}
});
Object.assign(GZL,{
heavenreach:{ep:"The Eyrie of the Heavenfolk",
ov:"Heavenreach is the roof of the world, a range of peaks so tall that their summits stand above the weather. The winged Heavenfolk live there in eyries carved into cliffs that no one without wings can reach. They once flew messages for every king below and were honoured for it; now they keep to themselves and look down on the world with long memories. Above them all rules Aquilon, the Roc Sovereign, who has declared the sky his kingdom and every wing in it his subject.",
geo:"The range rises in a wall of ice and grey granite from green foothill valleys to summits wrapped in permanent snow. The eyries are carved into the south-facing cliffs, where the sun warms the rock, and they are linked by flight paths marked with painted stones. A single stair, the Long Stair, climbs from the valley to the lowest eyrie for the use of wingless visitors; it has eleven thousand steps and no railing. Above the eyries the air is so thin that even the Heavenfolk struggle, and only the rocs fly there easily.",
eco:"Golden eagles, lammergeiers, mountain goats, snow leopards and pikas live on the slopes, and the valleys below are full of rivers, meadows and herds of yak. Rocs nest on the highest peaks and hunt goats, yak and, when hungry, anything with wings. Since Aquilon's rise the rocs have multiplied, and the Heavenfolk have had to fly in groups for safety.",
ppl:"The Heavenfolk are a people with broad feathered wings and light, hollow-boned bodies. They are proud, formal and slow to trust, with a culture built around flight: their children's first flight is the most important day of their lives, and a Heavenfolk who loses the ability to fly is mourned as if dead. They speak the old courier-cant of the kingdoms below, a language of short, exact sentences. Younger Heavenfolk are restless, curious about the ground and tired of their elders' grudges.",
pow:"The Heavenfolk are governed by a council of the eldest flyers, who meet in the highest eyrie that the old can still reach. They trade little with the ground: feathers, falcons, herbs and, rarely, their services as scouts. The valley folk below trade food and cloth up the Long Stair for those goods. Aquilon now demands a tithe of everything that flies, and the council has not yet decided whether to pay.",
faith:"The Heavenfolk honour the day-gods and the open sky, and they believe the Titans of the Sky Archipelago were their ancestors' teachers who gave them the gift of flight. Their dead are laid on high ledges for the birds, so they can fly one last time. Breaking a sworn message, failing to deliver what was entrusted, is their gravest sin.",
hist:["Aquilon has declared the sky above Heavenreach his kingdom and demands a tithe of every flight: food, feathers and, lately, children. The council is divided, and young flyers have begun disappearing on solo flights.","Within living memory the Heavenfolk withdrew from the world below after a king had a messenger executed for the contents of a letter she carried. They have not flown a message for a crown since.","In their grandparents' time the Heavenfolk carried messages for every kingdom, and a Heavenfolk messenger's seal was respected in every court.","The Heavenfolk once flew messages for every king below. Their oaths were broken first."],
ty:"Aquilon, the Roc Sovereign, is a roc of enormous size with feathers like beaten bronze. He has gathered the rocs of the high peaks into a flock that obeys him, and he has declared that everything that flies owes him tribute. He considers the Heavenfolk upstarts who stole the sky from the rocs, and he means to make them his servants. He can be fought only in the air, or by anyone patient enough to climb to his tribute peak.",
set:[["Heavenfolk eyries","Homes carved into the south-facing cliffs, linked by flight paths and reached by the Long Stair."]],
lm:[["The Long Stair","Eleven thousand steps with no railing, the only path for those without wings."],["The Tribute Peak","A summit above the eyries where Aquilon collects his tithe."],["The Ledges of Last Flight","High ledges where the Heavenfolk lay their dead."]],
hk:["A young Heavenfolk wants to fly messages again, and she has chosen a ground-dweller to carry her first one with her.","Aquilon has taken a child as tribute, and the child's mother wants a climber, not a flyer, to bring him back.","A merchant in the valley wants a crate carried up the Long Stair, and will not say what is in it."],
sen:"Thin cold wind; the beat of great wings overhead; ice crackling on stone; the cry of a roc echoing between peaks."},

vharlen:{ep:"The Shield of the Empire",
ov:"Vharlen is the heart of an empire that has spent its whole history facing the demon frontier. Its capital is grand, cold and full of spies, its plains are drilled with legions and its every citizen knows the sound of the alarm horns. It is the most powerful state in the world and the most anxious. Morvane, Vanguard of the Overlord, has come to test its walls, and the legions are not sure they will hold.",
geo:"Vharlen occupies the high plains north-west of the continent's heart, bordered by mountains to the north and the demon lands beyond them. The plains are cut by military roads and dotted with forts, watchtowers and garrison towns. The capital stands on a terrace above a great river, a city of grey stone towers, broad avenues and imperial palaces. The frontier forts stand in the passes of the northern mountains.",
eco:"The plains are farmed intensively to feed the legions, and the wild has been pushed back to the mountains. Wolves, bears and mountain cats live there, and demons come through the passes. Warhorses are bred on the plains and are the finest in the world.",
ppl:"The people of Vharlen are soldiers, farmers, bureaucrats and spies. Every citizen serves in the legions for a period, and military rank shapes social standing. They are disciplined, proud and suspicious, with a dry, dark humour. The capital is cosmopolitan and full of diplomats, merchants and informants from every nation.",
pow:"Vharlen is ruled by an emperor, advised by a senate of generals and nobles, and administered by a vast bureaucracy. Succession is by appointment: each emperor names an heir from among the generals. The economy rests on grain, horses, iron and the business of war. The imperial spy service is the most feared in the world.",
faith:"The people honour the day-gods with military discipline, and the Church is powerful in the capital. Every legion carries a shrine. A pledge sworn by the founders of the empire is carved under the barracks of the capital, and every new recruit swears it.",
hist:["Morvane's legions have struck the frontier forts, and two have fallen. The emperor has called up the reserves, and the capital is full of soldiers and rumours.","Within living memory Vharlen fought a long war with the demons and won, at a terrible cost, and the frontier forts were rebuilt.","In their grandparents' time Vharlen held the line against the Demon Overlord's armies, and the pledge carved under the barracks was the price.","Vharlen held the line the last time. The pledge it took to do so is carved under the barracks."],
ty:"Morvane, Vanguard of the Overlord, is a demon general who leads the advance guard of the demon armies. He is disciplined, tactical and relentless, and he respects Vharlen as a worthy enemy. He wants to break the empire's legions and open the road to the south.",
set:[["Vharlen frontier legions","The garrison towns, forts and legion camps along the frontier and the capital behind them, home of the Imperial Grand Hotel."]],
lm:[["The Imperial Capital","A city of grey towers, palaces and spies on a terrace above the river."],["The Frontier Forts","Forts in the northern passes, facing the demon lands."],["The Barracks Pledge","The founders' oath carved under the capital's barracks."]],
hk:["An imperial spy wants an outsider to carry a message through the frontier, one that cannot be trusted to a legion courier.","A fallen fort's survivors are hiding in the mountains, and the legion has written them off.","The guild's receptionist from Brindlewick has been seen in the capital, and someone wants to know why."],
sen:"Polished steel and horse sweat; marching drums; ink and wax in the ministries; the alarm horn's long note."},

gearholm:{ep:"The Clockwork Mountain",
ov:"Gearholm is a city of clockwork and steam built up the side of a mountain, where gnomes and humans have made machines of every kind: lifts, trains, engines, automatons and clocks that tell the time in seven cities at once. The upper city is bright, clean and full of inventors. The Undercity, where the steam and the poor collect, is dark, loud and dangerous. Cogmaw, the Gremlin Engine King, is taking the city apart from the bottom up.",
geo:"The city climbs a mountain in tiers, connected by lifts, funiculars and spiral stairs. The upper tiers are open, sunny and full of workshops and mansions. The lower tiers are buried in steam and smoke, and the Undercity is a maze of tunnels, pipes and engines beneath the mountain. Great engines at the mountain's heart power everything.",
eco:"Gearholm has little wildlife: pigeons, rats and steam-moths. Gremlins, mechanical vermin that eat metal and breed in machinery, infest the Undercity.",
ppl:"The people of Gearholm are gnomes and humans, inventors, engineers, labourers and merchants. The upper city is rich and proud; the Undercity is poor and resentful.",
pow:"Gearholm is ruled by a council of guild-masters, each controlling an industry. The economy rests on machines, clocks and engineering.",
faith:"The people honour the day-gods and the engines, which they treat almost as gods.",
hist:["Cogmaw's gremlins have taken the lowest levels of the Undercity.","Within living memory a great engine exploded, killing hundreds.","In their grandparents' time the founders lost the instructions to the great engines.","Gearholm's founders built the city's engines and lost the instructions within a generation."],
ty:"Cogmaw, the Gremlin Engine King, is a gremlin of enormous size that has merged with a great engine.",
set:[["Gearholm Undercity","The tunnels and engines beneath the mountain."]],
lm:[["The Great Engines","The engines at the mountain's heart."],["The Clock Tower","A tower whose clock tells time in seven cities."],["The Funicular","A railway up the mountain."]],
hk:["An inventor needs parts from the gremlin-infested Undercity.","The guild-masters want the Undercity sealed.","A child in the Undercity has befriended a gremlin."],
sen:"Steam and oil; the clank of gears; whistles and bells; the scurry of something metal in the dark."}
});
Object.assign(GZL,{
gearholm:{ep:"The Clockwork Mountain",
ov:"Gearholm is a city of clockwork and steam that climbs the side of a mountain in tiers, where gnome and human inventors have built machines for everything: lifts, rail-carts, looms, pumps, automaton porters and a clock that tells the time in seven cities at once. The upper city is bright, clean and proud of itself. The Undercity, where the steam, the smoke and the poor collect, is dark, loud and forgotten. Something down there has started eating the city from the bottom up.",
geo:"Gearholm is built on the southern face of a mountain, its tiers linked by lifts, funicular railways and spiral stairs. The upper tiers are terraces of workshops, academies and mansions with gardens and glass roofs. The middle tiers are factories and markets. The lower tiers vanish into permanent steam, and below them the Undercity runs deep into the mountain: a maze of tunnels, pipes, boilers and slums built around the Great Engines that power the whole city. No one living has seen all of them.",
eco:"Pigeons, rats and steam-moths are the city's wildlife, along with the clockwork birds that inventors release for fun and never recover. Gremlins, little mechanical vermin that eat metal and breed inside machines, have always infested the Undercity, and the city has always employed gremlin-catchers to keep them down. Lately the gremlins have stopped behaving like vermin. They are organised, and they are building.",
ppl:"The people of Gearholm are gnomes and humans, with a scattering of dwarves who came for the work and stayed for the arguments. Upper-city folk are inventors, engineers, academics and merchants, brilliant, competitive and a little arrogant. Undercity folk are labourers, boiler-tenders, scavengers and gremlin-catchers, tough, resourceful and bitterly aware of who keeps the city running. Ideas move up the mountain; credit rarely moves down it.",
pow:"Gearholm is ruled by a council of guild-masters, one for each great industry, elected by their guilds. The council meets in the Clock Tower and votes by pulling levers. The Undercity has no seat on it. The economy rests on machines, clocks, engines, tools and patents, and Gearholm's patents are worth more than many kingdoms' treasuries.",
faith:"The people honour the day-gods, especially Kael, whom inventors claim as their patron. Undercity folk keep a quieter faith in the Great Engines themselves: they leave oil and bolts at the engine shrines and speak to the machines as if they could hear. A machine is never broken up without a word of thanks.",
hist:["Cogmaw's gremlins have taken the lowest levels of the Undercity and are moving upward, stripping pipes, rails and lifts as they go. The council wants the Undercity sealed off, with its people inside.","Within living memory a Great Engine exploded and killed hundreds in the Undercity. The council blamed the boiler-tenders, and the boiler-tenders have never forgiven it.","In their grandparents' time the founders' instructions for the Great Engines were lost in a fire, and the city has been maintaining machines it does not fully understand ever since.","Gearholm's founders built the city's engines and lost the instructions within a generation."],
ty:"Cogmaw, the Gremlin Engine King, began as an ordinary gremlin that crawled inside one of the Great Engines and never came out. It ate, grew and merged with the engine until it became a single thing: a vast, living machine that thinks. It commands the gremlins as its body commands its gears, and it wants the whole mountain as its body. It is very clever and very hungry, and it has found the founders' lost instructions inside its own engine.",
set:[["Gearholm Undercity","The tunnels, boilers and slums beneath the mountain, home of the city's labourers and of the Great Engines."]],
lm:[["The Great Engines","The enormous machines at the mountain's heart that power the whole city."],["The Clock Tower","A tower whose clock tells the time in seven cities, where the council meets."],["The Long Funicular","A railway that climbs from the lowest tier to the highest, and is the only safe way between them."]],
hk:["An upper-city inventor needs a part that exists only in the gremlin-held Undercity, and she will pay a fortune not to go herself.","A boiler-tender's union wants proof that the council knew about Cogmaw and did nothing.","A child in the Undercity has befriended a gremlin that says it does not want to be part of the king."],
sen:"Steam, coal and machine oil; the clank and whir of a thousand gears; whistles and bells on every hour; something small and metal scurrying in the dark."},

cinderhole:{ep:"The Smoking City",
ov:"Cinderhole is a city built inside a smoking crater, in caves that are never dark and never clean. It was a mine until the coal seams caught fire and never stopped burning, and the people who stayed learned to live in the heat, the smoke and the endless glow. It is a city of smugglers, alchemists, refugees and fortune-seekers, where anything can be bought and everyone is hiding something. Cinderlord Vasque rules the smoke, and everything sold through it.",
geo:"The crater is a vast pit in a range of barren hills, wreathed in smoke that rises day and night. Fires burn in the coal seams beneath it, and vents in the rock leak heat and fumes. The city is built into the crater's walls and the caves behind them, terraces and tunnels lit by the glow of the fires. Great chimneys carved into the rock carry the worst of the smoke away.",
eco:"Little lives in the crater except fire beetles, ash moths, smoke bats and the people. Fire elementals and smoke spirits drift up from the burning seams. Food, water and nearly everything else must be brought in by caravan.",
ppl:"The people of Cinderhole are miners, alchemists, smugglers, mercenaries and refugees from every land who have nowhere else to go. They are tough, wary and fiercely independent. Smoke-masks are worn by everyone, and a person's mask says more about them than their face.",
pow:"Cinderhole is ruled by the Cinderlord, who controls the smoke vents and the chimneys and therefore who can breathe. Under him, gangs and guilds compete for territory. The economy rests on coal, alchemy, smuggling and the black market, and Cinderhole is the place to buy anything that cannot be bought elsewhere.",
faith:"The people honour the day-gods quietly and the fire openly. They believe the burning seams are a punishment for the old miners' greed, and that the fire will go out only when the debt is paid.",
hist:["Vasque has begun closing chimneys to punish districts that resist him, and people are choking in their homes.","Within living memory a great fire-storm swept the crater and killed thousands, and Vasque rose to power promising it would never happen again.","In their grandparents' time Cinderhole was a mine, and the miners dug too deep.","Cinderhole was a mine until it caught fire. It never stopped burning, so people moved in."],
ty:"Cinderlord Vasque, the Smoke Mage, is a human mage who has mastered the smoke and fire of the crater. He controls the vents and the chimneys with his magic, and he can choke a district or burn it at will. He sees himself as a ruler who keeps order in a city that would otherwise tear itself apart. He is not wrong about the city, and he is utterly wrong about himself.",
set:[["Cinderhole","The city in the smoking crater, built into its walls and the caves behind them."]],
lm:[["The Great Chimneys","Chimneys carved into the crater wall to carry the smoke away."],["The Burning Seams","The coal seams that have burned for generations."],["The Mask Market","A market where smoke-masks are sold, traded and stolen."]],
hk:["A district's chimney has been closed, and its people need someone to open it.","An alchemist claims to have a way to put out the burning seams, and every gang in the city wants her dead.","A refugee family wants to get out of the crater, and Vasque has forbidden it."],
sen:"Smoke that stings the eyes; the roar of the fires below; sweat and ash; the hiss of breath through a mask."}
});
Object.assign(GZL,{
bastion:{ep:"The City of Rings",
ov:"Bastion is a city of walls on an open steppe, built in rings, one inside the other, each one raised after the horde broke the last. It is the last stop before the horde lands and the shield of everything behind it. Its people are soldiers, builders and farmers who till the fields between the rings. Thrakka, Sabretooth Khan of the Steppe Horde, rides against the outer ring.",
geo:"The steppe around Bastion is flat, open and windswept, with nothing to stop a cavalry charge. The city sits on a low rise, its rings of walls spreading outward like ripples in a pond. Fields, pastures and villages fill the spaces between the rings, and the oldest, innermost ring encloses the citadel. Beyond the outermost ring, the steppe stretches north to the horde lands.",
eco:"The steppe supports grass, wildflowers, horses, antelope and wolves, and sabretooth cats, the horde's mounts, hunt there. Within the rings the land is farmed intensively, and every scrap of food is precious during a siege.",
ppl:"The people of Bastion are soldiers, masons, farmers and smiths. They are stoic, practical and fiercely loyal to the city. Every child learns to lay stone and to hold a spear. Their humour is dark, and their songs are about walls.",
pow:"Bastion is ruled by a Warden chosen by the captains of the rings. Each ring has its own captain, and the outermost ring's captain is the most honoured and the most likely to die. The city trades grain, horses and stone with the south and depends on it for iron and supplies.",
faith:"The people honour the day-gods and the walls, which they believe hold the spirits of the builders. A stone from the last broken ring is built into each new one.",
hist:["Thrakka's horde is besieging the outermost ring, and the masons are already laying the foundations of the next.","Within living memory the horde broke two rings in a single summer, and the city nearly fell.","In their grandparents' time Bastion had half as many rings, and the city was a fort.","Bastion builds a new ring every time the horde breaks the outermost one. There are many rings."],
ty:"Thrakka, Sabretooth Khan of the Steppe Horde, is a beastkin warlord who rides a giant sabretooth cat at the head of a horde of riders and beasts. He believes the steppe belongs to the horde and that Bastion is a wound in it. He has sworn to break every ring.",
set:[["Bastion outer ring","The outermost ring of walls, its villages and fields, the front line of the siege."]],
lm:[["The Citadel","The innermost ring, the oldest part of the city."],["The Broken Rings","The ruins of rings the horde has broken, now the foundations of new walls."],["The Stone of Founding","A stone from the first wall, built into every new ring."]],
hk:["The outermost ring's captain needs scouts to find out how the horde breaks the walls so quickly.","A mason has found a flaw in the new ring's foundations, and someone put it there.","A horde rider has deserted and wants to tell the Warden something."],
sen:"Stone dust and woodsmoke; the ring of masons' hammers; war drums on the steppe; the low growl of great cats."},

everdusk:{ep:"The Twilight Forest",
ov:"Everdusk is a forest of endless twilight, where the sun never fully rises or sets and the fey courts hold revels in the glades. Politeness is law here, thanks are debts and every bargain binds. The Summer Court and the Winter Court have argued for as long as the forest has existed. The Briar King of the Winter Court wants the Summer Court's last glade.",
geo:"The forest is a vast, ancient woodland of oak, ash and thorn, lit by a perpetual dusk. Glades open among the trees, each one the seat of a fey lord. Rivers run silver, and paths change depending on who walks them. The Summer Court's glades are warm and golden; the Winter Court's are cold and blue.",
eco:"Deer, foxes, owls and nightingales live in the forest, along with pixies, sprites, dryads and fey beasts of every kind. Plants grow strangely, flowering and fruiting at once. Time flows differently in the glades.",
ppl:"The fey of Everdusk are beautiful, capricious and bound by rules no mortal fully understands. Mortals who live in or near the forest are woodcutters, hunters and changelings, and they know to be very careful with their words.",
pow:"The forest is divided between the Summer and Winter Courts, each ruled by a monarch. The courts are bound by ancient agreements and constantly test them. Mortal trade with the fey is dangerous but lucrative: fey goods, enchantments and secrets for mortal names, memories and years.",
faith:"Mortals honour the day-gods and leave offerings for the fey at the forest's edge. Never say thank you to a fey, and never give your name.",
hist:["The Briar King's thorns are swallowing the Summer Court's glades, and only one remains. The Summer Court has begun to beg mortals for help, which is unprecedented.","Within living memory a mortal child was stolen from the forest's edge and returned as an adult, with no memory of where she had been.","In their grandparents' time the courts held a great treaty that divided the forest in two.","The courts made the dusk to settle an argument about whether it was day or night. They are still arguing."],
ty:"The Briar King, Lord of the Winter Court, is a fey lord of thorns, ice and cold beauty. He believes the Summer Court is weak and the forest should be his. His thorns grow wherever he walks, and his bargains are cruel.",
set:[["Summer Court glades","The last glades of the Summer Court, warm and golden, home of the Hour That Isn't."]],
lm:[["The Last Glade","The Summer Court's final glade, ringed by encroaching thorns."],["The Thorn Throne","The Briar King's seat."],["The Edge Stones","Stones at the forest's edge where offerings are left."]],
hk:["The Summer Court wants a mortal champion, and its terms are generous, perhaps too generous.","A woodcutter's daughter has been invited to a fey revel, and her father wants her back before dawn.","A mortal who made a bargain with the Briar King wants to break it."],
sen:"Honey and frost; music that never stops; the rustle of thorns; light that is always just about to change."},

apu_highlands:{ep:"The Carved Mountains",
ov:"The Apu Highlands are mountains carved by hand into terraces that climb from the valleys to the clouds. Their people farm the terraces, herd llamas and keep their history on knotted cords. No one knows who carved the mountains, but the oldest cords record a name. Ukhu-Tal, the first stone giant ever made, has woken to see what was done with them.",
geo:"The mountains are steep, high and green, cut into thousands of terraces held up by stone walls. Rivers rush through deep gorges, and roads paved in stone link the terrace cities. Above the terraces, bare peaks rise into snow.",
eco:"Llamas, alpacas, condors, pumas and vicuñas live in the highlands. The terraces grow potatoes, maize, quinoa and beans. Stone giants sleep in the mountains.",
ppl:"The people of the highlands are farmers, herders, stonemasons and cord-keepers. They are communal, hard-working and proud of their mountains.",
pow:"The highlands are ruled by a lord of the terrace cities, and every family owes labour to the community. Wool, potatoes, stonework and medicines are traded down to the coasts.",
faith:"The people honour the day-gods and the mountains, which they call apus, the lords. Offerings are made at the mountain shrines.",
hist:["Ukhu-Tal has woken and is walking the terraces, breaking walls as he goes.","Within living memory a great earthquake shook the highlands, and the terraces held.","In their grandparents' time the cord-keepers could read every cord.","Highland families keep knotted cords recording every terrace. The oldest cords record a giant's name."],
ty:"Ukhu-Tal, Stone Giant of the First Making, is the first stone giant ever made, who carved the terraces long ago and fell asleep. He has woken to find people living on his work, and he does not know whether to be angry or proud.",
set:[["Terrace cities","Cities built on the terraces, linked by stone roads."]],
lm:[["The Great Terraces","Terraces climbing from valley to cloud."],["The Cord House","Where the oldest cords are kept."],["The Giant's Bed","The mountain where Ukhu-Tal slept."]],
hk:["A cord-keeper needs help reading the oldest cord.","Ukhu-Tal has spoken to a child.","A terrace wall has collapsed, and a family is trapped."],
sen:"Thin cold air; llama bells; woodsmoke and potatoes; the grinding of stone."}
});
Object.assign(GZL,{
apu_highlands:{ep:"The Carved Mountains",
ov:"The Apu Highlands are a range of high green mountains carved by hand, from valley floor to cloud line, into tens of thousands of terraces. Their people farm those terraces, herd llamas along stone roads and keep their history on knotted cords that only a few can still read. Nobody knows who carved the mountains; the highlanders say the mountains carved themselves for their children. The oldest cords record a giant's name, and the giant has woken up.",
geo:"The highlands are steep and immense, their slopes cut into stepped terraces held up by walls of fitted stone so precise that a knife blade cannot slip between the blocks. Rivers fall through deep gorges, crossed by rope bridges that are rewoven every year. Stone roads with thousands of steps link the terrace cities, and relay huts stand along them a day's run apart. Above the terraces rise bare grey peaks capped with snow, and on the tallest stands the Giant's Bed, a flat summit shaped like a sleeping body.",
eco:"Llamas and alpacas graze the upper terraces and carry loads along the roads, condors ride the thermals, pumas hunt vicuña in the high grass and hummingbirds feed on the terrace flowers. Each terrace makes its own little climate, and the highlanders grow hundreds of kinds of potato, maize, quinoa and beans at different heights. Stone giants sleep in the mountains, and the earth tremors that the highlanders call the mountains turning in their sleep are, the cord-keepers say, exactly that.",
ppl:"The highlanders are farmers, herders, masons, weavers, runners and cord-keepers. They are communal, hard-working and quietly proud, and they measure a person's worth by the walls they have helped mend. Every family owes a share of labour to the community, and work days are feasts. The cord-keepers are a respected, dwindling order, and young highlanders who leave for the coast rarely come back to learn the knots.",
pow:"The terrace cities are ruled by a lord in the highest city, advised by the heads of the great families. Labour, not coin, is the main tax, and the roads, bridges and walls are maintained by everyone in turn. Wool, potatoes, dried meat, medicines and fine stonework are traded down the mountains for salt, fish, cotton and metal. The relay runners carry messages across the highlands in a few days.",
faith:"The highlanders honour the day-gods and the mountains themselves, which they call the apus, the lords. Every peak has a shrine where offerings of coca leaf, maize beer and woven cloth are left. A wall that falls is mourned like a person, and rebuilt by the whole community.",
hist:["Ukhu-Tal has woken on the Giant's Bed and walks the terraces, and the walls break where he steps. He has not yet harmed anyone on purpose, but the terraces are falling, and the harvest with them.","Within living memory a great earthquake shook the highlands for three days, and the terraces held; the lowland cities fell.","In their grandparents' time the cord-keepers could still read every cord in the Cord House, including the oldest ones.","Highland families keep knotted cords recording every terrace. The oldest cords record a giant's name."],
ty:"Ukhu-Tal, Stone Giant of the First Making, is the first stone giant ever made and the mason of the highlands. He carved the first terraces, taught their making to the first people and lay down on the summit to rest when the work was done. He has woken to find the terraces covered in people, his work patched with other stones and his name forgotten. He walks the terraces looking for the walls he made, and he breaks the ones he did not. He does not know whether he is angry or proud, and someone who can read the oldest cords might be able to tell him.",
set:[["Terrace cities","Cities of fitted stone built on the terraces, linked by stone roads and relay huts."]],
lm:[["The Great Terraces","Tens of thousands of stepped fields climbing from the valley floor to the clouds."],["The Cord House","The hall where the oldest knotted records are kept, many of them unread for generations."],["The Giant's Bed","The flat summit where Ukhu-Tal slept, still bearing the shape of his body."]],
hk:["The last cord-keeper who might read the oldest cord is dying in a lowland city, and someone has to bring her home.","Ukhu-Tal has spoken to a child herding llamas, and she is the only person he will talk to.","A terrace wall has collapsed onto a village, and a family is trapped under the stones."],
sen:"Thin cold air and woodsmoke; llama bells on the stone roads; maize beer and roasted potatoes; the deep grinding of stone on stone."},

lustrine_shores:{ep:"The Moon-Glass Coast",
ov:"The Lustrine Shores are beaches of glittering moon-glass, where every tide leaves light behind it. Their people are glass-gatherers, lamp-makers and fishers, and their villages glow at night like scattered stars. The glass began washing in after the red moon rose, and nobody knows where it comes from. Ilyanthe, the Moon Harvester, gathers that light for the red moon.",
geo:"The shores are long beaches of fine sand mixed with fragments of glowing glass, backed by dunes, salt marshes and pine woods. The tides here are higher than anywhere else, pulled by both moons. At low tide, great flats of glass shine for miles. The villages stand on the dunes above the tideline.",
eco:"Crabs, shorebirds, seals and fish live along the shores, and many of them have begun to glow. Glass-shrimp feed on the light in the moon-glass, and glass-gulls feed on the shrimp. Moon-moths flutter over the flats at night.",
ppl:"The people of the shores are glass-gatherers, lamp-makers, fishers and salt-panners. They are dreamy, superstitious and gentle, and their songs are slow and sad. Lustrine lamps, made of moon-glass, are sold across the world and never need oil.",
pow:"The villages are governed by their elders, and the glass-gatherers' guild controls the beaches. Moon-glass, lamps, salt and fish are traded abroad.",
faith:"The people honour the day-gods and the moons, both of them. They believe the glass is the moon's tears, and they leave the largest pieces on the beach as offerings. They do not look at the red moon directly.",
hist:["Ilyanthe has begun harvesting the light from the glass, and the beaches are going dark. Gatherers who are on the flats when she comes are found the next morning, pale and empty-eyed.","Within living memory the first moon-glass washed ashore, and the shores went from poverty to prosperity in a generation.","In their grandparents' time the shores were poor fishing villages, and there was only one moon.","The glass began washing in after the red moon rose. The fishers' songs changed key that same year."],
ty:"Ilyanthe, the Moon Harvester, is a vesperite, a creature from the red moon, who descends on the high tides to harvest the light from the moon-glass. She gathers it into a great lantern and carries it back up. She takes the light from people too, and she does not seem to know the difference.",
set:[["Lustrine glass beaches","Villages on the dunes above the glowing beaches."]],
lm:[["The Glass Flats","Miles of glowing glass revealed at low tide."],["The Lamp Market","Where Lustrine lamps are made and sold."],["The Tide Stair","A stair cut into the dunes where Ilyanthe descends."]],
hk:["A glass-gatherer's daughter has lost her light, and her mother wants it back.","A lamp-maker has made a lamp that glows red, and it is calling to something.","Scholars want a sample of the light Ilyanthe carries."],
sen:"Salt and pine; the glitter of glass underfoot; slow sad songs; a red glow on the horizon."}
});
Object.assign(GZL,{
quaking_lands:{ep:"The Restless Ground",
ov:"The Quaking Lands are a region of mountains and plains where the ground never stops moving. Hills shift, rivers change course overnight and new valleys open with a sound like thunder. The people who live here, the Stillers, have built their towns around the few springs where the ground is still. Quakeback, the Earthshaker Behemoth, is the reason, and it is turning in its sleep.",
geo:"The land is a broken country of ridges, cracks, landslides and new-made hills, between a range of jagged mountains and a broad, rippling plain. Rivers appear and disappear, and lakes drain overnight. The still springs are scattered across the region, each one a calm pool where the ground does not move, and every town is built around one. The Stillers' oldest maps show mountains that are no longer there.",
eco:"Animals here are hardy and adaptable: burrowing creatures, mountain goats, wolves and birds that nest on the ground and can fly at the first tremor. Earth elementals and stone beasts thrive in the quakes. Plants grow fast and shallow, and the Stillers farm in quick seasons between tremors.",
ppl:"The Stillers are a resilient, patient people who read tremors the way sailors read weather. They build in wood and rope rather than stone, and every house can be taken down and moved in a day. They are calm in a crisis and nervous in calm weather.",
pow:"Each spring-town is ruled by its tremor-readers, who decide when to farm, when to move and when to run. The towns trade tremor-charts, wood, herbs and the strange crystals the quakes bring up from below.",
faith:"The Stillers honour the day-gods and the still springs, which they consider sacred. They believe the earth is a sleeping beast and that the springs are where it has promised not to move.",
hist:["Quakeback has begun to stir, and the tremors are stronger and more frequent. Two still springs have cracked, and their towns have had to flee.","Within living memory a great quake split the plain and opened a valley that the Stillers still call the New Gorge.","In their grandparents' time the tremors were gentle and the springs were many.","The Stillers learned to read tremors the way sailors read weather. Their oldest maps are all wrong now."],
ty:"Quakeback, the Earthshaker Behemoth, is a creature so vast that the region's mountains are its back. It has slept beneath the Quaking Lands for ages, and its dreams make the ground move. Now it is waking, and every turn it makes reshapes the land. It does not know the Stillers exist.",
set:[["Stiller spring-towns","Towns of wood and rope built around the still springs."]],
lm:[["The Still Springs","Calm pools where the ground does not move."],["The New Gorge","A valley opened by a great quake within living memory."],["Quakeback's Ridge","A mountain ridge that breathes."]],
hk:["A tremor-reader has predicted a great quake, and no one believes her.","A spring-town needs to move, and the route crosses Quakeback's Ridge.","A Stiller child has learned to calm the tremors by singing to the ground."],
sen:"Dust and pine; the creak of rope houses; a constant faint vibration underfoot; the deep groan of the earth."},

aurumdeep:{ep:"The Drowned Gold Kingdom",
ov:"Aurumdeep is an underground kingdom of gold that sank into the earth in a single night, during the most famous magic show in history. Its golden halls lie flooded and dark beneath the surface, full of treasure and the dead. An explorers' camp has grown up at its edge, and treasure-hunters come from every land. The Mad Magician who sank it is still performing.",
geo:"Aurumdeep lies in a vast cavern beneath the surface, its golden palaces, towers and streets half-flooded by underground rivers. Golden light still glows from enchanted lamps, and the water is clear and cold. The explorers' camp stands on a ledge above the sunken city, reached by a long stair from the surface.",
eco:"Blind fish, cave eels and golden crabs live in the flooded streets. The dead of Aurumdeep walk its halls, still dressed for the show, and the Mad Magician's illusions roam everywhere.",
ppl:"The explorers' camp is home to treasure-hunters, scholars, divers and merchants who buy what they bring up. They are greedy, brave and superstitious.",
pow:"The camp is governed by an explorers' council that issues diving rights. Gold, relics and stories flow out of Aurumdeep.",
faith:"The explorers honour Vex and leave a coin for the dead before every dive.",
hist:["The Mad Magician's show has started again, and explorers who watch it are found turned to gold.","Within living memory the first explorers found the stair down to Aurumdeep.","In their grandparents' time Aurumdeep was a legend.","Aurumdeep was the richest kingdom on any map, until a single show-night sank it."],
ty:"The Mad Magician of Aurumdeep, Sinker of Kingdoms, is the court magician whose great show sank the kingdom. He is still performing, and his audience is the dead.",
set:[["Aurumdeep explorers' camp","A camp on a ledge above the sunken city."]],
lm:[["The Golden Theatre","Where the show is still performed."],["The Sunken Palace","The king's palace, flooded and dark."],["The Long Stair","The stair down from the surface."]],
hk:["An explorer has been turned to gold, and his partner wants to reverse it.","A scholar wants to see the end of the Mad Magician's show.","A diver has found the king's crown."],
sen:"Cold water and gold; the echo of applause; dripping stone; the smell of old greasepaint."}
});
Object.assign(GZL,{
aurumdeep:{ep:"The Drowned Gold Kingdom",
ov:"Aurumdeep was the richest kingdom on any map: a realm of golden halls built into a great cavern beneath the earth, lit by enchanted lamps and fed by underground rivers. Then, on the night of the most famous magic show in history, the whole kingdom sank deeper into the earth, and the rivers poured in after it. Its golden streets lie flooded and dark, full of treasure and of the dead who never left their seats. An explorers' camp clings to the cavern's edge, and every season more treasure-hunters come down the Long Stair. The Mad Magician who sank the kingdom is still performing.",
geo:"The cavern of Aurumdeep is so large that clouds of mist form under its roof. The sunken city fills its floor: palaces, towers, bridges and avenues of gilded stone, flooded to different depths so that some streets are dry, some knee-deep and some lost under fathoms of clear, cold water. Enchanted lamps still burn in many of the halls, so the drowned city glows gold from beneath the surface. The explorers' camp sits on a broad ledge high on the cavern wall, at the foot of the Long Stair that winds up to the surface.",
eco:"Blind white fish, cave eels and golden-shelled crabs have colonised the flooded streets, feeding on the algae that grows around the lamps. Bats roost under the cavern roof. The dead of Aurumdeep still walk the dry halls in their finest clothes, polite and confused, and the Magician's illusions wander everywhere: painted doves, silk dragons, smiling assistants that dissolve when touched. Nothing here is quite what it looks like, including the gold.",
ppl:"The camp is home to treasure-hunters, divers, scholars, fences, cooks and a handful of descendants of Aurumdeep's survivors, who were outside the kingdom on the night it sank and who consider the treasure-hunters grave-robbers. The explorers are brave, greedy and superstitious, and they trade stories as freely as gold. A diver's reputation rests on how deep she has gone and what she brought back.",
pow:"An explorers' council governs the camp and sells diving rights to each district of the sunken city. Claim disputes are settled by the council, or in the water. Gold, gems, relics, books and enchanted lamps flow up the Long Stair, and food, rope, lamps and diving gear flow down it. The survivors' descendants petition every kingdom on the surface to declare Aurumdeep a tomb and close it; none has agreed.",
faith:"Explorers pray to Vex before every dive and leave a coin on the first step of the water for the dead. No one in the camp applauds, ever, for anything. The survivors' descendants hold a silent vigil on the anniversary of the sinking and leave a single empty seat at every table.",
hist:["The Mad Magician's show has started again in the Golden Theatre, and explorers who stay to watch it are found the next day turned to gold, smiling in their seats.","Within living memory the first explorers found the Long Stair, and the camp grew from a single tent to a town in a decade.","In their grandparents' time the survivors' families still spoke of Aurumdeep as home and refused to say what the Magician had promised the king that night.","Aurumdeep was the richest kingdom on any map, until a single show-night sank it."],
ty:"The Mad Magician of Aurumdeep, Sinker of Kingdoms, was the court magician of the golden kingdom. On the night of his greatest show he promised the king a trick that would make Aurumdeep the richest realm forever, and he performed it, and the kingdom sank. He has been performing ever since to an audience of the dead, waiting for applause that would end the trick. His illusions fill the city, and his greatest trick turns those who watch it into gold. He may be mad, cursed or simply unable to stop.",
set:[["Aurumdeep explorers' camp","A rough town of tents, huts and cranes on a ledge above the sunken city, at the foot of the Long Stair."]],
lm:[["The Golden Theatre","The theatre where the show is still performed to an audience of the dead."],["The Sunken Palace","The king's palace, flooded to its upper floors, where the crown is said to still sit on the throne."],["The Long Stair","The winding stair from the surface, with a memorial shrine at every hundredth step."]],
hk:["An explorer has been turned to gold in his seat at the theatre, and his partner wants him back before the fences carve him up.","A survivor's descendant wants to find out what trick the Magician promised, and believes the answer is in the theatre's prompt-book.","A diver claims to have seen the king alive in the Sunken Palace, sitting on his throne, waiting for the show to end."],
sen:"Cold clear water and the glint of gold; the echo of applause that never comes; dripping stone; the smell of old greasepaint and lamp oil."},

nox_dominion:{ep:"The Dark Realm",
ov:"Nox Dominion is the volcanic heartland of the demon realms, a land of black rock, red rivers and ruined fortresses under a sky that is always dark. It is the seat of the Demon Overlord's power and the end of every hero's road. It is also, to the surprise of everyone who reaches it, a place where ordinary demons live ordinary lives: farmers, merchants, innkeepers and children, who fear the war as much as anyone. No Tyrant holds it, because the Dominion answers to someone far worse.",
geo:"The Dominion is a land of active volcanoes, lava rivers, ash plains and obsidian cliffs, under clouds of smoke that block the sun. The ruins of ancient fortresses, many built by armies that came to conquer it, stand on every ridge. At its centre stands the Overlord's citadel, a fortress of black stone on a mountain of fire. Border towns cling to the edges where the land is gentler.",
eco:"Fire-adapted plants and fungi grow in the ash, and demon livestock graze on them. Hellhounds, salamanders, fire drakes and stranger creatures live in the wilds. The demons farm, hunt and trade like any other people.",
ppl:"The demons of Nox Dominion are as varied as any people: soldiers, farmers, merchants, artisans and scholars, cruel and kind, loyal and rebellious. Many fear the Overlord and his Generals, and some quietly oppose them. Human prisoners, deserters and traders also live in the border towns.",
pow:"The Dominion is ruled by the Demon Overlord and his five Generals, each commanding a province and an army. Below them, demon nobles govern the towns. The economy rests on obsidian, sulphur, fire-crystals and war.",
faith:"The demons have their own gods and their own stories, and many of them honour the Overlord as a saviour. Some still pray to the day-gods in secret.",
hist:["The war is reaching its climax, and the Dominion's armies are on the march. The border towns are full of refugees from both sides.","Within living memory the Lantern Seal held the Overlord, and the Dominion knew a generation of uneasy peace.","In their grandparents' time the heroes of past ages marched here, and the ruins still bear their marks.","The heroes of past ages marched here. The ruins remember them, and so do the statues."],
ty:"Nox Dominion has no Tyrant and no siege; it is a story region. Its masters are the Demon Overlord and his Generals, and their story is told elsewhere.",
set:[],
lm:[["The Overlord's Citadel","A fortress of black stone on a mountain of fire."],["The Hero's Road","A path of ruined fortresses left by past heroes' campaigns."],["The Border Towns","Towns at the Dominion's edge where demons and humans trade, home of the Crimson Rest."]],
hk:["A demon innkeeper is hiding a human deserter and wants help getting him home.","A demon child has run away to find out what humans are really like.","A ruined fortress holds a hero's statue, and something is wrong with its face."],
sen:"Sulphur and ash; the glow of lava rivers; the clang of forges; a sky that never brightens."}
});
Object.assign(GZL,{
calamity_steppe:{ep:"The Land of Calamities",
ov:"The Calamity Steppe is an immense grassland in the far west, the size of a kingdom, with no towns, no roads and no people. It belongs to the monsters, and the monsters here are the size of hills. They graze its grass and hunt one another in herds, and now and then one of them wanders east into the inhabited world and becomes a Calamity. The guild charts their trails like rivers. No Tyrant holds the steppe and no one lives there to be besieged; there is nothing to defend but your own life.",
geo:"The steppe is a vast, rolling plain of tall grass that ripples like the sea, broken by lone hills, dry riverbeds, salt pans and craters left by battles between monsters. The grass grows so fast that trails close behind the herds within days. There are no trees for a hundred miles. In the middle of the steppe stand the Tusks, a ring of colossal bones, the remains of something that died here long ago and that every Calamity seems to visit at least once.",
eco:"The Calamity Steppe is an ecosystem of giants. Behemoths graze, titanic beasts hunt them and swarms of smaller monsters follow both to feed on the leftovers. The grass is rich in mana, which may be why the monsters grow so large. Birds as big as ships ride the thermals, and burrowing monsters tunnel beneath the plain. When a Calamity is born, a creature grown beyond the steppe's capacity to feed it, it walks east toward the lands of people.",
ppl:"No one lives on the steppe. Expeditions of S-rank adventurers, scholars and guild cartographers cross it in armoured caravans, and a few hermits and madmen have tried to live there. The beastkin clans of Fanghold tell stories of their ancestors who walked the Calamity Steppe and came back changed.",
pow:"No power holds the steppe. The guild maintains watchtowers along its eastern edge to track Calamities as they leave it, and issues expedition licences only to the highest ranks.",
faith:"The clans of the eastern steppes believe the Calamity Steppe is where the first monsters were made, and they leave offerings at its edge to keep them there. Guild cartographers have their own superstition: never name a monster on the steppe until you are off it.",
hist:["The guild's watchtowers report more Calamities leaving the steppe this year than in any year on record, and all of them walking in the same direction.","Within living memory a Calamity walked out of the steppe and flattened a city before it was killed, and the guild built the watchtowers in response.","In their grandparents' time the steppe's edge was a hundred miles further west.","Calamities are born here and wander out. The guild charts their trails like rivers."],
ty:"The Calamity Steppe has no Tyrant and no siege, because there are no settlements to defend. Its monsters are the greatest wild creatures in the world, and some of them are greater than many Tyrants.",
set:[],
lm:[["The Tusks","A ring of colossal bones in the middle of the steppe that every Calamity visits."],["The Watchtowers","The guild's towers along the eastern edge, tracking Calamities as they leave."],["The Salt Pans","White flats where the giants come to lick salt and fight."]],
hk:["A watchtower has gone silent, and the last report mentioned a Calamity walking toward it.","A scholar wants to know why every Calamity visits the Tusks.","A guild cartographer has named a monster on the steppe, and now it is following her."],
sen:"Endless grass hissing in the wind; the ground trembling under distant footsteps; the smell of crushed herbs and old bone; a sky that feels too big."},

the_maw:{ep:"The Breathing Pit",
ov:"The Maw is a pit in the western lands that breathes. Air rushes in for an hour and out for an hour, as regular as a sleeper's breath, and the sound can be heard for miles. It descends into the Underworld deeper than anyone has measured, and the land around it has been sinking ever since it opened. It is home to the Hive Mother, and when she stirs the swarm pours out and becomes a world event that no single region can face alone.",
geo:"The Maw is a vast, round shaft hundreds of yards across, its walls ribbed like a throat and slick with a resinous coating. Tunnels branch off it at every depth, leading into a honeycomb of chambers that fills the rock for miles around. The land around the rim slopes inward and cracks as it sinks. At the bottom, far below where any lantern reaches, lies the Hive Mother's chamber.",
eco:"The Maw is a single, enormous hive. Its insectoid creatures, the swarm, are all the Hive Mother's children: workers, soldiers, flyers and stranger castes that seem to be made for specific tasks. They harvest the surrounding land, carrying everything down into the pit. Nothing else lives near the Maw for long.",
ppl:"No one lives at the Maw. The guild maintains a fortified watch camp on a ridge some miles away, and S-rank parties occasionally descend to cull the swarm or study it.",
pow:"No power holds the Maw. The guild coordinates the response when the swarm rises, and the kingdoms of the world are bound by treaty to send help.",
faith:"Some say the Maw is a mouth of the world itself, breathing in the sins of the surface. The guild's watchers simply count the breaths and grow nervous when the rhythm changes.",
hist:["The Maw's breathing has quickened, and the guild watchers believe the Hive Mother is waking.","Within living memory the swarm rose and stripped three provinces before the combined armies drove it back down.","In their grandparents' time the Maw was smaller, and its breath could barely be heard.","The Maw opened after the Sundering, and the land around it has been sinking ever since."],
ty:"The Maw has no Tyrant and no siege. Its Calamity, the Hive Mother, is a world event, not a regional siege, and when she rises the whole world must answer.",
set:[],
lm:[["The Rim","The cracked, sinking edge of the pit, where the breath can knock a person over."],["The Watch Camp","The guild's fortified camp on a ridge, counting the breaths."],["The Throat","The upper shaft, ribbed and slick, where the swarm's tunnels begin."]],
hk:["The watch camp's breath-counter has noticed a second rhythm under the first.","An S-rank party went down to cull the swarm and has sent back only a single word.","A farmer near the Maw says his field sank a foot overnight, and something under it is singing."],
sen:"A wind that pulls and pushes; the hum of a million wings; resin and dust; the deep, slow breathing of something huge."}
});
Object.assign(GZL,{
root_of_the_world:{ep:"Where the World Is Held",
ov:"The Root of the World is the deepest place there is, far below the Underworld's other layers. Here vast roots of light and stone rise out of the darkness and hold up everything above: the Underworld, the surface, the seas and the sky. The air hums, the stone glows and the monsters are among the oldest and strongest in existence. No one lives here. Very few have ever come here and returned. Legends call it the place the gods knelt down to weave.",
geo:"The Root is a cavern without visible walls or floor, crossed by immense pillars that seem to be both roots and stone, threaded with veins of light. Paths of rock wind between them, bridges of crystal span gulfs of nothing and islands of earth float in the dark. The light in the roots pulses slowly, like a heartbeat. Some of the roots are cracked, and light leaks from them like sap.",
eco:"Only elementals, aberrations, living plants, constructs, dragons and slimes survive here, the creatures that need no sun and can feed on raw mana. They cluster around the roots and drink the light that leaks from them. Some are so old that they seem to have forgotten what they were.",
ppl:"No one lives at the Root. A few of the world's greatest adventurers have reached it, and they speak of it rarely and always with reverence.",
pow:"No power holds the Root. It belongs to whatever made the world.",
faith:"Every faith in Aetheria has a story about the Root. The Church calls it the foundation stone of creation; the elves, the root of the World Tree; the dwarves, the first anvil. All of them agree that it should not be damaged, and that the cracks are a bad sign.",
hist:["Adventurers who have reached the Root report that the cracks in the roots are widening and that the light leaking from them is growing brighter.","Within living memory a party reached the Root for the first time in a century and brought back a shard of root-light that still glows in the Church's treasury.","In their grandparents' time the Root was thought to be a metaphor.","Legend says the gods knelt here to weave the world, and that their kneeling marks are still pressed into the stone."],
ty:"The Root of the World has no Tyrant and no siege; it is the Underworld's deepest layer and holds no settlements. Its monsters are some of the oldest beings in creation.",
set:[],
lm:[["The Kneeling Stones","Two great hollows in the rock, said to be where the gods knelt."],["The Cracked Root","A root split from top to bottom, leaking light."],["The Crystal Bridges","Bridges of crystal spanning bottomless gulfs."]],
hk:["The Church wants to know whether the shard in its treasury is growing.","A slime that has lived at the Root for an age has learned to speak, and it wants to tell someone what it saw.","An adventurer swears she heard someone weeping inside the Cracked Root."],
sen:"A deep hum felt in the bones; the slow pulse of light; air like the inside of a bell; absolute, ancient stillness."},

vesper:{ep:"The Red Moon",
ov:"Vesper is the red moon that hangs over Aetheria, and after the war is over it opens to those strong enough to reach it. Its surface is a broken landscape of ruins, crimson dust and floating stone, and its monsters are unlike anything on the world below. Nobody on the surface remembers the moon being red before; everybody remembers it red now. What lies at its heart is the last mystery of the world.",
geo:"From the surface, Vesper is a red disc with darker marks like the outlines of streets. Up close, those marks are exactly that: the ruins of a city, broken and scattered across the moon's surface, some of it drifting in the sky above. The ground is red dust and shattered stone, and the sky is black with stars. The gravity is light, and the silence is complete.",
eco:"Vesperites, creatures born from the red moon's light, roam the ruins: some delicate, some monstrous, some almost human. The undead, shadows, aberrations, constructs and demons wander among them. Nothing grows here, but the ruins sometimes bloom with flowers of red light.",
ppl:"No one is known to live on Vesper. Those who reach it report that they feel watched, and that the ruins seem to remember them.",
pow:"No power is known to hold Vesper.",
faith:"Every faith in Aetheria fears the red moon. The Church calls it an omen; the elves, a wound in the sky; the fishers of the Lustrine Shores, a thief of light.",
hist:["After the war, Vesper opens to those who can reach it, and the truth of the red moon waits at its heart.","Within living memory the red moon's light has drawn vesperites down to the Lustrine Shores.","In their grandparents' time the scholars began to argue about the marks on the red moon's face, and why they looked like streets.","Nobody on the surface remembers the moon being red before. Everyone remembers it red now."],
ty:"Vesper has no Tyrant and no siege; it is the post-game region. What waits there belongs to the end of the story.",
set:[],
lm:[["The Broken Streets","Ruins of a city scattered across the moon's surface."],["The Floating Quarter","Fragments of the city drifting in the black sky above."],["The Red Heart","The centre of the moon, where the light is strongest."]],
hk:["A scholar's map of the marks on the red moon matches a city on no map of the world.","A vesperite has followed an adventurer back to the surface and is trying to find someone.","The red flowers that bloom in the ruins sing a song that an old woman in Aldmere recognises."],
sen:"Silence and red dust; starlight without air; flowers of light opening in the ruins; the feeling that the city remembers you."}
});
// Clans of Aetheria — draft v1, from Marcé's Pinterest boards "Fantasy Clans" (87 sections) and companions.
// [boardSection, clanName, regionKey, look, culture, hook]
const CLANS = [
["AI Clan","The Clockborn","gearholm","Hooded automatons with smooth faceplates and a single glowing visor slit, robed like monks over plated bodies.","Gearholm's first automaton porters woke up one winter and asked for names. They live in the middle tiers as a quiet guild of repairers and archivists, still arguing with the city over whether they are citizens or property.","A Clockborn archivist has found its own original blueprint, and the signature on it is not a gnome's."],
["AI Infected Clan","The Cog-Touched","gearholm","Gaunt figures fused with pipes, cables and gremlin-work: half skeleton, half machine, eyes replaced with lamps.","People and Clockborn alike whom Cogmaw has begun to absorb. They still remember their names for a while; the Undercity hides the early cases.","A boiler-tender's daughter is Cog-Touched in one hand only, and she can hear the Engine King thinking."],
["Ape Clan","The Vanari","shen_lu","Monkey-folk martial artists with staffs and tails, from wiry red-furred acrobats to grey-maned elders.","A sect of monkey-kin who claim their founder stole a peach of immortality from the mountain gods and was sealed under a peak for it. They are mischievous, loyal and the best climbers on the Hundred Stair.","The Vanari want the outsider to deliver a peach to the sealed peak, and they will not say who eats it."],
["Angel Clan","The Heavenfolk","heavenreach","Broad-winged people in layered robes and light armour; feathers range from gold to storm-grey.","The winged people of the eyries, divided into lantern-bearers who guide the dead to the Ledges of Last Flight and armoured wingguard who once escorted royal messengers and now serve no king.","A Heavenfolk lantern-bearer has lost her lantern, and the dead on her route have stopped arriving."],
["Amphibian Clan","The Bogkin","greymoor","Frog- and toad-folk in reed cloaks and wide hats, from samurai-straight duelists to round, cheerful herbalists.","Greymoor's frogfolk live in the deeper meres and trade with the stilt-villages by night. They croak in harmonies that carry under the fog, and the Hollow Abbot's silence is killing their songs.","A Bogkin choir-master wants to sing against the Choir of Silence, and needs someone to stand with her while she does."],
["Aztec Clan","The Sun-Feathered","xochitl_mire","Warriors in feathered headdresses, jade masks and quilted cotton armour, carrying obsidian-edged clubs.","The warrior orders of the river-cities: Jaguar, Eagle and Serpent lodges who play the great ball-games and guard the canoe-roads. Bravery is measured in captives taken alive, not kills.","The Eagle lodge has challenged an outsider to a ball-game; the prize is the right to hunt Xibalbar."],
["Badger Clan","The Sett-folk","whisperwood","Stout badger-folk in knitted jumpers, waistcoats and reading spectacles; homes full of books, tea and armchairs.","Whisperwood's oldest residents, living in great burrow-halls under the hornbeams. They are the region's librarians, solicitors and grumpy grandparents, and they have watched every rookie come and go.","An old Sett-folk solicitor holds the deed to the ruined waystations and wants to know why the goblins are digging under them."],
["Boar Clan","The Tusk Companies","strife_marches","Heavy boar-folk mercenaries in mismatched plate, tusks capped with iron, carrying halberds and banners.","Sellsword companies who have fought for every baron in the Marches and own a few castles themselves. Contracts are sacred; sides are not.","A Tusk captain wants to break her contract before the Choir of Chains reaches her fort, without breaking her word."],
["Centaur Clan","The Hoofbound","fanghold","Centaurs from horse-backed steppe archers to antlered forest variants, painted in clan colours.","The horse-clans of the steppe, older than the yurt camps, who keep the Wolf Stones and witness the water-peace. Kade's capture of the Deep Well is an insult they mean to answer.","The Hoofbound will ride on Fanghold if an outsider can prove Kade's guards would not shoot the hostages."],
["Chiroptera Clan","The Nightwings","umbravel","Bat-folk with leathery wings and sharp, sorrowful faces; from noble pale elders to snarling hunters.","Umbravel's bat-kin, who carry messages between the silk districts and scout the deep webs. They are gentle with the city and merciless with intruders.","A Nightwing courier has gone missing in the deep webs with the only copy of the silk contract."],
["Crocodile Clan","The Mangrove Jaws","lumbaya","Heavy crocodile-folk, scaled and patient; druids in moss cloaks, guards in leather harness.","They guard the river-mouths and mangroves of Lumbaya and remember the temple-builders as friends. They can smell a nightshifter, which makes them very unpopular with the Nightmother.","The Mangrove Jaws offer to sniff out shapeshifters in one village, if the villagers will let a crocodile into every house."],
["Crustacean Clan","The Shellguard","goldmere_coast","Crab- and lobster-folk in lacquered armour, claws used as blades; some as big as carts.","Salvage samurai of the outer reefs, sworn to whichever captain feeds them. They moult every few years and are very vulnerable when they do.","A Shellguard champion is about to moult in the middle of the Krakenmother's war."],
["Crystalian / diamond clan","The Glasskin","sunscar","Humanoids with skin like polished chrome or crystal, reflecting light in rainbows.","Born where the glass streaks cross; the nomads say they are what is left of people the burning turned to glass. They remember the vanished empire's last day in fragments.","A Glasskin elder can remember the empire's last words, but only if she stands in the exact place she was made."],
["Cyclops clan","The One-Eyed Smiths","iron_hold","Huge one-eyed smiths and seers, from scholarly robed cyclopes to brawling forge-giants.","Ancient allies of the dwarves who see the flaws in metal and the cracks in futures. Skarn wants them as his armourers.","Skarn has taken a cyclops smith; her apprentice says she can see how the siege ends."],
["Demon Clan","Dominion folk","nox_dominion","Horned, ash-skinned demons of every shape: farmers, scholars, warlords and priests.","Ordinary demon civilians of Nox Dominion, many of whom fear the Overlord's Generals as much as the heroes do.","A demon scholar wants to defect, and she has brought a library with her."],
["Dragonkin Clan","The Scaleborn","dragon_spine","Small and large dragon-folk: kobold monks, bards with frills, gold-scaled sages in robes.","Lay brothers and sisters of the dragon-monasteries who believe they hatched from the sleeper's dreams. Vyrmax calls them traitors to the drakes.","A Scaleborn monk has started dreaming the sleeper's dreams, and they are getting shorter."],
["Dragon/wyvern Rider Clan","The Wyvern Oath","dragon_spine","Riders in light armour bonded to small dragons and wyverns that perch on their shoulders when young.","An order who raise wyverns from eggs in the monastery hatcheries. (Canon: the player cannot ride flying mounts, so riders are NPCs and allies, never mounts the player controls.)","A rider's wyvern has refused to fly since Vyrmax's attack; she needs to know why before it decides to leave."],
["Dwarf Clan","The Hold-clans","iron_hold","Dwarves of every trade: rune-scholars, smiths in layered plate, engineers with goggles and pistols.","The great clans of Karak Dûn, each with its craft, colours and grudges: smith-clans led by matriarchs, merchant clans who never leave the trade halls, engineer clans with pistols and goggles, and the old warrior clans who guard the gates.","Two Hold-clans are feuding over who forged the Furnace-Heart's grate, while Skarn is at the gate."],
["Eagle clan","The Thunder-Eyries","stormreach","Hawk-headed eagle-folk with storm-grey wings, rifles and spears; some marked with lightning scars.","Bird-folk who nest above the cliff-towns and serve as storm-callers' scouts. Raikaru hunts them first.","An eagle-folk scout claims Raikaru can be tricked into chasing a false storm."],
["Egyptian Clan","The Well-Keepers","sunscar","Robed scribes, priests and queens in gold collars and linen, carrying crooks and water jars.","The hereditary water-keepers of Qadira, inheritors of the vanished empire's rites. They write everything down and forgive nothing.","A Well-Keeper priestess believes the empire's last pharaoh is still giving the Colossus orders."],
["Elephant Clan","The Tuskers","zaruma","Elephant-folk of great dignity: tusked sages on thrones, gentle giants with clubs, war-elephants in armour.","Keepers of memory along the gold road, partners to the griots. A Tusker never forgets a debt or a kindness.","A Tusker elder remembers the day Mansacor first ate gold, and what it was hunting before."],
["Elk-kin/Antelopion Clan","The Antlered Court","everdusk","Stag-, elk- and antelope-folk with great antlers, in formal coats or bark armour; some carry swords, some staffs.","Mortal-blooded courtiers who serve the Summer Court as heralds and duellists. Their antlers shed each spring and are given as tokens of oath.","An Antlered herald has offered an outsider his shed antler; accepting it means accepting a duel."],
["Elven Clan","The Elves of Sylvaran","sylvaran","Court elves in gold-leaf armour, wood elves in green, a few pale exiles in chains.","Court elves of Lothaniel, wood elves of the moonwell hamlets, and a third, quieter strand: exiles of the Grey Hollow, cast out a generation ago for studying the fungus beneath the World Tree.","An exiled elf knows how Mycelia thinks, and the court would rather not ask her."],
["Emperor Clan","The Shogun's Houses","hoshizora","Samurai lords in lacquered armour under torii gates, archers in layered silk, an oni-masked general.","The great houses that serve the shogun, each with its own armour colour and crest. Some have quietly accepted Kurogane's masks.","A house lord wears Kurogane's mask in secret and wants to take it off before his own retainers notice."],
["Ethereal clan","The Starbodied","true_name_isles","Figures whose bodies are night sky and nebula, with eyes like stars; some wear ordinary clothes over the cosmos.","Children whose Naming Voyage returned them with a name too large for one body. They are calm, kind and slightly far away.","A Starbodied child can hear the Nameless Tide calling names, and one of them is hers."],
["Fairy Clan","The Wingborn","everdusk","Insect-winged fey with antennae and leaf armour, spear-wielders and tricksters.","The Summer Court's soldiery and messengers, losing ground to the Briar King's thorns.","A Wingborn messenger is trapped in a thorn-hedge and owes a favour to whoever frees her."],
["Falcon/ Hawk Clan","The Sun-Hawks","zarvan","Falcon-headed guardians in gold collars and blue robes, wings sometimes armoured.","Sky-watchers of the garden cities who guard the aqueducts from the air and were once the div-kings' allies.","A Sun-Hawk elder keeps a feather the div-king gave her, and Zahhar will listen to whoever carries it."],
["Forest Clan","The Rootwalkers","sylvaran","Treefolk and bark-armoured antlered wardens, with moss beards and glowing sap.","Living trees who woke to guard the twin groves. Mycelia's blight is to them what plague is to people.","A Rootwalker is infected and asking to be cut down before it spreads."],
["Hare Clan","The Longears","moraveil","Rabbit- and hare-folk: farmers, scouts and black-clad duellists with long knives.","Moraveil's fastest messengers and most stubborn farmers, who sit on the joint council beside humans and goblins.","A Longear scout has seen Grakkus's army and is the only one who knows the route it will take."],
["Giant Clan","The Hill-Kings","frostveil","Hill giants and half-giants in furs, bigger than longhouses, carrying ship-masts as clubs.","Half-giant families of the fjords who fought Ymgrir's kin in the old war and lost half their jarls.","A half-giant jarl wants the Thing to elect her war-king, and the human jarls are afraid of her."],
["Goblin Clan","The Six Clans of Hollowpine","whisperwood","Goblins with goggles, flamethrowers, mechanical arms and cockerel mounts.","Grukk's people are not all raiders. Hollowpine is a tinkering culture of scrap engines, fire-pots and cockerel cavalry, and its best inventors would rather build than burn.","A goblin tinker will build a better mill for Millbrook, if the village promises not to tell Grukk."],
["Golden Clan","The Gilded","aurumdeep","Warriors in ornate gold armour, on thrones or in phalanx, faces hidden behind gilded helms.","Descendants of Aurumdeep's survivors, sworn to guard their drowned kingdom from treasure-hunters.","The Gilded want one specific crown recovered, and they will not say why it matters."],
["Gorilla Clan","The Silverbacks","lumbaya","Massive gorilla-folk in armour and goggles, scholars and bruisers alike.","The jungle's engineers and guardians, who rebuilt the temple roads. They can smell fear, and they fear the Nightmother.","A Silverback has been replaced by a nightshifter, and his family is the only one that has noticed."],
["Greecian Clan","The Shieldwall","bastion","Hoplites with round bronze shields, crested helms and long spears.","Bastion's phalanx, drilled to hold a line of shields against cavalry. Every ring's captain comes from their ranks.","The Shieldwall has never broken; Thrakka is planning the charge that will make it."],
["Grizzly Bear Clan","The Ursa","frostveil","Bear-folk wizards, armoured berserkers and fur-cloaked druids.","Bear-folk of the fjords who hibernate through the darkest weeks and wake to defend the longhouses.","Ymgrir's winter has gone on so long that the Ursa have not woken up."],
